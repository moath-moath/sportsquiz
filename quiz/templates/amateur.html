<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المستوى الهاوي - لوحة الشرف الملكية</title>
    
    <link rel="icon" type="image/png" href="1_2.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(27, 38, 59, 0.7);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .honor-board {
            background: linear-gradient(135deg, #d4af37 0%, #f9f295 45%, #b8860b 50%, #f9f295 55%, #d4af37 100%);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #ffffff;
            color: #1a1a1a;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        
        .stat-card { 
            background: rgba(13, 27, 42, 0.8); 
            padding: 12px 5px; 
            border-radius: 18px; 
            border-bottom: 3px solid #415a77; 
        }

        .stat-label { font-size: 11px; color: #a2adbb; display: block; }
        .stat-value { font-size: 18px; font-weight: 900; }

        #game-area { 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 30px; 
            padding: 25px 15px; 
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #question { font-size: 1.3rem; margin-bottom: 20px; font-weight: 700; }

        .answers-container { display: grid; gap: 12px; }

        button.answer-btn { 
            background: #415a77; 
            color: white; 
            border: none; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: 700; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: 0.2s; 
            font-family: 'Cairo', sans-serif;
        }

        .correct { background: #00e676 !important; color: #000 !important; transform: scale(1.03); }
        .wrong { background: #ff5252 !important; animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        #skipBtn { 
            background: transparent; 
            width: 100%; 
            margin-top: 15px; 
            padding: 12px; 
            border-radius: 50px; 
            border: 1px solid #778da9; 
            color: #778da9; 
            cursor: pointer; 
            font-weight: bold;
        }

        #final-box { margin-top: 20px; display: none; }
    </style>
</head>

<body>
    <div class="container">
        <div class="honor-board">
            <div class="player-info">
                <h3 id="display-username">بطل مجهول</h3>
            </div>
            <span style="background:#1a1a1a; color:#ffd700; padding:5px 15px; border-radius:50px; font-size:12px; font-weight:bold;">🎖️ المستوى الهاوي</span>
        </div>

        <div class="stats-grid" id="stats-ui">
            <div class="stat-card"><span class="stat-label">السؤال</span><span id="progress-val" class="stat-value">1/10</span></div>
            <div class="stat-card"><span class="stat-label">الوقت</span><span id="timer-val" class="stat-value" style="color:#ffd600">20</span></div>
            <div class="stat-card"><span class="stat-label">النقاط</span><span id="score-val" class="stat-value" style="color:#00e676">0</span></div>
        </div>

        <div id="game-area">
            <div id="quiz-content">
                <h2 id="question">جاري تحميل الأسئلة...</h2>
                <div id="answers" class="answers-container"></div>
            </div>

            <div id="final-box">
                <h2 style="color:#ffd700">🎊 انتهى التحدي 🎊</h2>
                <div id="result" style="font-size: 24px; font-weight: 900; margin-bottom:15px; color: #fff;"></div>
                <p id="auto-redirect-msg" style="color:#ffd600; font-weight:bold;"></p>
            </div>
        </div>

        <button id="skipBtn">⏭ تخطي هذا السؤال</button>
    </div>

    <script>
        // 1. جلب اسم المستخدم وتحديث الشاشة
        const savedName = localStorage.getItem('username') || "بطل مجهول";
        document.getElementById("display-username").textContent = savedName;

        // 2. مصفوفة الأسئلة
        let questions = [
            { q: "من هو هداف كأس العالم 2014؟", a: ["جيمس رودريغيز", "ميسي", "مولر", "نيمار"], correct: 0 },
            { q: "نادي فاز بدوري أبطال أوروبا 2023؟", a: ["مانشستر سيتي", "ريال مدريد", "ليفربول", "بايرن ميونخ"], correct: 0 },
            { q: "أين لعب زيدان قبل ريال مدريد؟", a: ["يوفنتوس", "برشلونة", "ميلان", "مارسيليا"], correct: 0 },
            { q: "من هو 'الظاهرة'؟", a: ["رونالدو البرازيلي", "كريستيانو", "رونالدينيو", "ريفالدو"], correct: 0 },
            { q: "كم عدد بطولات كاس العالم للبرازيل؟", a: ["4", "5", "6", "3"], correct: 1 },
            { q: "من سجل هدف 'يد الله'؟", a: ["بيليه", "مارادونا", "ميسي", "رونالدو"], correct: 1 },
            { q: "أين أقيمت أول نسخة كأس عالم؟", a: ["البرازيل", "الأوروغواي", "إيطاليا", "فرنسا"], correct: 1 },
            { q: "ما هو لقب منتخب إيطاليا؟", a: ["الديوك", "الآزوري", "الماتادور", "الماكينات"], correct: 1 },
            { q: "أكثر لاعب فاز بالكرة الذهبية؟", a: ["رونالدو", "ميسي", "بلاتيني", "كرويف"], correct: 1 },
            { q: "نادي يلقب بـ 'السيدة العجوز'؟", a: ["ميلان", "إنتر ميلان", "يوفنتوس", "روما"], correct: 2 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timerId;
        let timeLeft = 20;

        // 3. وظيفة عرض السؤال
        function showQuestion() {
            if (currentQuestion >= questions.length) { 
                showFinal(); 
                return; 
            }

            // تحديث العداد
            document.getElementById("progress-val").innerText = `${currentQuestion + 1}/${questions.length}`;
            
            let q = questions[currentQuestion];
            document.getElementById("question").innerText = q.q;
            let answersDiv = document.getElementById("answers");
            answersDiv.innerHTML = "";
            
            q.a.forEach((answer, index) => {
                let btn = document.createElement("button");
                btn.className = "answer-btn";
                btn.innerText = answer;
                btn.onclick = () => checkAnswer(index, q.correct, btn);
                answersDiv.appendChild(btn);
            });

            startTimer();
        }

        // 4. نظام المؤقت
        function startTimer() {
            clearInterval(timerId);
            timeLeft = 20;
            document.getElementById("timer-val").innerText = timeLeft;
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById("timer-val").innerText = timeLeft;
                if (timeLeft <= 0) { 
                    clearInterval(timerId); 
                    nextQuestion(); 
                }
            }, 1000);
        }

        // 5. التحقق من الإجابة وتحديث النقاط
        function checkAnswer(selected, correct, btn) {
            clearInterval(timerId);
            let buttons = document.querySelectorAll(".answer-btn");
            buttons.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add("correct");
                score++;
                document.getElementById("score-val").innerText = score; // تحديث فوري للنقاط
            } else {
                btn.classList.add("wrong");
                buttons[correct].classList.add("correct");
            }
            setTimeout(nextQuestion, 1200);
        }

        function nextQuestion() {
            currentQuestion++;
            showQuestion();
        }

        // 6. زر التخطي
        document.getElementById("skipBtn").onclick = () => {
            clearInterval(timerId);
            nextQuestion();
        };

        // 7. عرض النتيجة النهائية والعودة
        function showFinal() {
            document.getElementById("quiz-content").style.display = "none";
            document.getElementById("skipBtn").style.display = "none";
            document.getElementById("stats-ui").style.display = "none";
            document.getElementById("final-box").style.display = "block";
            
            let evaluation = score >= 7 ? "خبير كروي ممتاز ⚽" : "أداء جيد، حاول مجدداً! 🔥";
            document.getElementById("result").innerHTML = `نتيجتك: ${score} من ${questions.length}<br>${evaluation}`;
            
            localStorage.setItem('amateur_score', score);

            let seconds = 5;
            const msg = document.getElementById("auto-redirect-msg");
            
            const interval = setInterval(() => {
                msg.innerText = `🔄 العودة للرئيسية خلال ${seconds}...`;
                if(seconds <= 0) {
                    clearInterval(interval);
                    // التعديل المهم لـ Django: العودة للمسار الرئيسي
                    window.location.href = "/"; 
                }
                seconds--;
            }, 1000);
        }

        // انطلاق اللعبة
        showQuestion();
    </script>
</body>
</html>
