<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سيرفر المطورين - مستوى الهاوي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(26, 26, 46, 0.95);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .honor-board {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            border-radius: 25px;
            margin-bottom: 20px;
            border: 2px solid #ffd700;
        }

        .level-badge { 
            background: #ffd700; color: #1e3c72; 
            padding: 8px 20px; border-radius: 50px; font-size: 14px; font-weight: bold;
            display: inline-block; margin-top: 10px;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #16213e; padding: 12px; border-radius: 20px; border: 1px solid #333; }
        .stat-card.timer { border-bottom: 4px solid #ffd700; }
        .stat-card.points { border-bottom: 4px solid #00ff88; }

        .stat-label { font-size: 10px; color: #888; display: block; }
        .stat-value { font-size: 18px; font-weight: 900; }

        #game-area {
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 25px 15px;
            min-height: 350px;
        }

        #question { font-size: 20px; font-weight: 700; margin-bottom: 25px; min-height: 60px; }

        .answers-container { display: grid; gap: 12px; }
        button.answer-btn {
            background: #0f3460; color: white; border: 1px solid #16213e;
            padding: 16px; font-size: 16px; font-weight: 600;
            border-radius: 18px; cursor: pointer; transition: 0.2s;
        }

        .correct { background: #00ff88 !important; color: #000 !important; font-weight: 900; }
        .wrong { background: #e94560 !important; }

        #skipBtn { background: none; border: none; color: #555; cursor: pointer; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="honor-board">
            <h3 style="margin:0;">سيرفر المطورين</h3>
            <span class="level-badge">👟 مستوى الهاوي (50 سؤال) 👟</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">السؤال</span>
                <span id="progress-val" class="stat-value">1/50</span>
            </div>
            <div class="stat-card timer">
                <span class="stat-label">الوقت</span>
                <span id="timer-val" class="stat-value">20</span>
            </div>
            <div class="stat-card points">
                <span class="stat-label">نقاط الجولة</span>
                <span id="session-points" class="stat-value">0</span>
            </div>
        </div>

        <div id="game-area">
            <div id="quiz-content">
                <div id="question">جاري التحميل...</div>
                <div id="answers" class="answers-container"></div>
            </div>
            <div id="result-box" style="display:none;">
                <h2>🎊 انتهى المستوى! 🎊</h2>
                <div id="final-score-text" style="font-size:30px; color:#ffd700; margin:20px;"></div>
                <button onclick="location.reload()" style="background:#ffd700; border:none; padding:15px 30px; border-radius:50px; font-weight:900; cursor:pointer;">تحدي جديد</button>
            </div>
        </div>
        <button id="skipBtn" onclick="nextQuestion()">تخطي السؤال ⏭</button>
    </div>

    <script>
        const bank = [
            {q:"من هو النادي الذي فاز بدوري أبطال أوروبا 2021؟", a:["تشيلسي","مانشستر سيتي","ريال مدريد","بايرن ميونخ"], c:"تشيلسي"},
            {q:"كم كرة ذهبية يملك ميسي؟", a:["8","7","5","6"], c:"8"},
            {q:"من هو الهداف التاريخي لكأس العالم؟", a:["كلوزه","رونالدو","بيليه","مونييه"], c:"كلوزه"},
            {q:"أي منتخب يلقب بالماكينات؟", a:["ألمانيا","إيطاليا","هولندا","السويد"], c:"ألمانيا"},
            {q:"مدرب حقق السداسية مع برشلونة 2009؟", a:["غوارديولا","إنريكي","زيدان","فينغر"], c:"غوارديولا"},
            {q:"أين أقيم كأس العالم 2010؟", a:["جنوب أفريقيا","البرازيل","ألمانيا","المكسيك"], c:"جنوب أفريقيا"},
            {q:"من هو الهداف التاريخي لمنتخب البرتغال؟", a:["رونالدو","إيزيبيو","فيغو","باوليتا"], c:"رونالدو"},
            {q:"ما هو لقب منتخب إنجلترا؟", a:["الأسود الثلاثة","الديوك","الماتادور","السامبا"], c:"الأسود الثلاثة"},
            {q:"كم عدد ألقاب البرازيل في المونديال؟", a:["5","4","6","3"], c:"5"},
            {q:"من صاحب 'رأسية القرن' في نهائي 2006؟", a:["زيدان","ماتيرازي","هنري","توتي"], c:"زيدان"},
            {q:"أي نادٍ يلقب بـ 'السيدة العجوز'؟", a:["يوفنتوس","ميلان","إنتر","لاتسيو"], c:"يوفنتوس"},
            {q:"ما هي جنسية زلاتان إبراهيموفيتش؟", a:["سويدي","بوسني","نرويجي","دنماركي"], c:"سويدي"},
            {q:"أين يقع ملعب 'كامب نو'؟", a:["برشلونة","مدريد","لندن","باريس"], c:"برشلونة"},
            {q:"من هو هداف الدوري الإنجليزي التاريخي؟", a:["آلان شيرر","هاري كين","روني","هنري"], c:"آلان شيرر"},
            {q:"كم عدد لاعبي الفريق في كرة القدم؟", a:["11","10","12","9"], c:"11"},
            {q:"من هو النادي الأكثر فوزاً بدوري أبطال أوروبا؟", a:["ريال مدريد","ميلان","ليفربول","بايرن"], c:"ريال مدريد"},
            {q:"أي نادٍ يلعب له محمد صلاح حالياً؟", a:["ليفربول","تشيلسي","روما","أرسنال"], c:"ليفربول"},
            {q:"ما هو لون قميص منتخب إيطاليا الأساسي؟", a:["أزرق","أحمر","أبيض","أخضر"], c:"أزرق"},
            {q:"من فاز بكأس العالم 2018؟", a:["فرنسا","كرواتيا","بلجيكا","إنجلترا"], c:"فرنسا"},
            {q:"كم مدة شوط المباراة الواحد؟", a:["45","40","50","35"], c:"45"},
            {q:"من الملقب بـ 'البرغوث'؟", a:["ميسي","نيمار","مودريتش","إيسكو"], c:"ميسي"},
            {q:"أي منتخب يلقب بـ 'الديوك'؟", a:["فرنسا","بلجيكا","البرتغال","سويسرا"], c:"فرنسا"},
            {q:"من سجل هدف فوز ألمانيا في نهائي 2014؟", a:["غوتزه","مولر","كلوزه","أوزيل"], c:"غوتزه"},
            {q:"أين لعب كريستيانو رونالدو قبل النصر؟", a:["مانشستر يونايتد","يوفنتوس","ريال مدريد","سبورتينغ"], c:"مانشستر يونايتد"},
            {q:"من هو النادي الملقب بـ 'الميرينغي'؟", a:["ريال مدريد","برشلونة","إشبيلية","فالنسيا"], c:"ريال مدريد"},
            {q:"في أي دوري يلعب نادي بايرن ميونخ؟", a:["الألماني","الإنجليزي","الإسباني","الفرنسي"], c:"الألماني"},
            {q:"من هو الحارس الملقب بـ 'العنكبوت الأسود'؟", a:["ليف ياشين","بوفون","كاسياس","نوير"], c:"ليف ياشين"},
            {q:"كم عدد تبديلات كرة القدم الحالية؟", a:["5","3","4","6"], c:"5"},
            {q:"أي نادٍ فاز بالدوري الإنجليزي 2016؟", a:["ليستر سيتي","مان سيتي","أرسنال","تشيلسي"], c:"ليستر سيتي"},
            {q:"من هو هداف كأس العالم 2022؟", a:["مبابي","ميسي","جيرود","ألفاريز"], c:"مبابي"},
            {q:"ما هو لقب نادي أرسنال؟", a:["المدفعجية","البلوز","السبيرز","الريدز"], c:"المدفعجية"},
            {q:"في أي مدينة يقع ملعب 'سانتياغو برنابيو'؟", a:["مدريد","برشلونة","مانشستر","ميلانو"], c:"مدريد"},
            {q:"من هو مدرب ريال مدريد حالياً؟", a:["أنشيلوتي","زيدان","كلوب","تشافي"], c:"أنشيلوتي"},
            {q:"ما هي جنسية إيرلينغ هالاند؟", a:["نرويجي","سويدي","ألماني","إنجليزي"], c:"نرويجي"},
            {q:"كم عدد كرات رونالدو الذهبية؟", a:["5","4","6","7"], c:"5"},
            {q:"من الملقب بـ 'الظاهرة'؟", a:["رونالدو البرازيلي","كريستيانو","روماريو","رونالدينيو"], c:"رونالدو البرازيلي"},
            {q:"ما هو النادي الذي يلقب بـ 'البلوغرانا'؟", a:["برشلونة","ليفانتي","باريس","بازل"], c:"برشلونة"},
            {q:"أي منتخب فاز بأول نسخة كأس عالم 1930؟", a:["أوروغواي","الأرجنتين","البرازيل","إإيطاليا"], c:"أوروغواي"},
            {q:"من سجل هدف 'يد الله' الشهير؟", a:["مارادونا","ميسي","بيليه","رونالدو"], c:"مارادونا"},
            {q:"ما هي جنسية ساديو ماني؟", a:["سنغالي","مالي","نيجيري","كاميروني"], c:"سنغالي"},
            {q:"أين يلعب نادي باريس سان جيرمان؟", a:["فرنسا","بلجيكا","سويسرا","هولندا"], c:"فرنسا"},
            {q:"من هو اللاعب الملقب بـ 'الرسام'؟", a:["إنييستا","تشافي","مودريتش","بيرلو"], c:"إنييستا"},
            {q:"كم عدد بطولات مصر في أمم أفريقيا؟", a:["7","5","6","8"], c:"7"},
            {q:"ما هو النادي الذي فاز بالدوري الإيطالي 2023؟", a:["نابولي","ميلان","إنتر","يوفنتوس"], c:"نابولي"},
            {q:"من هو صاحب أسرع هدف في تاريخ البريميرليغ؟", a:["شين لونغ","هنري","صلاح","شيرر"], c:"شين لونغ"},
            {q:"من هو النادي الملقب بـ 'الشياطين الحمر'؟", a:["مانشستر يونايتد","ليفربول","بايرن","أرسنال"], c:"مانشستر يونايتد"},
            {q:"أي نادٍ يلعب فيه كيفين دي بروين؟", a:["مانشستر سيتي","ليفربول","تشيلسي","بايرن"], c:"مانشستر سيتي"},
            {q:"كم مرة استضافت المكسيك كأس العالم؟", a:["2","1","3","0"], c:"2"},
            {q:"من هو النجم المصري الذي فاز بدوري الأبطال؟", a:["محمد صلاح","النني","تريزيغيه","مرموش"], c:"محمد صلاح"},
            {q:"ما هو لقب منتخب المغرب؟", a:["أسود الأطلس","النسور","الفراعنة","النجوم السوداء"], c:"أسود الأطلس"}
        ];

        let questions = [];
        let currentIndex = 0;
        let scoreInSession = 0; // نقاط الجولة الحالية فقط
        let timer;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function init() {
            questions = [...bank];
            shuffle(questions);
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= 50) return finish();

            clearInterval(timer);
            let timeLeft = 20;
            document.getElementById('timer-val').innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) nextQuestion();
            }, 1000);

            document.getElementById('progress-val').innerText = `${currentIndex + 1}/50`;
            const q = questions[currentIndex];
            document.getElementById('question').innerText = q.q;

            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            
            let options = [...q.a];
            shuffle(options);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, q.c);
                ansBox.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            clearInterval(timer);
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('correct');
                
                // 1. زيادة نقاط الجولة الحالية (اللي بتشوفها قدامك)
                scoreInSession++;
                document.getElementById('session-points').innerText = scoreInSession;
                
                // 2. حفظ النقطة في الذاكرة الكلية في الخلفية (بدون ما تظهر فوق)
                let total = parseInt(localStorage.getItem('user_total_points')) || 0;
                localStorage.setItem('user_total_points', total + 1);
            } else {
                btn.classList.add('wrong');
                btns.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
            }

            setTimeout(nextQuestion, 1000);
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function finish() {
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('final-score-text').innerText = `جمعت ${scoreInSession} نقطة في هذه الجولة!`;
        }

        window.onload = init;
    </script>
</body>
</html>
