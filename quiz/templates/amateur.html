<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الأبطال - مستوى الهاوي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(26, 26, 46, 0.95);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
        }

        .honor-board {
            background: linear-gradient(110deg, #bf953f 20%, #fcf6ba 40%, #b38728 50%, #fcf6ba 70%, #aa771c 80%);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(191, 149, 63, 0.4);
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .player-info h3 { 
            margin: 5px 0; 
            font-size: 24px; 
            font-weight: 900; 
            color: #1a1a2e;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        .encouragement { 
            color: #5d4037; 
            font-weight: 900; 
            font-size: 16px; 
            display: block; 
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .level-badge { 
            background: #1a1a2e; color: #ffd700; 
            padding: 6px 25px; border-radius: 50px; font-size: 14px; font-weight: 900;
            display: inline-block; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #16213e; padding: 12px; border-radius: 20px; border: 1px solid #333; }
        .stat-card.timer { border-bottom: 4px solid #ffd700; }
        .stat-card.points { border-bottom: 4px solid #00ff88; }

        .stat-label { font-size: 10px; color: #888; display: block; }
        .stat-value { font-size: 18px; font-weight: 900; }

        #game-area {
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 25px 15px;
            min-height: 350px;
            margin-bottom: 50px;
        }

        #question { font-size: 20px; font-weight: 700; margin-bottom: 25px; min-height: 60px; line-height: 1.4; }

        .answers-container { display: grid; gap: 12px; }
        
        button.answer-btn {
            background: #0f3460; color: white; border: 1px solid #16213e;
            padding: 18px 15px; font-size: 17px; font-weight: 700;
            border-radius: 20px; cursor: pointer; transition: 0.2s;
            width: 100%;
            line-height: 1.2;
        }

        .correct { background: #00ff88 !important; color: #000 !important; font-weight: 900; }
        .wrong { background: #e94560 !important; }

        #skipBtn, #hintBtn { 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #bf953f;
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            position: absolute;
            bottom: 20px;
            width: auto;
        }

        #skipBtn { left: 20px; }
        #hintBtn { right: 20px; border-color: #ffd700; color: #ffd700; background: rgba(255, 215, 0, 0.05); }

        #hintBtn:disabled { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        
        #result-box h2 { margin-bottom: 10px; }
        
        .restart-btn {
            background: #ffd700; color: #000; padding: 15px 30px;
            border-radius: 50px; border: none; font-weight: 900;
            font-size: 18px; cursor: pointer; margin-top: 20px;
        }

        .google-login-btn {
            background: #4285F4;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="honor-board">
            <span class="encouragement">TOP CHAMPION</span>
            <div class="player-info">
                <h3 id="display-username">جاري التحميل...</h3>
            </div>
            <span class="level-badge">مستوى الهاوي</span>
        </div>

        <div class="stats-grid" id="stats-ui">
            <div class="stat-card">
                <span class="stat-label">السؤال</span>
                <span id="progress-val" class="stat-value">1/50</span>
            </div>
            <div class="stat-card timer">
                <span class="stat-label">الوقت</span>
                <span id="timer-val" class="stat-value" style="color:#ffd700">20</span>
            </div>
            <div class="stat-card points">
                <span class="stat-label">نقاط الجولة</span>
                <span id="session-points" class="stat-value" style="color:#00ff88">0</span>
            </div>
        </div>

        <div id="game-area">
            <div id="quiz-content">
                <div id="question">برجاء تسجيل الدخول للبدء...</div>
                <div id="answers" class="answers-container"></div>
            </div>

            <div id="result-box" style="display:none;">
                <h2>🎊 انتهى المستوى! 🎊</h2>
                <div id="final-score-text" style="font-size:35px; font-weight:900; color:#ffd700; margin:20px;"></div>
                <button class="restart-btn" onclick="location.reload()">🔄 تحدي جديد</button>
                <p id="redirect-msg" style="margin-top: 25px; color: #888; font-size: 14px;">
                    العودة للقائمة الرئيسية خلال <span id="countdown">5</span> ثوانٍ...
                </p>
            </div>
        </div>

        <button id="skipBtn" onclick="nextQuestion()">
            <span>⏭</span>
            <span>تخطي</span>
        </button>

        <button id="hintBtn" onclick="useHint()">
            <span>تلميح</span>
            <span>💡</span>
        </button>
    </div>

    <!-- كود Firebase المحدث للحفظ التراكمي في مجموعة users -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, increment, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAEKcYJkl2mpGaM04ppixUnGeygKn3Nu_8",
            authDomain: "champions-challenge-2a13a.firebaseapp.com",
            projectId: "champions-challenge-2a13a",
            storageBucket: "champions-challenge-2a13a.firebasestorage.app",
            messagingSenderId: "267945781501",
            appId: "1:267945781501:web:6be03f02151127aec0b694",
            measurementId: "G-6EYLJ9SYJ0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider).catch((error) => {
                alert("فشل الدخول: " + error.message);
            });
        };

        onAuthStateChanged(auth, async (user) => {
            const displayArea = document.getElementById('display-username');
            if (user) {
                // محاولة جلب الاسم المخصص من المستند في Firestore
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists() && userSnap.data().name) {
                    displayArea.innerText = userSnap.data().name;
                } else {
                    displayArea.innerText = user.displayName;
                }
                initGame(); 
            } else {
                displayArea.innerHTML = `<button onclick="loginWithGoogle()" class="google-login-btn">سجل دخولك بجوجل</button>`;
                document.getElementById('question').innerText = "يجب تسجيل الدخول بجوجل لحفظ نقاطك والبدء في التحدي";
            }
        });

        // دالة الحفظ المحدثة: تزيد الحقل totalPoints سؤالاً بسؤال
        window.savePointToCloud = async function() {
            const user = auth.currentUser;
            if (!user) return;

            const userRef = doc(db, "users", user.uid);

            try {
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    await updateDoc(userRef, {
                        totalPoints: increment(1),
                        lastActive: serverTimestamp()
                    });
                } else {
                    // إذا كان أول مرة يلعب، ننشئ المستند
                    await setDoc(userRef, {
                        name: user.displayName,
                        email: user.email,
                        totalPoints: 1,
                        lastActive: serverTimestamp()
                    });
                }
                console.log("Point synced to cloud.");
            } catch (e) {
                console.error("Cloud sync error:", e);
            }
        };
    </script>

            {q:"في أي دوري يلعب نادي بايرن ميونخ؟", a:["الألماني","الإنجليزي","الإسباني","الفرنسي"], c:"الألماني"},
            {q:"من هو الحارس الملقب بـ 'العنكبوت الأسود'؟", a:["ليف ياشين","بوفون","كاسياس","نوير"], c:"ليف ياشين"},

            {q:"في أي مدينة يقع ملعب 'سانتياغو برنابيو'؟", a:["مدريد","برشلونة","مانشستر","ميلانو"], c:"مدريد"},
            {q:"من هو مدرب ريال مدريد حالياً؟", a:["أنشيلوتي","زيدان","كلوب","تشافي"], c:"أنشيلوتي"},

            {q:"من هو النجم المصري الذي فاز بدوري الأبطال؟", a:["محمد صلاح","النني","تريزيغيه","مرموش"], c:"محمد صلاح"},
            {q:"ما هو لقب منتخب المغرب؟", a:["أسود الأطلس","النسور","الفراعنة","النجوم السوداء"], c:"أسود الأطلس"}
        ];

        let questions = [];
        let currentIndex = 0;
        let scoreInSession = 0;
        let timer;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        window.initGame = function() {
            questions = [...bank];
            shuffle(questions);
            currentIndex = 0;
            scoreInSession = 0;
            document.getElementById('session-points').innerText = "0";
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= 50) return finish();
            document.getElementById('hintBtn').disabled = false;
            clearInterval(timer);
            let timeLeft = 20;
            document.getElementById('timer-val').innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) nextQuestion();
            }, 1000);
            document.getElementById('progress-val').innerText = `${currentIndex + 1}/50`;
            const q = questions[currentIndex];
            document.getElementById('question').innerText = q.q;
            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            let options = [...q.a];
            shuffle(options);
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, q.c);
                ansBox.appendChild(btn);
            });
        }

        function useHint() {
            const q = questions[currentIndex];
            const btns = document.querySelectorAll('.answer-btn');
            let wrongFound = 0;
            btns.forEach(btn => {
                if (btn.innerText !== q.c && wrongFound < 2) {
                    btn.style.visibility = 'hidden';
                    wrongFound++;
                }
            });
            document.getElementById('hintBtn').disabled = true;
        }

        function checkAnswer(btn, selected, correct) {
            clearInterval(timer);
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');
            
            if (selected === correct) {
                btn.classList.add('correct');
                scoreInSession++;
                document.getElementById('session-points').innerText = scoreInSession;
                
                // تحديث قاعدة البيانات فوراً بنقطة واحدة
                if (typeof window.savePointToCloud === "function") {
                    window.savePointToCloud(); 
                }
            } else {
                btn.classList.add('wrong');
                btns.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
            }
            setTimeout(nextQuestion, 1000);
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function finish() {
            clearInterval(timer);
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            document.getElementById('hintBtn').style.display = 'none';
            document.getElementById('stats-ui').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('final-score-text').innerText = `جمعت ${scoreInSession} نقطة!`;

            let count = 5;
            const countDisplay = document.getElementById('countdown');
            const redirectTimer = setInterval(() => {
                count--;
                countDisplay.innerText = count;
                if (count <= 0) {
                    clearInterval(redirectTimer);
                    window.location.href = 'index.html'; 
                }
            }, 1000);
        }
    </script>
</body>
</html>
