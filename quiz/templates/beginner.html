<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المستوى المبتدئ - لوحة الشرف الملكية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(27, 38, 59, 0.7);
            padding: 25px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        /* لوحة الشرف الملكية */
        .honor-board {
            background: linear-gradient(135deg, #d4af37 0%, #f9f295 45%, #b8860b 50%, #f9f295 55%, #d4af37 100%);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid #ffffff;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
            color: #1a1a1a;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .player-info h3 { margin: 5px 0; font-size: 22px; font-weight: 900; }
        .level-badge { 
            background: #1a1a1a; color: #ffd700; 
            padding: 5px 15px; border-radius: 50px; font-size: 13px; font-weight: bold;
            display: inline-block; margin-top: 5px;
        }

        /* العدادات */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(13, 27, 42, 0.8);
            padding: 15px 5px;
            border-radius: 20px;
            border-bottom: 4px solid #415a77;
            transition: 0.3s;
        }

        .stat-label { font-size: 11px; color: #a2adbb; display: block; margin-bottom: 5px; }
        .stat-value { font-size: 20px; font-weight: 900; }

        /* منطقة اللعب */
        #game-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 30px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #question { font-size: 24px; line-height: 1.4; font-weight: 700; margin-bottom: 30px; }

        .answers-container { display: grid; gap: 15px; }

        button.answer-btn {
            background: #415a77;
            color: white;
            border: none;
            padding: 20px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 22px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
            border: 1px solid rgba(255,255,255,0.1);
        }

        button.answer-btn:hover { background: #5a7ea3; }
        button.answer-btn:active { transform: scale(0.95); }

        .correct { background: linear-gradient(90deg, #00b09b, #96c93d) !important; transform: scale(1.05); }
        .wrong { background: linear-gradient(90deg, #ff416c, #ff4b2b) !important; animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        #skipBtn {
            background: rgba(255,255,255,0.05);
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: 2px solid #778da9;
            color: #778da9;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        #skipBtn:hover { background: #778da9; color: #0d1b2a; }

        #result-box { display: none; padding: 20px; }
        .final-score { font-size: 40px; font-weight: 900; color: #ffd700; margin: 15px 0; }
        #auto-redirect-msg { color: #778da9; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="honor-board">
            <div class="player-info">
                <span style="font-size: 12px; font-weight: bold;">TOP PLAYER</span>
                <h3 id="display-username">بطل مجهول</h3>
            </div>
            <span class="level-badge">🔰 المستوى المبتدئ</span>
        </div>

        <div class="stats-grid" id="stats-ui">
            <div class="stat-card"><span class="stat-label">السؤال</span><span id="progress-val" class="stat-value">1/50</span></div>
            <div class="stat-card" style="border-bottom-color: #ffd600;"><span class="stat-label">الوقت</span><span id="timer-val" class="stat-value" style="color:#ffd600">20</span></div>
            <div class="stat-card" style="border-bottom-color: #00e676;"><span class="stat-label">النقاط</span><span id="score-val" class="stat-value" style="color:#00e676">0</span></div>
        </div>

        <div id="game-area">
            <h2 id="question">جاري التحميل...</h2>
            <div id="answers" class="answers-container"></div>
            
            <div id="result-box">
                <h2 id="final-title"></h2>
                <div class="final-score" id="final-score-val"></div>
                <p id="final-rank"></p>
                <p id="auto-redirect-msg">🔄 العودة للرئيسية خلال <span id="countdown-redirect">10</span> ثوانٍ...</p>
            </div>
        </div>

        <button id="skipBtn">⏭ تخطي السؤال</button>
    </div>

    <script>
        // سحب الاسم
        document.getElementById("display-username").textContent = localStorage.getItem('username') || "بطل مجهول";

        // مصفوفة الأسئلة (نفس اللي بعثتها)
        let questions = [
            { q: "كم عدد لاعبي فريق كرة القدم في الملعب؟", a: ["9", "10", "11", "12"], correct: 2 },
            { q: "ما لون البطاقة التي تعني طرد اللاعب؟", a: ["الأصفر", "الأحمر", "الأزرق", "الأخضر"], correct: 1 },
            { q: "كم مدة مباراة كرة القدم الأساسية؟", a: ["60 دقيقة", "70 دقيقة", "80 دقيقة", "90 دقيقة"], correct: 3 },
            { q: "ما اسم البطولة الأكبر للمنتخبات عالمياً؟", a: ["كأس العالم", "كأس آسيا", "كأس أوروبا", "كوبا أمريكا"], correct: 0 },
            { q: "أي جزء من الجسم يمنع لمسه للاعب غير الحارس؟", a: ["الرأس", "القدم", "اليد", "الكتف"], correct: 2 },
            { q: "كم عدد الأشواط في مباراة كرة القدم؟", a: ["1", "2", "3", "4"], correct: 1 },
            { q: "من هو اللاعب الذي يرتدي قفازات؟", a: ["المدافع", "حارس المرمى", "المهاجم", "الجناح"], correct: 1 },
            { q: "كم عدد الحكام المساعدين (حكام الراية)؟", a: ["2", "3", "1", "4"], correct: 0 },
            { q: "ماذا تسمى الركلة التي تبدأ بها المباراة؟", a: ["ضربة البداية", "ركلة جزاء", "ركلة حرة", "ضربة مرمى"], correct: 0 },
            { q: "أكثر منتخب فاز بكأس العالم في التاريخ؟", a: ["البرازيل", "ألمانيا", "إيطاليا", "الأرجنتين"], correct: 0 },
            { q: "في أي دولة أقيم كأس العالم 2022؟", a: ["قطر", "البرازيل", "روسيا", "فرنسا"], correct: 0 },
            { q: "ما هو النادي الملقب بـ 'المرنغي'؟", a: ["برشلونة", "ريال مدريد", "يوفنتوس", "بايرن ميونخ"], correct: 1 },
            { q: "كم عدد اللاعبين الاحتياط المسموح بتبديلهم عادة؟", a: ["3", "5", "7", "2"], correct: 1 },
            { q: "أين تقع نقطة ركلة الجزاء؟", a: ["داخل المنطقة", "خارج المنطقة", "خط المرمى", "نصف الملعب"], correct: 0 },
            { q: "ما هو طول شوط المباراة الواحد؟", a: ["45 دقيقة", "30 دقيقة", "15 دقيقة", "60 دقيقة"], correct: 0 },
            { q: "كم عدد القوائم الجانبية للمرمى الواحد؟", a: ["1", "2", "3", "4"], correct: 1 },
            { q: "أي منتخب يرتدي اللون الأزرق والأسود (التانغو)؟", a: ["الأرجنتين", "الأوروغواي", "البرازيل", "إيطاليا"], correct: 0 },
            { q: "ما اسم الكرة الرسمية لكأس العالم؟", a: ["أديداس", "نايكي", "بوما", "أومبرو"], correct: 0 },
            { q: "هل يسمح للمدرب بدخول أرض الملعب أثناء اللعب؟", a: ["نعم", "لا", "أحياناً", "بإذن الحكم"], correct: 1 },
            { q: "ماذا يحدث إذا تعادل الفريقان في نهائي الكأس؟", a: ["أشواط إضافية", "إلغاء المباراة", "تقاسم الكأس", "قرعة"], correct: 0 },
            { q: "من هو الهداف التاريخي لكأس العالم؟", a: ["رونالدو", "ميسي", "كلوزه", "بيليه"], correct: 2 },
            { q: "كم مرة فازت ألمانيا بكأس العالم؟", a: ["4 مرات", "3 مرات", "5 مرات", "2 مرات"], correct: 0 },
            { q: "ما هو اللون المفضل لقميص منتخب البرازيل؟", a: ["الأصفر", "الأحمر", "الأخضر", "الأزرق"], correct: 0 },
            { q: "أين يلعب نادي مانشستر يونايتد؟", a: ["إنجلترا", "إسبانيا", "ألمانيا", "إيطاليا"], correct: 0 },
            { q: "ما هو اللقب الشهير لمنتخب مصر؟", a: ["الفراعنة", "النسور", "الأسود", "الخضر"], correct: 0 },
            { q: "كم دقيقة وقت الاستراحة بين الشوطين؟", a: ["15 دقيقة", "5 دقائق", "20 دقيقة", "10 دقائق"], correct: 0 },
            { q: "أي لاعب يلقب بـ 'الدون'؟", a: ["ميسي", "رونالدو", "نيمار", "مبابي"], correct: 1 },
            { q: "ما هو النادي الذي يلقب بـ 'البلوغرانا'؟", a: ["برشلونة", "ميلان", "تشيلسي", "أتلتيكو"], correct: 0 },
            { q: "كم عدد زوايا الملعب (ركنية)؟", a: ["2", "4", "6", "8"], correct: 1 },
            { q: "ما هو شكل ملعب كرة القدم؟", a: ["مربع", "مستطيل", "دائري", "بيضاوي"], correct: 1 },
            { q: "من هو 'الجوهرة السوداء' في تاريخ الكرة؟", a: ["بيليه", "مارادونا", "زيدان", "كاكا"], correct: 0 },
            { q: "أي دولة فازت بأول كأس عالم 1930؟", a: ["الأوروغواي", "البرازيل", "فرنسا", "الأرجنتين"], correct: 0 },
            { q: "كم فريقاً يتأهل لمجموعات دوري أبطال أوروبا؟", a: ["32", "16", "24", "48"], correct: 0 },
            { q: "ما اسم الملعب الشهير لنادي ريال مدريد؟", a: ["كامب نو", "سانتياغو برنابيو", "أليانز أرينا", "أنفيلد"], correct: 1 },
            { q: "كم عدد تبديلات الوقت الإضافي الإضافية؟", a: ["1", "2", "3", "0"], correct: 0 },
            { q: "من هو مدرب المنتخب المغربي في مونديال 2022؟", a: ["وليد الركراكي", "بادو الزاكي", "رونار", "خليلوزيتش"], correct: 0 },
            { q: "ما لون قميص نادي ليفربول الأساسي؟", a: ["الأحمر", "الأبيض", "الأزرق", "الأصفر"], correct: 0 },
            { q: "كم يبلغ قطر كرة القدم تقريباً؟", a: ["22 سم", "50 سم", "10 سم", "40 سم"], correct: 0 },
            { q: "ما هو أقصر وقت ممكن لتسجيل هدف؟", a: ["ثواني معدودة", "5 دقائق", "دقيقة", "10 دقائق"], correct: 0 },
            { q: "أي قارة فازت بأكثر عدد من كؤوس العالم؟", a: ["أوروبا", "أمريكا الجنوبية", "أفريقيا", "آسيا"], correct: 0 },
            { q: "ما هو الدوري الملقب بـ 'البريميرليغ'؟", a: ["الإنجليزي", "الإسباني", "الإيطالي", "الفرنسي"], correct: 0 },
            { q: "كم مرة فازت الأرجنتين بكأس العالم؟", a: ["3 مرات", "2 مرات", "4 مرات", "5 مرات"], correct: 0 },
            { q: "ما اسم الجائزة التي تمنح لأفضل لاعب في العالم؟", a: ["الكرة الذهبية", "الحذاء الذهبي", "كأس التميز", "القفاز الذهبي"], correct: 0 },
            { q: "من هو الحارس الوحيد الذي فاز بالكرة الذهبية؟", a: ["ليف ياشين", "بوفون", "كاسياس", "نوير"], correct: 0 },
            { q: "أي منتخب يلقب بـ 'الماكينات'؟", a: ["ألمانيا", "إيطاليا", "هولندا", "بلجيكا"], correct: 0 },
            { q: "كم تبلغ المسافة بين المرميين في الملعب؟", a: ["90-120 متر", "50 متر", "200 متر", "80 متر"], correct: 0 },
            { q: "ماذا يلبس اللاعب تحت الجوارب لحماية ساقه؟", a: ["واقي الساق", "حزام", "قطن", "حديد"], correct: 0 },
            { q: "هل يمكن تسجيل هدف من ركلة ركنية مباشرة؟", a: ["نعم", "لا", "فقط في الوديات", "بإذن المدرب"], correct: 0 },
            { q: "ما اسم التقنية التي تساعد الحكم بالفيديو؟", a: ["VAR", "GPS", "WI-FI", "GOAL-LINE"], correct: 0 },
            { q: "كم عدد لاعبي الفريقين معاً في الملعب؟", a: ["22 لاعب", "11 لاعب", "20 لاعب", "24 لاعب"], correct: 0 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timerId;
        let timeLeft = 20;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        shuffle(questions);

        function startTimer() {
            clearInterval(timerId);
            timeLeft = 20;
            document.getElementById("timer-val").innerText = timeLeft;
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById("timer-val").innerText = timeLeft;
                if (timeLeft <= 0) { clearInterval(timerId); nextQuestion(); }
            }, 1000);
        }

        function showQuestion() {
            if (currentQuestion >= questions.length) { showFinal(); return; }
            
            document.getElementById("progress-val").innerText = `${currentQuestion + 1}/${questions.length}`;
            let q = questions[currentQuestion];
            startTimer();
            
            document.getElementById("question").innerText = q.q;
            let answersDiv = document.getElementById("answers");
            answersDiv.innerHTML = "";
            
            q.a.forEach((answer, index) => {
                let btn = document.createElement("button");
                btn.className = "answer-btn";
                btn.innerText = answer;
                btn.onclick = () => checkAnswer(index, q.correct, btn);
                answersDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btn) {
            clearInterval(timerId);
            let buttons = document.querySelectorAll(".answer-btn");
            buttons.forEach(b => b.disabled = true);
            
            if (selected === correct) {
                btn.classList.add("correct");
                score++;
                document.getElementById("score-val").innerText = score;
            } else {
                btn.classList.add("wrong");
                buttons[correct].classList.add("correct");
            }
            setTimeout(nextQuestion, 1200);
        }

        function nextQuestion() {
            currentQuestion++;
            showQuestion();
        }

        document.getElementById("skipBtn").onclick = () => {
            clearInterval(timerId);
            nextQuestion();
        };

        function showFinal() {
            // إخفاء عناصر اللعب
            document.getElementById("question").style.display = "none";
            document.getElementById("answers").style.display = "none";
            document.getElementById("stats-ui").style.display = "none";
            document.getElementById("skipBtn").style.display = "none";
            
            // إظهار صندوق النتيجة
            const resultBox = document.getElementById("result-box");
            resultBox.style.display = "block";
            
            let rank = score < 20 ? "مبتدئ 🐣" : score < 40 ? "محترف 👍" : "أسطورة 👑";
            document.getElementById("final-title").innerText = "🎊 اكتمل التحدي! 🎊";
            document.getElementById("final-score-val").innerText = `${score} / 50`;
            document.getElementById("final-rank").innerText = `تقييمك: ${rank}`;

            // العد التنازلي للتوجيه
            let redirectTime = 10;
            const countdownEl = document.getElementById("countdown-redirect");
            const redirectInterval = setInterval(() => {
                redirectTime--;
                countdownEl.innerText = redirectTime;
                if (redirectTime <= 0) {
                    clearInterval(redirectInterval);
                    window.location.href = "/";
                }
            }, 1000);
        }

        showQuestion();
    </script>
</body>
</html>
