<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سيرفر المطورين - المستوى المبتدئ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(27, 38, 59, 0.7);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .honor-board {
            background: linear-gradient(135deg, #00e676 0%, #b2ff59 100%);
            padding: 20px;
            border-radius: 25px;
            margin-bottom: 20px;
            color: #1a1a1a;
            box-shadow: 0 10px 20px rgba(0, 230, 118, 0.2);
        }

        .encouragement { color: #1b263b; font-weight: 900; font-size: 14px; display: block; margin-bottom: 5px; }
        
        /* مكان اسم اللاعب حسب الصورة */
        .player-info h3 { 
            margin: 5px 0; 
            font-size: 28px; 
            font-weight: 900; 
            letter-spacing: -1px;
        }
        
        .level-badge { 
            background: #1a1a1a; color: #00e676; 
            padding: 8px 20px; border-radius: 50px; font-size: 14px; font-weight: bold;
            display: inline-block; margin-top: 10px; border: 2px solid #00e676;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #1b263b; padding: 15px 5px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-card.timer { border-bottom: 4px solid #ffd600; }
        .stat-card.points { border-bottom: 4px solid #00e676; }

        .stat-label { font-size: 12px; color: #a2adbb; display: block; margin-bottom: 8px; }
        .stat-value { font-size: 22px; font-weight: 900; }

        #game-area {
            background: rgba(13, 27, 42, 0.5);
            border-radius: 30px;
            padding: 30px 20px;
            margin-bottom: 15px;
            min-height: 380px;
        }

        #question { font-size: 20px; font-weight: 900; margin-bottom: 30px; line-height: 1.4; min-height: 60px; }

        .answers-container { display: grid; gap: 15px; }
        button.answer-btn {
            background: #415a77; color: white; border: none;
            padding: 18px; font-size: 16px; font-weight: 700;
            border-radius: 20px; cursor: pointer; transition: 0.2s;
        }

        .correct { background: #00e676 !important; color: #000 !important; font-weight: 900; }
        .wrong { background: #ff5252 !important; }

        /* تعديل زر التخطي ليصبح "حلو زيي" 😉 */
        #skipBtn { 
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #778da9;
            color: #e0e1dd;
            padding: 12px 30px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            width: fit-content;
        }
        
        #skipBtn:active {
            transform: scale(0.95);
            background: rgba(119, 141, 169, 0.2);
        }

        #result-box { display: none; }
        
        .restart-btn {
            background: #00e676; color: #000; padding: 15px 30px;
            border-radius: 50px; border: none; font-weight: 900;
            font-size: 18px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="honor-board">
            <span class="encouragement">🌟 بداية طريق العمالقة 🌟</span>
            <div class="player-info">
                <!-- هذا هو المكان المطلوب لاسم اللاعب -->
                <h3 id="display-username">جاري التحميل...</h3>
            </div>
            <span class="level-badge">✅ المستوى المبتدئ ✅</span>
        </div>

        <div class="stats-grid" id="stats-ui">
            <div class="stat-card">
                <span class="stat-label">السؤال</span>
                <span id="progress-val" class="stat-value">1/50</span>
            </div>
            <div class="stat-card timer">
                <span class="stat-label">الوقت</span>
                <span id="timer-val" class="stat-value" style="color:#ffd600">20</span>
            </div>
            <div class="stat-card points">
                <span class="stat-label">نقاط الجولة</span>
                <span id="score-val" class="stat-value" style="color:#00e676">0</span>
            </div>
        </div>

        <div id="game-area">
            <div id="quiz-content">
                <h2 id="question">جاري التحميل...</h2>
                <div id="answers" class="answers-container"></div>
            </div>

            <div id="result-box">
                <h2 id="final-title">🎊 انتهت الجولة! 🎊</h2>
                <div style="font-size: 40px; font-weight: 900; color: #ffd700; margin: 15px 0;" id="final-score-val">0 / 50</div>
                <p id="final-rank" style="font-size: 20px; font-weight: bold;"></p>
                
                <button class="restart-btn" onclick="location.reload()">🔄 إعادة المحاولة</button>
                
                <p id="redirect-msg" style="margin-top: 25px; color: #a2adbb; font-size: 14px;">
                    سيتم الرجوع للقائمة الرئيسية خلال <span id="countdown">5</span> ثوانٍ...
                </p>
            </div>
        </div>

        <!-- زر التخطي المطور -->
        <button id="skipBtn" onclick="nextQuestion()">
            <span>تخطي السؤال</span>
            <span>⏭</span>
        </button>
    </div>

    <script>
        // بنك الأسئلة (بدون تعديل كما وعدتك)
        const bank = [
            {q:"كم لاعب يبدأ المباراة في كل فريق؟", a:["11","7","9","10"], c:"11"},
            {q:"ما هو لون بطاقة الإنذار؟", a:["أصفر","أحمر","أزرق","أبيض"], c:"أصفر"},
            {q:"كم عدد أشواط مباراة كرة القدم؟", a:["شوطين","شوط واحد","3 أشواط","4 أشواط"], c:"شوطين"},
            {q:"ما هو النادي الملقب بالـ (بلوز)؟", a:["تشيلسي","أرسنال","مان سيتي","إيفرتون"], c:"تشيلسي"},
            {q:"من هو صاحب لقب ملك كرة القدم؟", a:["بيليه","مارادونا","ميسي","رونالدو"], c:"بيليه"},
            {q:"أين يضع الحارس الكرة عند ركلة المرمى؟", a:["خط الـ 6 ياردة","نقطة الجزاء","خط الوسط","خارج الملعب"], c:"خط الـ 6 ياردة"},
            {q:"كم عدد الحكام في ساحة الملعب؟", a:["حكم واحد","حكمان","3 حكام","4 حكام"], c:"حكم واحد"},
            {q:"ماذا يرتدي اللاعب لحماية قدمه من الضربات؟", a:["الشنكار","القفاز","الرباط","الخوذة"], c:"الشنكار"},
            {q:"أي فريق يرتدي اللون الأحمر في إنجلترا؟", a:["ليفربول","مان سيتي","توتنهام","تشيلسي"], c:"ليفربول"},
            {q:"ما هي جنسية اللاعب نيمار؟", a:["برازيلي","أرجنتيني","إسباني","فرنسي"], c:"برازيلي"},
            {q:"كم عدد دقائق الوقت الأصلي للمباراة؟", a:["90 دقيقة","60 دقيقة","100 دقيقة","80 دقيقة"], c:"90 دقيقة"},
            {q:"من هو النادي الذي يلقب بـ (المدفعجية)؟", a:["أرسنال","ليفربول","تشيلسي","اليونايتد"], c:"أرسنال"},
            {q:"ما هي الدولة المستضيفة لكأس العالم 2022؟", a:["قطر","البرازيل","روسيا","جنوب أفريقيا"], c:"قطر"},
            {q:"من اللاعب الملقب بـ CR7؟", a:["رونالدو","ميسي","نيمار","بنزيمة"], c:"رونالدو"},
            {q:"ما هو الفريق الذي فاز بكأس العالم 2022؟", a:["الأرجنتين","فرنسا","كرواتيا","المغرب"], c:"الأرجنتين"},
            {q:"كم عدد كرات ميسي الذهبية حتى 2023؟", a:["8","5","7","6"], c:"8"},
            {q:"ما هو قميص منتخب البرازيل الأساسي؟", a:["أصفر","أزرق","أبيض","أخضر"], c:"أصفر"},
            {q:"من هو هداف ريال مدريد التاريخي؟", a:["كريستيانو رونالدو","بنزيمة","راؤول","زيدان"], c:"كريستيانو رونالدو"},
            {q:"أي مدينة ينتمي لها ناي ريال مدريد؟", a:["مدريد","برشلونة","لندن","باريس"], c:"مدريد"},
            {q:"ما هو أكبر ملعب في العالم من حيث المساحة؟", a:["ملعب ماراكانا","كامب نو","سانتياغو","أليانز"], c:"ملعب ماراكانا"},
            {q:"من هو مدرب مانشستر سيتي الحالي؟", a:["غوارديولا","كلوب","أنشيلوتي","تشافي"], c:"غوارديولا"},
            {q:"ما هي البطولة الأهم للأندية في أوروبا؟", a:["دوري أبطال أوروبا","الدوري الأوروبي","كأس العالم للأندية","السوبر الأوروبي"], c:"دوري أبطال أوروبا"},
            {q:"كم مرة فاز المنتخب السعودي بكأس آسيا؟", a:["3 مرات","مرة واحدة","مرتان","4 مرات"], c:"3 مرات"},
            {q:"ما هو اسم كرة كأس العالم 2022؟", a:["الرحلة","الجابولاني","التارماك","تليستار"], c:"الرحلة"},
            {q:"من هو الحارس الذي فاز بالكرة الذهبية؟", a:["ليف ياشين","بوفون","كاسياس","نوير"], c:"ليف ياشين"},
            {q:"كم عدد لاعبي التبديل المسموح حالياً؟", a:["5","3","2","4"], c:"5"},
            {q:"أين يلعب النجم كيليان مبابي؟", a:["ريال مدريد","باريس","ليفربول","مان سيتي"], c:"ريال مدريد"},
            {q:"ما هي البطولة التي تقام كل 4 سنوات؟", a:["كأس العالم","الدوري","كأس الملك","السوبر"], c:"كأس العالم"},
            {q:"من هو اللاعب الذي يلقب بـ (الظاهرة)؟", a:["رونالدو البرازيلي","رونالدو البرتغالي","روماريو","بيليه"], c:"رونالدو البرازيلي"},
            {q:"أي منتخب يلقب بـ (السامبا)؟", a:["البرازيل","الأرجنتين","كولومبيا","بيرو"], c:"البرازيل"},
            {q:"كم دقيقة مدة الاستراحة بين الشوطين؟", a:["15 دقيقة","10 دقائق","5 دقائق","20 دقيقة"], c:"15 دقيقة"},
            {q:"من هو النادي الملقب بـ (الريدز)؟", a:["ليفربول","مان يونايتد","أرسنال","بايرن"], c:"ليفربول"},
            {q:"ما هي جنسية اللاعب محمد صلاح؟", a:["مصري","جزائري","مغربي","تونسي"], c:"مصري"},
            {q:"أي لون يرتدي الحكام عادة؟", a:["أسود","أبيض","أزرق","أخضر"], c:"أسود"},
            {q:"ما هي الدولة التي فازت بكأس العالم 2014؟", a:["ألمانيا","الأرجنتين","البرازيل","هولندا"], c:"ألمانيا"},
            {q:"من هو النادي التاريخي لمدينة ميلانو؟", a:["إيه سي ميلان","يوفنتوس","روما","نابولي"], c:"إيه سي ميلان"},
            {q:"كم عدد النقاط للفوز بالمباراة؟", a:["3 نقاط","نقطة واحدة","نقطتان","4 نقاط"], c:"3 نقاط"},
            {q:"من هو اللاعب الملقب بـ (الفرعون المصري)؟", a:["محمد صلاح","النني","تريزيغيه","زيزو"], c:"محمد صلاح"},
            {q:"أين ولد النجم ليونيل ميسي؟", a:["الأرجنتين","إسبانيا","البرازيل","أوروغواي"], c:"الأرجنتين"},
            {q:"ما هو اسم ملعب مانشستر يونايتد؟", a:["أولد ترافورد","أنفيلد","كامب نو","الإمارات"], c:"أولد ترافورد"},
            {q:"كم عدد أعضاء الطاقم التحكيمي للفار؟", a:["3-4","1","10","0"], c:"3-4"},
            {q:"أي فريق يرتدي الأبيض والأسود في إيطاليا؟", a:["يوفنتوس","ميلان","إنتر","روما"], c:"يوفنتوس"},
            {q:"من هو هداف برشلونة التاريخي؟", a:["ميسي","سواريز","إيتو","رونالدينيو"], c:"ميسي"},
            {q:"ما هي جنسية اللاعب لويس سواريز؟", a:["أوروغواي","البرازيل","الأرجنتين","تشيلي"], c:"أوروغواي"},
            {q:"أي نادٍ فاز بالدوري الإنجليزي 2024؟", a:["مانشستر سيتي","أرسنال","ليفربول","تشيلسي"], c:"مانشستر سيتي"},
            {q:"من هو الحارس الملقب بـ (القديس)؟", a:["إيكر كاسياس","بوفون","نوير","أليسون"], c:"إيكر كاسياس"},
            {q:"كم عدد ألقاب إيطاليا في المونديال؟", a:["4","5","3","2"], c:"4"},
            {q:"ما هو لقب منتخب الجزائر؟", a:["محاربو الصحراء","النسور","الفراعنة","النجوم"], c:"محاربو الصحراء"},
            {q:"من سجل هدف الفوز لألمانيا في 2014؟", a:["ماريو غوتزه","مولر","كلوزه","كروس"], c:"ماريو غوتزه"},
            {q:"ما هو النادي الذي يلعب له كريم بنزيمة؟", a:["الاتحاد","النصر","الهلال","الأهلي"], c:"الاتحاد"}
        ];

        let questions = [];
        let currentIndex = 0;
        let scoreInSession = 0;
        let timer;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function init() {
            // جلب اسم اللاعب من التخزين المحلي
            const savedName = localStorage.getItem('player_username') || "سيرفر المطورين";
            document.getElementById('display-username').innerText = savedName;

            questions = [...bank];
            shuffle(questions);
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= 50) return finish();

            clearInterval(timer);
            let timeLeft = 20;
            document.getElementById('timer-val').innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) nextQuestion();
            }, 1000);

            document.getElementById('progress-val').innerText = `${currentIndex + 1}/50`;
            const q = questions[currentIndex];
            document.getElementById('question').innerText = q.q;

            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            
            let options = [...q.a];
            shuffle(options);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, q.c);
                ansBox.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            clearInterval(timer);
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('correct');
                scoreInSession++;
                document.getElementById('score-val').innerText = scoreInSession;
                
                let total = parseInt(localStorage.getItem('user_total_points')) || 0;
                localStorage.setItem('user_total_points', total + 1);
            } else {
                btn.classList.add('wrong');
                btns.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
            }

            setTimeout(nextQuestion, 1000);
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function finish() {
            clearInterval(timer);
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            document.getElementById('stats-ui').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('final-score-val').innerText = `${scoreInSession} / 50`;
            
            let rank = scoreInSession >= 40 ? "🎖️ بطل واعد!" : "💪 حاول مرة أخرى لتتحسن!";
            document.getElementById('final-rank').innerText = rank;

            let count = 5;
            const countDisplay = document.getElementById('countdown');
            const redirectTimer = setInterval(() => {
                count--;
                countDisplay.innerText = count;
                if (count <= 0) {
                    clearInterval(redirectTimer);
                    window.location.href = 'index.html'; 
                }
            }, 1000);
        }

        window.onload = init;
    </script>
</body>
</html>
