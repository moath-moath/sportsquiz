<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الأبطال - مستوى المبتدئ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #0f2027 0%, #203a43 50%, #2c5364 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 32, 39, 0.95);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(0, 255, 136, 0.2);
            position: relative;
        }

        .honor-board {
            background: linear-gradient(110deg, #00b09b 20%, #96c93d 80%);
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 176, 155, 0.3);
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .player-info h3 { 
            margin: 5px 0; 
            font-size: 26px; 
            font-weight: 900; 
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .encouragement { 
            color: #1a1a2e; 
            font-weight: 900; 
            font-size: 14px; 
            display: block; 
            margin-bottom: 5px;
            background: rgba(255,255,255,0.8);
            width: fit-content;
            margin: 0 auto 10px;
            padding: 2px 15px;
            border-radius: 10px;
        }

        .level-badge { 
            background: #ffffff; color: #00b09b; 
            padding: 6px 25px; border-radius: 50px; font-size: 14px; font-weight: 900;
            display: inline-block; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-card.timer { border-bottom: 4px solid #00ff88; }
        .stat-card.points { border-bottom: 4px solid #00d2ff; }

        .stat-label { font-size: 10px; color: #aaa; display: block; }
        .stat-value { font-size: 18px; font-weight: 900; }

        #game-area {
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 25px 15px;
            min-height: 350px;
            margin-bottom: 50px;
        }

        #question { font-size: 20px; font-weight: 700; margin-bottom: 25px; min-height: 60px; line-height: 1.4; }

        .answers-container { display: grid; gap: 12px; }
        
        button.answer-btn {
            background: #1c2e36; color: white; border: 1px solid #2c5364;
            padding: 18px 15px; font-size: 17px; font-weight: 700;
            border-radius: 20px; cursor: pointer; transition: 0.2s;
            width: 100%;
        }

        .correct { background: #00ff88 !important; color: #000 !important; font-weight: 900; }
        .wrong { background: #e94560 !important; }

        #skipBtn, #hintBtn { 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #00b09b;
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            position: absolute;
            bottom: 20px;
        }

        #skipBtn { left: 20px; }
        #hintBtn { right: 20px; border-color: #96c93d; }

        .google-login-btn {
            background: #4285F4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cairo';
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="honor-board">
            <span class="encouragement">BEGINNER CHAMPION</span>
            <div class="player-info">
                <h3 id="display-username">جاري التحميل...</h3>
            </div>
            <span class="level-badge">مستوى المبتدئ</span>
        </div>

        <div class="stats-grid" id="stats-ui">
            <div class="stat-card">
                <span class="stat-label">السؤال</span>
                <span id="progress-val" class="stat-value">1/50</span>
            </div>
            <div class="stat-card timer">
                <span class="stat-label">الوقت</span>
                <span id="timer-val" class="stat-value" style="color:#00ff88">20</span>
            </div>
            <div class="stat-card points">
                <span class="stat-label">النقاط</span>
                <span id="session-points" class="stat-value" style="color:#00d2ff">0</span>
            </div>
        </div>

        <div id="game-area">
            <div id="quiz-content">
                <div id="question">برجاء تسجيل الدخول للبدء...</div>
                <div id="answers" class="answers-container"></div>
            </div>

            <div id="result-box" style="display:none;">
                <h2>🎊 أحسنت يا بطل! 🎊</h2>
                <div id="final-score-text" style="font-size:35px; font-weight:900; color:#00ff88; margin:20px;"></div>
                <button class="google-login-btn" onclick="location.reload()">🔄 إعادة التحدي</button>
            </div>
        </div>

        <button id="skipBtn" onclick="nextQuestion()">⏭ تخطي</button>
        <button id="hintBtn" onclick="useHint()">💡 تلميح</button>
    </div>

    <!-- كود Firebase الموحد لنظام تسجيل الدخول -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAEKcYJkl2mpGaM04ppixUnGeygKn3Nu_8",
          authDomain: "champions-challenge-2a13a.firebaseapp.com",
          projectId: "champions-challenge-2a13a",
          storageBucket: "champions-challenge-2a13a.firebasestorage.app",
          messagingSenderId: "267945781501",
          appId: "1:267945781501:web:6be03f02151127aec0b694",
          measurementId: "G-6EYLJ9SYJ0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider).catch((error) => alert("خطأ في تسجيل الدخول"));
        };

        onAuthStateChanged(auth, (user) => {
            const displayArea = document.getElementById('display-username');
            if (user) {
                displayArea.innerText = user.displayName;
                initGame();
            } else {
                displayArea.innerHTML = `<button onclick="loginWithGoogle()" class="google-login-btn">دخول بجوجل</button>`;
                document.getElementById('question').innerText = "سجل دخولك لحفظ ترتيبك العالمي";
            }
        });

        window.saveToLeaderboard = async function(playerPoints) {
            const user = auth.currentUser;
            if(!user) return;
            try {
                await addDoc(collection(db, "leaderboard"), {
                    name: user.displayName,
                    email: user.email,
                    points: Number(playerPoints),
                    level: "مبتدئ",
                    timestamp: serverTimestamp()
                });
            } catch (e) { console.error("Error:", e); }
        };
    </script>

    <script>
        // مصفوفة الأسئلة (نفس بنك الأسئلة الخاص بك)
        const bank = [
            {q:"ما هو لون قميص نادي ريال مدريد الأساسي؟", a:["أبيض","أحمر","أزرق","أسود"], c:"أبيض"},
            {q:"في أي مدينة يلعب نادي برشلونة؟", a:["مدريد","برشلونة","لندن","باريس"], c:"برشلونة"},
            {q:"كم عدد كرات ميسي الذهبية؟", a:["8","3","5","1"], c:"8"},
            {q:"ما هي الرياضة التي يمارسها كريستيانو رونالدو؟", a:["كرة القدم","كرة السلة","التنس","السباحة"], c:"كرة القدم"},
            {q:"ما هو لقب منتخب مصر؟", a:["الفراعنة","الأسود","النسور","الماتادور"], c:"الفراعنة"},
            {q:"كم عدد لاعبي فريق كرة القدم داخل الملعب؟", a:["11","7","9","12"], c:"11"},
            {q:"ما هو اسم النادي الذي يلعب له محمد صلاح؟", a:["ليفربول","تشيلسي","مانشستر سيتي","النصر"], c:"ليفربول"},
            {q:"من هو المنتخب الذي فاز بكأس العالم 2022؟", a:["الأرجنتين","فرنسا","البرازيل","المغرب"], c:"الأرجنتين"},
            {q:"ما هو لون الكرة التقليدي قديماً؟", a:["أبيض وأسود","أحمر وأصفر","أزرق","أخضر"], c:"أبيض وأسود"},
            {q:"ما هو اسم مدرب مانشستر سيتي الحالي؟", a:["غوارديولا","كلوب","أنشيلوتي","مورينيو"], c:"غوارديولا"},
            {q:"أي بلد استضاف كأس العالم 2022؟", a:["قطر","السعودية","مصر","الإمارات"], c:"قطر"},
            {q:"ما هو لقب نادي الاتحاد السعودي؟", a:["العميد","الزعيم","العالمي","الليث"], c:"العميد"},
            {q:"من هو حارس المرمى؟", a:["الذي يصد الكرة بيده","الذي يسجل الأهداف","الحكم","المدرب"], c:"الذي يصد الكرة بيده"},
            {q:"كم مدة الشوط الواحد في كرة القدم؟", a:["45 دقيقة","30 دقيقة","60 دقيقة","15 دقيقة"], c:"45 دقيقة"},
            {q:"ما هو النادي الملقب بـ 'العالمي' في السعودية؟", a:["النصر","الهلال","الشباب","الأهلي"], c:"النصر"},
            {q:"من هو 'الدون'؟", a:["رونالدو","ميسي","نيمار","مبابي"], c:"رونالدو"},
            {q:"ما هو لقب منتخب المغرب؟", a:["أسود الأطلس","الديوك","المحاربون","الفرسان"], c:"أسود الأطلس"},
            {q:"أين يضع الحكم الصافرة؟", a:["في فمه","في يده","في جيبه","على رأسه"], c:"في فمه"},
            {q:"ماذا يرتدي اللاعب على قدمه؟", a:["حذاء رياضي","صندل","خف","جوارب فقط"], c:"حذاء رياضي"},
            {q:"كم عدد الحكام في الساحة؟", a:["1","3","5","0"], c:"1"},
            {q:"ما هو لون البطاقة التي تعني الطرد؟", a:["حمراء","صفراء","خضراء","زرقاء"], c:"حمراء"},
            {q:"أي منتخب يلقب بـ 'السامبا'؟", a:["البرازيل","الأرجنتين","إسبانيا","إيطاليا"], c:"البرازيل"},
            {q:"ما هو اسم ملعب ريال مدريد؟", a:["سانتياغو برنابيو","كامب نو","أنفيلد","أولد ترافورد"], c:"سانتياغو برنابيو"},
            {q:"ما هو لقب نادي الهلال السعودي؟", a:["الزعيم","العميد","العالمي","الراقي"], c:"الزعيم"},
            {q:"من هو اللاعب الذي يلقب بـ 'البرغوث'؟", a:["ميسي","صلاح","هالاند","بيليه"], c:"ميسي"},
            {q:"أي دوري يلعب فيه نادي الهلال؟", a:["الدوري السعودي","الدوري الإسباني","الدوري الإنجليزي","الدوري المصري"], c:"الدوري السعودي"},
            {q:"ماذا تسمى الضربة التي تنفذ من زاوية الملعب؟", a:["ركنية","ضربة جزاء","تماس","تسلل"], c:"ركنية"},
            {q:"كم عدد أهداف ضربة الجزاء؟", a:["هدف واحد","هدفين","ثلاثة","نصف هدف"], c:"هدف واحد"},
            {q:"ما هو لون البطاقة التي تعني إنذار؟", a:["صفراء","حمراء","سوداء","بيضاء"], c:"صفراء"},
            {q:"أين يلعب نيمار حالياً (2024)؟", a:["الهلال","النصر","باريس","برشلونة"], c:"الهلال"},
            {q:"ما هو لقب منتخب فرنسا؟", a:["الديوك","الماكينات","الماتادور","الأسود"], c:"الديوك"},
            {q:"من هو النادي الأكثر فوزاً بالدوري الإسباني؟", a:["ريال مدريد","برشلونة","أتلتيكو مدريد","فالنسيا"], c:"ريال مدريد"},
            {q:"ما هو لون قميص منتخب السعودية؟", a:["أبيض وأخضر","أحمر","أزرق","أصفر"], c:"أبيض وأخضر"},
            {q:"ماذا يسمى الشخص الذي يوجه اللاعبين؟", a:["المدرب","المشجع","المصور","المسعف"], c:"المدرب"},
            {q:"كم مرة تقام بطولة كأس العالم؟", a:["كل 4 سنوات","كل سنة","كل سنتين","كل 10 سنوات"], c:"كل 4 سنوات"},
            {q:"من هو الهداف التاريخي للنصر السعودي؟", a:["ماجد عبد الله","رونالدو","تاليسكا","حمد الله"], c:"ماجد عبد الله"},
            {q:"ما هو النادي الإنجليزي الذي يلقب بـ 'الريدز'؟", a:["ليفربول","مانشستر يونايتد","أرسنال","تشيلسي"], c:"ليفربول"},
            {q:"ما هو اسم النجم الجزائري الذي لعب لمانشستر سيتي؟", a:["رياض محرز","براهيمي","بونجاح","بلايلي"], c:"رياض محرز"},
            {q:"أي منتخب يلقب بـ 'الماتادور'؟", a:["إسبانيا","ألمانيا","إيطاليا","البرتغال"], c:"إسبانيا"},
            {q:"كم عدد الشوطين في المباراة؟", a:["2","1","4","3"], c:"2"},
            {q:"ما هو لقب نادي الأهلي المصري؟", a:["نادي القرن","العالمي","العميد","الملكي"], c:"نادي القرن"},
            {q:"من هو الحارس التاريخي لمنتخب السعودية؟", a:["محمد الدعيع","وليد عبد الله","العويس","القرني"], c:"محمد الدعيع"},
            {q:"ما هي الدولة التي فازت بكأس العالم 2010؟", a:["إسبانيا","هولندا","ألمانيا","البرازيل"], c:"إسبانيا"},
            {q:"أين يلعب كريم بنزيما حالياً؟", a:["الاتحاد","النصر","ريال مدريد","ليون"], c:"الاتحاد"},
            {q:"ما هو لقب منتخب تونس؟", a:["نسور قرطاج","أسود الأطلس","المحاربون","الفراعنة"], c:"نسور قرطاج"},
            {q:"من هو اللاعب الملقب بـ 'الظاهرة'؟", a:["رونالدو البرازيلي","كريستيانو","رونالدينيو","بيليه"], c:"رونالدو البرازيلي"},
            {q:"ما هو لون قميص نادي النصر السعودي؟", a:["أصفر وأزرق","أبيض","أحمر","أسود"], c:"أصفر وأزرق"},
            {q:"أي نادٍ يلقب بـ 'البلوز' في إنجلترا؟", a:["تشيلسي","مان سيتي","أرسنال","إيفرتون"], c:"تشيلسي"},
            {q:"ما هي الجنسية الأصلية للاعب ميسي؟", a:["أرجنتيني","إسباني","برازيلي","فرنسي"], c:"أرجنتيني"},
            {q:"من هو الملك في كرة القدم؟", a:["بيليه","مارادونا","زيدان","رونالدو"], c:"بيليه"}
        ];

        let questions = [];
        let currentIndex = 0;
        let scoreInSession = 0;
        let timer;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        window.initGame = function() {
            questions = [...bank];
            shuffle(questions);
            currentIndex = 0;
            scoreInSession = 0;
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= 50) return finish();
            document.getElementById('hintBtn').disabled = false;
            clearInterval(timer);
            let timeLeft = 20;
            document.getElementById('timer-val').innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) nextQuestion();
            }, 1000);

            document.getElementById('progress-val').innerText = `${currentIndex + 1}/50`;
            const q = questions[currentIndex];
            document.getElementById('question').innerText = q.q;
            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            let options = [...q.a];
            shuffle(options);
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, q.c);
                ansBox.appendChild(btn);
            });
        }

        function useHint() {
            const q = questions[currentIndex];
            const btns = document.querySelectorAll('.answer-btn');
            let found = 0;
            btns.forEach(b => {
                if(b.innerText !== q.c && found < 2) {
                    b.style.visibility = 'hidden';
                    found++;
                }
            });
            document.getElementById('hintBtn').disabled = true;
        }

        function checkAnswer(btn, selected, correct) {
            clearInterval(timer);
            if (selected === correct) {
                btn.classList.add('correct');
                scoreInSession++;
                document.getElementById('session-points').innerText = scoreInSession;
            } else {
                btn.classList.add('wrong');
            }
            setTimeout(nextQuestion, 800);
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function finish() {
            clearInterval(timer);
            window.saveToLeaderboard(scoreInSession);
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('stats-ui').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('final-score-text').innerText = `جمعت ${scoreInSession} نقطة!`;
            setTimeout(() => window.location.href = 'index.html', 5000);
        }
    </script>
</body>
</html>
