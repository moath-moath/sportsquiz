<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>تحدي الأبطال - مستوى المبتدئ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(26, 26, 46, 0.95);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
        }

        .honor-board {
            background: linear-gradient(110deg, #bf953f 20%, #fcf6ba 40%, #b38728 50%, #fcf6ba 70%, #aa771c 80%);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(191, 149, 63, 0.4);
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .player-info h3 { 
            margin: 5px 0; 
            font-size: 32px; 
            font-weight: 900; 
            color: #1a1a2e;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        .encouragement { 
            color: #5d4037; 
            font-weight: 900; 
            font-size: 16px; 
            display: block; 
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .level-badge { 
            background: #1a1a2e; color: #ffd700; 
            padding: 6px 25px; border-radius: 50px; font-size: 14px; font-weight: 900;
            display: inline-block; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .stat-card { background: #16213e; padding: 10px 5px; border-radius: 15px; border: 1px solid #333; }
        .stat-card.timer { border-bottom: 4px solid #ffd700; }
        .stat-card.points { border-bottom: 4px solid #00ff88; }
        .stat-card.total { border-bottom: 4px solid #3498db; }

        .stat-label { font-size: 9px; color: #888; display: block; }
        .stat-value { font-size: 16px; font-weight: 900; }

        #game-area {
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 25px 15px;
            min-height: 350px;
            margin-bottom: 50px;
        }

        #question { font-size: 20px; font-weight: 700; margin-bottom: 25px; min-height: 60px; line-height: 1.4; }

        .answers-container { display: grid; gap: 12px; }
        
        button.answer-btn {
            background: #0f3460; color: white; border: 1px solid #16213e;
            padding: 18px 15px; font-size: 17px; font-weight: 700;
            border-radius: 20px; cursor: pointer; transition: 0.2s;
            width: 100%;
            line-height: 1.2;
        }

        .correct { background: #00ff88 !important; color: #000 !important; font-weight: 900; }
        .wrong { background: #e94560 !important; }

        #skipBtn, #hintBtn { 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #bf953f;
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            position: absolute;
            bottom: 20px;
            width: auto;
        }

        #skipBtn { left: 20px; }

        #hintBtn { 
            right: 20px; 
            border-color: #ffd700; 
            color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        #hintBtn:disabled {
            opacity: 0.3;
            filter: grayscale(1);
            cursor: not-allowed;
        }
        
        #result-box h2 { margin-bottom: 10px; }
        
        .restart-btn {
            background: #ffd700; color: #000; padding: 15px 30px;
            border-radius: 50px; border: none; font-weight: 900;
            font-size: 18px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }

async function init() {
    try {
        const user = await new Promise(resolve => {
            const unsubscribe = auth.onAuthStateChanged(currentUser => {
                unsubscribe();
                resolve(currentUser);
            });
        });

        if (!user) {
            alert("الرجاء تسجيل الدخول أولاً");
            window.location.href = "/";
            return;
        }

        const token = await user.getIdToken();

        const response = await fetch('/api/player-stats/', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        const data = await response.json();

        if (!response.ok || data.status !== "success") {
            throw new Error(data.message || "تعذر جلب بيانات اللاعب");
        }

        document.getElementById('display-username').innerText =
            data.displayName || "لاعب";

        document.getElementById('total-points-val').innerText =
            data.totalPoints || 0;

        shuffledQuestions = [...bank];
        shuffle(shuffledQuestions);
        currentIndex = 0;
        scoreInSession = 0;

        document.getElementById('session-points').innerText = 0;

        showQuestion();

    } catch (error) {
        console.error("Player stats error:", error);
        alert("تعذر تحميل بيانات اللاعب: " + error.message);
    }
}

        function showQuestion() {
            if (currentIndex >= 50) return finish();

            answered = false;
            document.getElementById('hintBtn').disabled = false;
            document.getElementById('hintBtn').style.display = 'flex';

            clearInterval(timer);
            let timeLeft = 20;
            document.getElementById('timer-val').innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (!answered) nextQuestion();
                }
            }, 1000);

            document.getElementById('progress-val').innerText = `${currentIndex + 1}/50`;
            const q = shuffledQuestions[currentIndex];
            document.getElementById('question').innerText = q.q;

            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            
            let options = [...q.a];
            shuffle(options);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = opt;
               btn.onclick = () => checkAnswer(btn, opt, q.id);
                ansBox.appendChild(btn);
            });
        }

        function useHint() {
            if (answered) return;
            const currentQuestion = shuffledQuestions[currentIndex];
            const btns = document.querySelectorAll('.answer-btn');
            let wrongFound = 0;

            btns.forEach(btn => {
                if (btn.innerText !== currentQuestion.c && wrongFound < 2) {
                    btn.style.visibility = 'hidden';
                    wrongFound++;
                }
            });

            document.getElementById('hintBtn').disabled = true;
        }
async function checkAnswer(btn, selected, questionId) {
    if (answered) return;

    answered = true;
    clearInterval(timer);

    const btns = document.querySelectorAll('.answer-btn');
    btns.forEach(b => b.style.pointerEvents = 'none');

    try {
        const user = auth.currentUser;

        if (!user) {
            throw new Error("يجب تسجيل الدخول أولاً");
        }

        const token = await user.getIdToken();

        const response = await fetch('/api/award-quiz-point/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                level: 'beginner',
                question_id: questionId,
                selected_answer: selected
            })
        });

        const data = await response.json();

        if (!response.ok || data.status !== 'success') {
            throw new Error(data.message || "تعذر حفظ النقاط");
        }

        if (data.correct) {
            btn.classList.add('correct');

            if (!data.alreadyAnswered) {
                scoreInSession++;
                document.getElementById('session-points').innerText = scoreInSession;
            }
        } else {
            btn.classList.add('wrong');
        }

        btns.forEach(b => {
            if (b.innerText === data.correctAnswer) {
                b.classList.add('correct');
            }
        });

        document.getElementById('total-points-val').innerText = data.totalPoints;

        setTimeout(nextQuestion, 1000);

    } catch (error) {
        console.error(error);
        alert("تعذر حفظ الإجابة: " + error.message);

        answered = false;
        btns.forEach(b => b.style.pointerEvents = 'auto');
    }
}

function nextQuestion() {
    currentIndex++;
    showQuestion();
}

function finish() {
    clearInterval(timer);
    document.getElementById('quiz-content').style.display = 'none';
    document.getElementById('skipBtn').style.display = 'none';
    document.getElementById('hintBtn').style.display = 'none';
    document.getElementById('stats-ui').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('final-score-text').innerText = `جمعت ${scoreInSession} من 50 نقطة!`;

    let count = 5;
    const redirectTimer = setInterval(() => {
        count--;
        document.getElementById('countdown').innerText = count;
        if (count <= 0) {
            clearInterval(redirectTimer);
            window.location.href = './';
        }
    }, 1000);
}

        // تحديث النقاط واسم المستخدم فور دخول أو عودة المتصفح للصفحة بدون حاجة لإعادة التحميل
        window.addEventListener('pageshow', function() {
            init();
        });
    </script>
