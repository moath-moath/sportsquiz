<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سيرفر المطورين - التحدي المطور</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #050505;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 69, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 0, 0.15) 0%, transparent 50%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(10, 10, 10, 0.98);
            padding: 25px 20px;
            border-radius: 35px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 1), 0 0 20px rgba(255, 0, 0, 0.2);
            border: 1px solid #333;
            backdrop-filter: blur(15px);
        }

        .honor-board {
            background: linear-gradient(135deg, #2b0000 0%, #000 100%);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #ff4500;
        }

        .level-badge { 
            background: #ff4500; color: white; 
            padding: 5px 20px; border-radius: 50px; font-size: 13px; font-weight: 900;
            display: inline-block; margin-top: 8px;
        }

        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        .stat-card { background: #111; padding: 10px; border-radius: 15px; border: 1px solid #333; }
        .stat-card.timer { border-bottom: 3px solid #ff4500; }
        .stat-card.points { border-bottom: 3px solid #ffd700; }
        .stat-card.progress { border-bottom: 3px solid #00ff88; }

        .stat-label { font-size: 10px; color: #666; display: block; margin-bottom: 2px; }
        .stat-value { font-size: 16px; font-weight: 900; }

        #game-area {
            background: rgba(20, 20, 20, 0.5);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid #222;
            min-height: 320px;
        }

        #question { 
            font-size: 18px; 
            font-weight: 700; 
            color: #efefef; 
            margin-bottom: 25px; 
            min-height: 70px;
            line-height: 1.5;
        }

        .answers-container { display: grid; gap: 10px; }
        button.answer-btn {
            background: #151515; 
            color: #ccc; 
            border: 1px solid #282828; 
            padding: 15px;
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: all 0.1s ease;
        }

        button.answer-btn:active { transform: scale(0.98); }
        .correct { background: #00ff88 !important; color: #000 !important; font-weight: 900 !important; border-color: #00ff88 !important; }
        .wrong { background: #ff0055 !important; color: white !important; border-color: #ff0055 !important; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .nav-btn {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
            font-size: 14px;
        }

        .skip-btn { border-color: #ff4500; color: #ff4500; }
        .skip-btn:hover { background: #ff4500; color: white; }
        .retry-btn { background: #ff4500; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="honor-board">
            <h3 style="margin:0; font-size: 20px;">سيرفر المطورين</h3>
            <span class="level-badge">⚡ تحدي الـ 20 ثانية ⚡</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card progress">
                <span class="stat-label">السؤال</span>
                <span id="q-num" class="stat-value">0/50</span>
            </div>
            <div class="stat-card points">
                <span class="stat-label">النقاط</span>
                <span id="current-points" class="stat-value">0</span>
            </div>
            <div class="stat-card timer">
                <span class="stat-label">الوقت</span>
                <span id="timer" class="stat-value">20</span>
            </div>
        </div>

        <div id="game-area">
            <div id="quiz">
                <div id="question">جاري التجهيز...</div>
                <div id="answers" class="answers-container"></div>
                <div class="controls">
                    <button class="nav-btn skip-btn" id="skip-btn" onclick="nextQuestion()">تخطي السؤال ⏭️</button>
                </div>
            </div>

            <div id="result-box" style="display:none;">
                <h2 style="color:#ffd700;">انتهى التحدي!</h2>
                <span id="rank-text" style="font-size: 28px; display: block; margin: 15px 0;"></span>
                <p id="final-stats" style="font-size: 18px;"></p>
                <div style="margin-top: 20px;">
                    <button class="nav-btn retry-btn" onclick="location.reload()">إعادة المحاولة</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const bank = [
            {q:"من هو اللاعب الذي سجل أسرع هاتريك في تاريخ الدوري الإنجليزي؟", a:["ساديو ماني","روبي فاولر","صلاح","أغويرو"], c:"ساديو ماني"},
            {q:"كم عدد أهداف ميسي الرسمية في عام 2012؟", a:["91","85","79","95"], c:"91"},
            {q:"أي منتخب فاز بأول نسخة من اليورو عام 1960؟", a:["الاتحاد السوفيتي","يوغوسلافيا","فرنسا","إسبانيا"], c:"الاتحاد السوفيتي"},
            {q:"من هو الهداف التاريخي لكأس أمم أفريقيا؟", a:["صامويل إيتو","لورين بوكو","رشيدي يكيني","دروغبا"], c:"صامويل إيتو"},
            {q:"كم مرة فازت البرتغال بكأس العالم؟", a:["ولا مرة","مرة واحدة","مرتين","3 مرات"], c:"ولا مرة"},
            {q:"من هو النادي الأكثر فوزاً بالدوري الإيطالي؟", a:["يوفنتوس","ميلان","إنتر","روما"], c:"يوفنتوس"},
            {q:"في أي مدينة أقيم أول نهائي لدوري أبطال أوروبا (1956)؟", a:["باريس","مدريد","لندن","ميلانو"], c:"باريس"},
            {q:"من هو اللاعب الذي لقب بـ 'الظاهرة'؟", a:["رونالدو نازاريو","كريستيانو","رونالدينيو","ريفالدو"], c:"رونالدو نازاريو"},
            {q:"أي لاعب فاز بكأس العالم كلاعب ومدرب؟", a:["ماريو زاغالو","مارادونا","زيدان","كلينسمان"], c:"ماريو زاغالو"},
            {q:"ما هو المنتخب الوحيد الذي شارك في جميع نسخ كأس العالم؟", a:["البرازيل","ألمانيا","إيطاليا","الأرجنتين"], c:"البرازيل"},
            {q:"من هو أصغر لاعب سجل في تاريخ نهائيات كأس العالم؟", a:["بيليه","مبابي","روزيوسكي","ميسي"], c:"بيليه"},
            {q:"كم عدد كرات 'الكرة الذهبية' التي فاز بها كرويف؟", a:["3","2","4","1"], c:"3"},
            {q:"من هو صاحب أسرع هدف في تاريخ كأس العالم؟", a:["هاكان شوكور","مازيلا","برايان روبسون","ديمبسي"], c:"هاكان شوكور"},
            {q:"أي نادٍ فاز بـ 5 بطولات دوري أبطال متتالية؟", a:["ريال مدريد","بايرن ميونخ","أياكس","ميلان"], c:"ريال مدريد"},
            {q:"من هو المدرب صاحب الرقم القياسي في الفوز بدوري الأبطال؟", a:["أنشيلوتي","زيدان","بايرن","غوارديولا"], c:"أنشيلوتي"},
            {q:"ما هو رقم قميص زين الدين زيدان في ريال مدريد؟", a:["5","10","21","7"], c:"5"},
            {q:"من هو اللاعب الإيطالي الذي أضاع ركلة الترجيح الأخيرة في نهائي 1994؟", a:["روبرتو باجيو","باريزي","مالديني","زولا"], c:"روبرتو باجيو"},
            {q:"أي منتخب فاز بكأس العالم 2010؟", a:["إسبانيا","هولندا","ألمانيا","الأوروغواي"], c:"إسبانيا"},
            {q:"من هو الهداف التاريخي للمنتخبات الوطنية؟", a:["كريستيانو رونالدو","ميسي","علي دائي","بوشكاش"], c:"كريستيانو رونالدو"},
            {q:"من هو الملقب بـ 'باني جدار برلين' في حراسة المرمى؟", a:["أوليفر كان","ليف ياشين","بوفون","نوير"], c:"ليف ياشين"},
            {q:"كم كان عمر ميسي عندما سجل أول هدف له مع برشلونة؟", a:["17","16","18","19"], c:"17"},
            {q:"أي نادٍ يلقب بـ 'السيدة العجوز'؟", a:["يوفنتوس","ميلان","لاتسيو","هرتا برلين"], c:"يوفنتوس"},
            {q:"من هو اللاعب الوحيد الذي فاز بكأس العالم 3 مرات؟", a:["بيليه","كافو","رونالدو","بكنباور"], c:"بيليه"},
            {q:"أين أقيمت أول نسخة لكأس العالم 1930؟", a:["الأوروغواي","الأرجنتين","البرازيل","فرنسا"], c:"الأوروغواي"},
            {q:"من هو النادي الذي يمتلك ملعب 'أليانز أرينا'؟", a:["بايرن ميونخ","لايبزيغ","دورتموند","شالكه"], c:"بايرن ميونخ"},
            {q:"من فاز بالكرة الذهبية عام 2018؟", a:["مودريتش","ميسي","رونالدو","غريزمان"], c:"مودريتش"},
            {q:"كم عدد أهداف بيليه (الموثقة رسمياً)؟", a:["767","1281","1000","850"], c:"767"},
            {q:"من هو أكثر لاعب شارك في مباريات كأس العالم؟", a:["ميسي","لوتار ماتيوس","كلوزه","مالديني"], c:"ميسي"},
            {q:"من هو الهداف التاريخي لبطولة اليورو؟", a:["كريستيانو رونالدو","بلاتيني","غريزمان","هنري"], c:"كريستيانو رونالدو"},
            {q:"من هو النادي الألماني الوحيد الذي فاز بالثلاثية؟", a:["بايرن ميونخ","دورتموند","هامبورغ","ليفركوزن"], c:"بايرن ميونخ"},
            {q:"أي منتخب يلقب بـ 'الماكينات'؟", a:["ألمانيا","هولندا","السويد","النرويج"], c:"ألمانيا"},
            {q:"من هو اللاعب الذي سجل هدف 'يد الله'؟", a:["مارادونا","بيليه","زيكو","شيلتون"], c:"مارادونا"},
            {q:"ما هو المنتخب الأفريقي الأول الذي وصل لنصف نهائي المونديال؟", a:["المغرب","الكاميرون","السنغال","غانا"], c:"المغرب"},
            {q:"من هو الهداف التاريخي لكأس العالم؟", a:["ميروسلاف كلوزه","رونالدو","مولر","فونتين"], c:"ميروسلاف كلوزه"},
            {q:"أي نادٍ يلعب في ملعب 'الأنفيلد'؟", a:["ليفربول","إيفرتون","مانشستر","أرسنال"], c:"ليفربول"},
            {q:"من هو اللاعب الذي انتقل من برشلونة لريال مدريد عام 2000؟", a:["لويس فيغو","رونالدو","إنريكي","إيتو"], c:"لويس فيغو"},
            {q:"كم عدد ألقاب أرسنال في دوري أبطال أوروبا؟", a:["0","1","2","3"], c:"0"},
            {q:"من هو الحارس الملقب بـ 'العنكبوت الأسود'؟", a:["ليف ياشين","بوفون","شمايكل","كاسياس"], c:"ليف ياشين"},
            {q:"أي منتخب فاز بكأس أمم آسيا 2019؟", a:["قطر","اليابان","السعودية","الأردن"], c:"قطر"},
            {q:"من هو الهداف التاريخي للدوري الإنجليزي (البريميرليغ)؟", a:["آلان شيرر","هاري كين","روني","هنري"], c:"آلان شيرر"},
            {q:"من هو اللاعب الذي فاز بدوري الأبطال مع 3 أندية مختلفة؟", a:["سيدورف","إيتو","رونالدو","زلاتان"], c:"سيدورف"},
            {q:"في أي عام حدثت معجزة إسطنبول (نهائي ليفربول وميلان)؟", a:["2005","2004","2006","2007"], c:"2005"},
            {q:"من هو اللاعب الذي سجل في جميع مباريات دور المجموعات بدوري الأبطال؟", a:["رونالدو","ميسي","هالاند","صلاح"], c:"رونالدو"},
            {q:"ما هو النادي الذي يلقب بـ 'الغواصات الصفراء'؟", a:["فياريال","قادش","إسبانيول","واتفورد"], c:"فياريال"},
            {q:"كم عدد بطولات كأس العالم التي فازت بها إنجلترا؟", a:["1","0","2","3"], c:"1"},
            {q:"من هو صاحب أعلى قفزة (رأسية) مسجلة في كرة القدم? ", a:["كريستيانو رونالدو","النصيري","إبراهيموفيتش","بيكهام"], c:"كريستيانو رونالدو"},
            {q:"من فاز بكأس العالم 1998؟", a:["فرنسا","البرازيل","كرواتيا","هولندا"], c:"فرنسا"},
            {q:"من هو اللاعب الملقب بـ 'البرغوث'؟", a:["ميسي","مارادونا","سانشيز","إنسيني"], c:"ميسي"},
            {q:"أين ستقام نهائيات كأس العالم 2026؟", a:["أمريكا وكندا والمكسيك","السعودية","المغرب","إسبانيا"], c:"أمريكا وكندا والمكسيك"},
            {q:"من هو الهداف التاريخي لنادي ريال مدريد؟", a:["كريستيانو رونالدو","راؤول","بنزيمة","دي ستيفانو"], c:"كريستيانو رونالدو"}
        ];

        let quizSet = [];
        let idx = 0;
        let score = 0;
        let timer;
        const TIME_LIMIT = 20; // تم التعديل إلى 20 ثانية

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function init() {
            quizSet = shuffle([...bank]).slice(0, 50);
            loadQ();
        }

        function loadQ() {
            if(idx >= quizSet.length) return finish();
            
            clearInterval(timer);
            let timeL = TIME_LIMIT;
            document.getElementById('timer').innerText = timeL;
            
            timer = setInterval(() => {
                timeL--;
                document.getElementById('timer').innerText = timeL;
                if(timeL <= 0) {
                    clearInterval(timer);
                    nextQuestion(); 
                }
            }, 1000);

            document.getElementById('q-num').innerText = `${idx+1}/${quizSet.length}`;
            const qData = quizSet[idx];
            document.getElementById('question').innerText = qData.q;
            
            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            
            shuffle([...qData.a]).forEach(txt => {
                const b = document.createElement('button');
                b.className = 'answer-btn';
                b.innerText = txt;
                b.onclick = () => check(b, txt, qData.c);
                ansBox.appendChild(b);
            });
        }

        function check(btn, val, cor) {
            clearInterval(timer);
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(x => x.style.pointerEvents = 'none');

            if(val === cor) {
                btn.classList.add('correct');
                score++;
                document.getElementById('current-points').innerText = score;

                // تحديث النقاط التراكمية في المتصفح
                let total = parseInt(localStorage.getItem('user_total_points')) || 0;
                localStorage.setItem('user_total_points', total + 1);
            } else {
                btn.classList.add('wrong');
                btns.forEach(x => { if(x.innerText === cor) x.classList.add('correct'); });
            }

            setTimeout(nextQuestion, 800);
        }

        function nextQuestion() {
            idx++;
            loadQ();
        }

        function finish() {
            clearInterval(timer);
            document.getElementById('quiz').style.display = 'none';
            const res = document.getElementById('result-box');
            res.style.display = 'block';
            
            let rText = score > 40 ? "أنت أسطورة حقيقية! 🔥" : score > 25 ? "أداء ممتاز للمحترفين ⚽" : "تحتاج لمزيد من التدريب! 🏃‍♂️";
            document.getElementById('rank-text').innerText = rText;
            document.getElementById('final-stats').innerText = `إجاباتك الصحيحة: ${score} من 50`;
        }

        window.onload = init;
    </script>
</body>
</html>
