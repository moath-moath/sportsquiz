<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الأبطال - مستوى الصعب</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(26, 26, 46, 0.95);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
        }

        .honor-board {
            background: linear-gradient(110deg, #bf953f 20%, #fcf6ba 40%, #b38728 50%, #fcf6ba 70%, #aa771c 80%);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(191, 149, 63, 0.4);
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .player-info h3 { 
            margin: 5px 0; 
            font-size: 32px; 
            font-weight: 900; 
            color: #1a1a2e;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        .encouragement { 
            color: #5d4037; 
            font-weight: 900; 
            font-size: 16px; 
            display: block; 
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .level-badge { 
            background: #1a1a2e; color: #ffd700; 
            padding: 6px 25px; border-radius: 50px; font-size: 14px; font-weight: 900;
            display: inline-block; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .stat-card { background: #16213e; padding: 10px 5px; border-radius: 15px; border: 1px solid #333; }
        .stat-card.timer { border-bottom: 4px solid #ffd700; }
        .stat-card.points { border-bottom: 4px solid #00ff88; }
        .stat-card.total { border-bottom: 4px solid #3498db; }

        .stat-label { font-size: 9px; color: #888; display: block; }
        .stat-value { font-size: 16px; font-weight: 900; }

        #game-area {
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 25px 15px;
            min-height: 350px;
            margin-bottom: 50px;
        }

        #question { font-size: 20px; font-weight: 700; margin-bottom: 25px; min-height: 60px; line-height: 1.4; }

        .answers-container { display: grid; gap: 12px; }
        
        button.answer-btn {
            background: #0f3460; color: white; border: 1px solid #16213e;
            padding: 18px 15px; font-size: 17px; font-weight: 700;
            border-radius: 20px; cursor: pointer; transition: 0.2s;
            width: 100%;
            line-height: 1.2;
        }

        .correct { background: #00ff88 !important; color: #000 !important; font-weight: 900; }
        .wrong { background: #e94560 !important; }

        #skipBtn, #hintBtn { 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #bf953f;
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            position: absolute;
            bottom: 20px;
            width: auto;
        }

        #skipBtn { left: 20px; }

        #hintBtn { 
            right: 20px; 
            border-color: #ffd700; 
            color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        #hintBtn:disabled {
            opacity: 0.3;
            filter: grayscale(1);
            cursor: not-allowed;
        }
        
        #result-box h2 { margin-bottom: 10px; }
        
        .restart-btn {
            background: #ffd700; color: #000; padding: 15px 30px;
            border-radius: 50px; border: none; font-weight: 900;
            font-size: 18px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="honor-board">
            <span class="encouragement">BEGINNER CHAMPION</span>
            <div class="player-info">
                <h3 id="display-username">جاري التحميل...</h3>
            </div>
            <span class="level-badge">مستوى الصعب</span>
        </div>
        
        <div class="stats-grid" id="stats-ui">
            <div class="stat-card">
                <span class="stat-label">السؤال</span>
                <span id="progress-val" class="stat-value">1/50</span>
            </div>
            <div class="stat-card timer">
                <span class="stat-label">الوقت</span>
                <span id="timer-val" class="stat-value" style="color:#ffd700">20</span>
            </div>
            <div class="stat-card points">
                <span class="stat-label">نقاط الجولة</span>
                <span id="session-points" class="stat-value" style="color:#00ff88">0</span>
            </div>
            <div class="stat-card total">
                <span class="stat-label">المجموع الكلي</span>
                <span id="total-points-val" class="stat-value" style="color:#3498db">0</span>
            </div>
        </div>

        <div id="game-area">
            <div id="quiz-content">
                <div id="question">جاري التحميل...</div>
                <div id="answers" class="answers-container"></div>
            </div>

            <div id="result-box" style="display:none;">
                <h2>🎊 أحسنت يا بطل! 🎊</h2>
                <div id="final-score-text" style="font-size:35px; font-weight:900; color:#ffd700; margin:20px;"></div>
                <button class="restart-btn" onclick="location.reload()">🔄 إعادة التحدي</button>
                <p id="redirect-msg" style="margin-top: 25px; color: #888; font-size: 14px;">
                    العودة للقائمة الرئيسية خلال <span id="countdown">5</span> ثوانٍ...
                </p>
            </div>
        </div>

        <button id="skipBtn" onclick="nextQuestion()">
            <span>⏭</span>
            <span>تخطي</span>
        </button>

        <button id="hintBtn" onclick="useHint()">
            <span>تلميح</span>
            <span>💡</span>
        </button>
    </div>

    <script>
        const bank = [
            {q:"ما هو لون قميص نادي ريال مدريد الأساسي؟", a:["أبيض","أحمر","أزرق","أسود"], c:"أبيض"},
            {q:"في أي مدينة يلعب نادي برشلونة؟", a:["مدريد","برشلونة","لندن","باريس"], c:"برشلونة"},
            {q:"كم عدد كرات ميسي الذهبية؟", a:["8","3","5","1"], c:"8"},
            {q:"ما هي الرياضة التي يمارسها كريستيانو رونالدو؟", a:["كرة القدم","كرة السلة","التنس","السباحة"], c:"كرة القدم"},
            {q:"ما هو لقب منتخب مصر؟", a:["الفراعنة","الأسود","النسور","الماتادور"], c:"الفراعنة"},
            {q:"كم عدد لاعبي فريق كرة القدم داخل الملعب؟", a:["11","7","9","12"], c:"11"},
            {q:"ما هو اسم النادي الذي يلعب له محمد صلاح؟", a:["ليفربول","تشيلسي","مانشستر سيتي","النصر"], c:"ليفربول"},
            {q:"من هو المنتخب الذي فاز بكأس العالم 2022؟", a:["الأرجنتين","فرنسا","البرازيل","المغرب"], c:"الأرجنتين"},
            {q:"ما هو لون الكرة التقليدي قديماً؟", a:["أبيض وأسود","أحمر وأصفر","أزرق","أخضر"], c:"أبيض وأسود"},
            {q:"ما هو اسم مدرب مانشستر سيتي الحالي؟", a:["غوارديولا","كلوب","أنشيلوتي","مورينيو"], c:"غوارديولا"},
            {q:"أي بلد استضاف كأس العالم 2022؟", a:["قطر","السعودية","مصر","الإمارات"], c:"قطر"},
            {q:"ما هو لقب نادي الاتحاد السعودي؟", a:["العميد","الزعيم","العالمي","الليث"], c:"العميد"},
            {q:"من هو حارس المرمى؟", a:["الذي يصد الكرة بيده","الذي يسجل الأهداف","الحكم","المدرب"], c:"الذي يصد الكرة بيده"},
            {q:"كم مدة الشوط الواحد في كرة القدم؟", a:["45 دقيقة","30 دقيقة","60 دقيقة","15 دقيقة"], c:"45 دقيقة"},
            {q:"ما هو النادي الملقب بـ 'العالمي' في السعودية؟", a:["النصر","الهلال","الشباب","الأهلي"], c:"النصر"},
            {q:"من هو 'الدون'؟", a:["رونالدو","ميسي","نيمار","مبابي"], c:"رونالدو"},
            {q:"ما هو لقب منتخب المغرب؟", a:["أسود الأطلس","الديوك","المحاربون","الفرسان"], c:"أسود الأطلس"},
            {q:"أين يضع الحكم الصافرة؟", a:["في فمه","في يده","في جيبه","على رأسه"], c:"في فمه"},
            {q:"ماذا يرتدي اللاعب على قدمه؟", a:["حذاء رياضي","صندل","خف","جوارب فقط"], c:"حذاء رياضي"},
            {q:"كم عدد الحكام في الساحة؟", a:["1","3","5","0"], c:"1"},
            {q:"ما هو لون البطاقة التي تعني الطرد؟", a:["حمراء","صفراء","خضراء","زرقاء"], c:"حمراء"},
            {q:"أي منتخب يلقب بـ 'السامبا'؟", a:["البرازيل","الأرجنتين","إسبانيا","إيطاليا"], c:"البرازيل"},
            {q:"ما هو اسم ملعب ريال مدريد؟", a:["سانتياغو برنابيو","كامب نو","أنفيلد","أولد ترافورد"], c:"سانتياغو برنابيو"},
            {q:"ما هو لقب نادي الهلال السعودي؟", a:["الزعيم","العميد","العالمي","الراقي"], c:"الزعيم"},
            {q:"من هو اللاعب الذي يلقب بـ 'البرغوث'؟", a:["ميسي","صلاح","هالاند","بيليه"], c:"ميسي"},
            {q:"أي دوري يلعب فيه نادي الهلال؟", a:["الدوري السعودي","الدوري الإسباني","الدوري الإنجليزي","الدوري المصري"], c:"الدوري السعودي"},
            {q:"ماذا تسمى الضربة التي تنفذ من زاوية الملعب؟", a:["ركنية","ضربة جزاء","تماس","تسلل"], c:"ركنية"},
            {q:"كم عدد أهداف ضربة الجزاء؟", a:["هدف واحد","هدفين","ثلاثة","نصف هدف"], c:"هدف واحد"},
            {q:"ما هو لون البطاقة التي تعني إنذار؟", a:["صفراء","حمراء","سوداء","بيضاء"], c:"صفراء"},
            {q:"أين يلعب نيمار حالياً (2024)؟", a:["الهلال","النصر","باريس","برشلونة"], c:"الهلال"},
            {q:"ما هو لقب منتخب فرنسا؟", a:["الديوك","الماكينات","الماتادور","الأسود"], c:"الديوك"},
            {q:"من هو النادي الأكثر فوزاً بالدوري الإسباني؟", a:["ريال مدريد","برشلونة","أتلتيكو مدريد","فالنسيا"], c:"ريال مدريد"},
            {q:"ما هو لون قميص منتخب السعودية؟", a:["أبيض وأخضر","أحمر","أزرق","أصفر"], c:"أبيض وأخضر"},
            {q:"ماذا يسمى الشخص الذي يوجه اللاعبين؟", a:["المدرب","المشجع","المصور","المسعف"], c:"المدرب"},
            {q:"كم مرة تقام بطولة كأس العالم؟", a:["كل 4 سنوات","كل سنة","كل سنتين","كل 10 سنوات"], c:"كل 4 سنوات"},
            {q:"من هو الهداف التاريخي للنصر السعودي؟", a:["ماجد عبد الله","رونالدو","تاليسكا","حمد الله"], c:"ماجد عبد الله"},
            {q:"ما هو النادي الإنجليزي الذي يلقب بـ 'الريدز'؟", a:["ليفربول","مانشستر يونايتد","أرسنال","تشيلسي"], c:"ليفربول"},
            {q:"ما هو اسم النجم الجزائري الذي لعب لمانشستر سيتي؟", a:["رياض محرز","براهيمي","بونجاح","بلايلي"], c:"رياض محرز"},
            {q:"أي منتخب يلقب بـ 'الماتادور'؟", a:["إسبانيا","ألمانيا","إيطاليا","البرتغال"], c:"إسبانيا"},
            {q:"كم عدد الشوطين في المباراة؟", a:["2","1","4","3"], c:"2"},
            {q:"ما هو لقب نادي الأهلي المصري؟", a:["نادي القرن","العالمي","العميد","الملكي"], c:"نادي القرن"},
            {q:"من هو الحارس التاريخي لمنتخب السعودية؟", a:["محمد الدعيع","وليد عبد الله","العويس","القرني"], c:"محمد الدعيع"},
            {q:"ما هي الدولة التي فازت بكأس العالم 2010؟", a:["إسبانيا","هولندا","ألمانيا","البرازيل"], c:"إسبانيا"},
            {q:"أين يلعب كريم بنزيما حالياً؟", a:["الاتحاد","النصر","ريال مدريد","ليون"], c:"الاتحاد"},
            {q:"ما هو لقب منتخب تونس؟", a:["نسور قرطاج","أسود الأطلس","المحاربون","الفراعنة"], c:"نسور قرطاج"},
            {q:"من هو اللاعب الملقب بـ 'الظاهرة'؟", a:["رونالدو البرازيلي","كريستيانو","رونالدينيو","بيليه"], c:"رونالدو البرازيلي"},
            {q:"ما هو لون قميص نادي النصر السعودي؟", a:["أصفر وأزرق","أبيض","أحمر","أسود"], c:"أصفر وأزرق"},
            {q:"أي نادٍ يلقب بـ 'البلوز' في إنجلترا؟", a:["تشيلسي","مان سيتي","أرسنال","إيفرتون"], c:"تشيلسي"},
            {q:"ما هي الجنسية الأصلية للاعب ميسي؟", a:["أرجنتيني","إسباني","برازيلي","فرنسي"], c:"أرجنتيني"},
            {q:"من هو الملك في كرة القدم؟", a:["بيليه","مارادونا","زيدان","رونالدو"], c:"بيليه"}
        ];

        let shuffledQuestions = [];
        let currentIndex = 0;
        let scoreInSession = 0;
        let timer;
        let answered = false;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function init() {
            const savedName = localStorage.getItem('player_username') || "بطل مبتدئ";
            document.getElementById('display-username').innerText = savedName;
            
            // تحديث عرض المجموع الكلي أول ما تفتح الصفحة
            updateTotalPointsDisplay();

            shuffledQuestions = [...bank];
            shuffle(shuffledQuestions);
            currentIndex = 0;
            scoreInSession = 0;
            showQuestion();
        }

        function updateTotalPointsDisplay() {
            let total = parseInt(localStorage.getItem('total_points')) || 0;
            document.getElementById('total-points-val').innerText = total;
        }

        function showQuestion() {
            if (currentIndex >= 50) return finish();

            answered = false;
            document.getElementById('hintBtn').disabled = false;
            document.getElementById('hintBtn').style.display = 'flex';

            clearInterval(timer);
            let timeLeft = 20;
            document.getElementById('timer-val').innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (!answered) nextQuestion();
                }
            }, 1000);

            document.getElementById('progress-val').innerText = `${currentIndex + 1}/50`;
            const q = shuffledQuestions[currentIndex];
            document.getElementById('question').innerText = q.q;

            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            
            let options = [...q.a];
            shuffle(options);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, q.c);
                ansBox.appendChild(btn);
            });
        }

        function useHint() {
            if (answered) return;
            const currentQuestion = shuffledQuestions[currentIndex];
            const btns = document.querySelectorAll('.answer-btn');
            let wrongFound = 0;

            btns.forEach(btn => {
                if (btn.innerText !== currentQuestion.c && wrongFound < 2) {
                    btn.style.visibility = 'hidden';
                    wrongFound++;
                }
            });

            document.getElementById('hintBtn').disabled = true;
        }

        function checkAnswer(btn, selected, correct) {
            if (answered) return;
            answered = true;
            clearInterval(timer);
            
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('correct');
                scoreInSession++;
                document.getElementById('session-points').innerText = scoreInSession;
                
                // تحديث المجموع الكلي في الـ localStorage وعرضه مباشرة لحظياً
                let total = parseInt(localStorage.getItem('total_points')) || 0;
                total += 1;
                localStorage.setItem('total_points', total);
                updateTotalPointsDisplay(); // تحديث القيمة مباشرة على الشاشة
            } else {
                btn.classList.add('wrong');
                btns.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
            }

            setTimeout(nextQuestion, 1000);
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function finish() {
            clearInterval(timer);
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            document.getElementById('hintBtn').style.display = 'none';
            document.getElementById('stats-ui').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('final-score-text').innerText = `جمعت ${scoreInSession} من 50 نقطة!`;

            let count = 5;
            const redirectTimer = setInterval(() => {
                count--;
                document.getElementById('countdown').innerText = count;
                if (count <= 0) {
                    clearInterval(redirectTimer);
                    window.location.href = './'; 
                }
            }, 1000);
        }

        // تحديث النقاط واسم المستخدم فور دخول أو عودة المتصفح للصفحة بدون حاجة لإعادة التحميل
        window.addEventListener('pageshow', function() {
            init();
        });
    </script>
</body>
</html>
