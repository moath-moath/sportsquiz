<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الأبطال - الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-attachment: fixed;
        }

        .container {
            background: rgba(0,0,0,0.7);
            padding: 30px;
            border-radius: 35px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        #player-name, #total-points {
            font-size: 15px;
            font-weight: 800;
            color: #ffd700;
            margin: 0;
        }

        h1 { font-size: 32px; margin-bottom: 5px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .subtitle { font-size: 16px; margin-bottom: 30px; opacity: 0.8; }

        .level-btn {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 16px;
            font-size: 18px;
            border-radius: 18px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 800;
            transition: 0.3s;
            border: none;
            color: white;
        }

        .btn-beginner { background: #27ae60; }
        .btn-amateur { background: #2980b9; }
        .btn-medium { background: #8e44ad; }
        .btn-hard { background: #d35400; }
        .btn-legendary { 
            background: linear-gradient(45deg, #4b0082, #d4af37); 
            border: 1px solid #ffd700;
        }

        .level-btn:hover { transform: scale(1.03); filter: brightness(1.2); }

        /* نوافذ التسجيل واختيار الاسم */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }

        .auth-card {
            background: #fff; color: #222; padding: 30px;
            border-radius: 25px; width: 85%; max-width: 350px;
        }

        .google-btn {
            background: #4285F4; color: white; padding: 12px;
            border-radius: 10px; border: none; width: 100%;
            font-family: 'Cairo'; font-weight: 700; cursor: pointer;
            margin-top: 15px;
        }

        .name-input {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid #ddd; margin-top: 15px;
            font-family: 'Cairo'; text-align: center; font-size: 16px;
        }
    </style>
</head>
<body>

<!-- نافذة تسجيل الدخول بجوجل -->
<div id="auth-overlay" class="overlay">
    <div class="auth-card">
        <h2 style="margin-top:0">مرحباً بك 🏆</h2>
        <p>يجب تسجيل الدخول لحفظ نقاطك وتنافس الأبطال</p>
        <button class="google-btn" onclick="login()">الدخول بواسطة Google</button>
    </div>
</div>

<!-- نافذة اختيار اسم الشهرة -->
<div id="name-overlay" class="overlay" style="z-index: 1100; background: rgba(0,0,0,0.95);">
    <div class="auth-card">
        <h2 style="margin-top:0">اسم الشهرة 🏅</h2>
        <p>اختر الاسمي الذي سيظهر للجميع في لوحة المتصدرين</p>
        <input type="text" id="custom-name-input" class="name-input" placeholder="أدخل اسمك هنا...">
        <button class="google-btn" style="background: #27ae60;" onclick="saveCustomName()">حفظ والبدء</button>
    </div>
</div>

<div class="container">
    <div class="user-header">
        <p id="player-name">جاري التحميل...</p>
        <p id="total-points">🏆 النقاط: 0</p>
    </div>

    <h1>تحدي الأبطال</h1>
    <div class="subtitle">كن أنت أسطورة المعلومات الرياضية</div>

    <a href="beginner.html" class="level-btn btn-beginner">⚽ المستوى المبتدئ</a>
    <a href="amateur.html" class="level-btn btn-amateur">🏃 المستوى الهاوي</a>
    <a href="medium.html" class="level-btn btn-medium">🔥 المستوى المتوسط</a>
    <a href="hard.html" class="level-btn btn-hard">🏆 المستوى الصعب</a>
    <a href="legendary.html" class="level-btn btn-legendary">👑 المستوى الأسطوري</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAEKcYJkl2mpGaM04ppixUnGeygKn3Nu_8",
        authDomain: "champions-challenge-2a13a.firebaseapp.com",
        projectId: "champions-challenge-2a13a",
        storageBucket: "champions-challenge-2a13a.firebasestorage.app",
        messagingSenderId: "267945781501",
        appId: "1:267945781501:web:6be03f02151127aec0b694"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let tempUser = null; // لتخزين بيانات المستخدم مؤقتاً عند اختيار الاسم

    window.login = () => {
        signInWithPopup(auth, provider).catch(err => console.error(err));
    };

    // دالة حفظ الاسم المخصص في قاعدة البيانات
    window.saveCustomName = async () => {
        const chosenName = document.getElementById("custom-name-input").value.trim();
        if (chosenName.length < 3) {
            alert("يرجى اختيار اسم مكون من 3 أحرف على الأقل");
            return;
        }

        if (tempUser) {
            const userRef = doc(db, "users", tempUser.uid);
            await setDoc(userRef, {
                name: chosenName,
                email: tempUser.email,
                totalPoints: 0,
                hasSetCustomName: true // علامة لعدم إظهار النافذة مرة أخرى
            });
            
            document.getElementById("name-overlay").style.display = "none";
            document.getElementById("player-name").innerText = chosenName;
            localStorage.setItem('player_username', chosenName);
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            tempUser = user;
            document.getElementById("auth-overlay").style.display = "none";
            
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);
            
            if (userSnap.exists()) {
                const userData = userSnap.data();
                
                // التأكد من أن المستخدم اختار اسماً مخصصاً سابقاً
                if (userData.hasSetCustomName) {
                    document.getElementById("player-name").innerText = userData.name;
                    document.getElementById("total-points").innerText = `🏆 النقاط: ${userData.totalPoints || 0}`;
                    localStorage.setItem('player_username', userData.name);
                    document.getElementById("name-overlay").style.display = "none";
                } else {
                    // إذا دخل سابقاً ولم يختر اسماً
                    document.getElementById("name-overlay").style.display = "flex";
                    document.getElementById("custom-name-input").value = user.displayName;
                }
            } else {
                // مستخدم جديد تماماً: أظهر نافذة اختيار الاسم
                document.getElementById("name-overlay").style.display = "flex";
                document.getElementById("custom-name-input").value = user.displayName;
            }
        } else {
            document.getElementById("auth-overlay").style.display = "flex";
            document.getElementById("name-overlay").style.display = "none";
        }
    });
</script>

</body>
</html>
