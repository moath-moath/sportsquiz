<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 المستوى الأسطوري</title>

<style>
body {
    background: #0d1b2a;
    font-family: 'Cairo', Arial, sans-serif;
    color: white;
    text-align: center;
    margin: 0;
    padding: 20px;
}

.container {
    width: 95%;
    max-width: 500px;
    margin: 20px auto;
    background: #1b263b;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

#player-name {
    font-size: 24px;
    font-weight: bold;
    color: #ffd700;
    margin: 10px 0;
}

.level-title {
    font-size: 28px;
    font-weight: 900;
    color: #ffffff;
    margin: 5px 0 15px 0;
}

#timer { font-size: 22px; color: #ffd60a; margin: 10px 0; }
#score { font-size: 22px; color: #00e5ff; margin: 10px 0; }
#progress { font-size: 18px; color: #8bb0cc; margin-bottom: 20px; }

#question {
    font-size: 22px;
    margin: 20px 0;
    min-height: 60px;
}

button {
    display: block;
    width: 100%;
    margin: 10px auto;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: #4a627d;
    color: white;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

button:hover {
    background: #5d7a9a;
    transform: translateY(-3px);
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
}

.admin-btn {
    background: #1b263b;
    border: 1px solid #ffd700;
    color: #ffd700;
    font-size: 12px;
    padding: 5px 10px;
    width: auto;
    margin: 0 auto 10px;
}

#adminPanel {
    display: none;
    background: #0d1b2a;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px dashed #ffd700;
}

#skipBtn { background: #ff9800; margin-top: 20px; }

.home-btn { background: #34495e; font-size: 16px; margin-top: 15px; }

.correct { background: #00c853 !important; }
.wrong { background: #d50000 !important; }

#result { font-size: 18px; margin: 15px 0; font-weight: bold; }
</style>
</head>

<body>

<div class="container">
    <div id="player-name">الاعب: </div>
    <div class="level-title">👑 المستوى الأسطوري</div>

    <button class="admin-btn" onclick="openAdmin()">⚙ لوحة المدير</button>
    <div id="adminPanel">
        <h3>📊 لوحة التحكم</h3>
        <button onclick="if(confirm('هل أنت متأكد من تصفير الرصيد؟')) { localStorage.setItem('totalScore', 0); location.reload(); }" style="background: #d50000; font-size: 14px;">تصفير الرصيد الكلي</button>
    </div>

    <div id="timer">⏳ الوقت: 20</div>
    <div id="score">⭐ السكور: 0</div>
    <div id="progress">السؤال 1 / 50</div>

    <h2 id="question">جاري تحميل السؤال...</h2>
    <div id="answers"></div>

    <button id="skipBtn">⏭ تخطي السؤال</button>
    <div id="result"></div>

    <a href="index.html" style="text-decoration: none;">
        <button class="home-btn">🏠 الرجوع للرئيسية</button>
    </a>
</div>

{q:"من هو اللاعب الذي سجل أول هدف في تاريخ كأس العالم 1930؟",a:["لوسيان لوران","غييرمو ستابيلي","بيليه","مارادونا"],correct:0},

{q:"أي لاعب سجل أول هدف في تاريخ دوري أبطال أوروبا؟",a:["جواو باپتيستا مارتينز","دي ستيفانو","بوشكاش","إيزيبيو"],correct:0},
{q:"من هو أصغر لاعب شارك في كأس العالم عبر التاريخ؟",a:["نورمان وايتسايد","بيليه","مبابي","مارادونا"],correct:0},
{q:"أي منتخب خسر نهائي كأس العالم 1930؟",a:["الأرجنتين","البرازيل","إيطاليا","ألمانيا"],correct:0},
{q:"أي نادي فاز بأول كأس أوروبي للأندية البطلة 1956؟",a:["ريال مدريد","ميلان","بنفيكا","برشلونة"],correct:0},
{q:"من هو هداف كأس العالم 1954؟",a:["ساندور كوكسيس","بوشكاش","دي ستيفانو","فونتين"],correct:0},
{q:"أي منتخب سجل 27 هدفاً في كأس العالم 1954؟",a:["المجر","ألمانيا","البرازيل","إيطاليا"],correct:0},
{q:"من هو اللاعب الذي سجل أسرع هدف في تاريخ كأس العالم؟",a:["هاكان شوكور","كلوزه","رونالدو","هنري"],correct:0},
{q:"أي نادي فاز بدوري الأبطال 1960 بنتيجة 7-3 في النهائي؟",a:["ريال مدريد","بنفيكا","ميلان","برشلونة"],correct:0},
{q:"من هو أول حارس مرمى فاز بالكرة الذهبية؟",a:["ليف ياشين","بوفون","كاسياس","شمايكل"],correct:0},
{q:"أي منتخب فاز بكأس العالم دون أن يخسر مباراة منذ البداية حتى النهاية 1970؟",a:["البرازيل","ألمانيا","إيطاليا","الأرجنتين"],correct:0},
{q:"من هو اللاعب الذي سجل هدف القرن في مونديال 1986؟",a:["مارادونا","بيليه","زico","بلاتيني"],correct:0},
{q:"أي منتخب خسر نهائي كأس العالم 1954 رغم أنه كان المرشح الأول؟",a:["المجر","البرازيل","الأرجنتين","فرنسا"],correct:0},
{q:"من هو هداف كأس العالم 1930؟",a:["غييرمو ستابيلي","بيليه","فونتين","مولر"],correct:0},
{q:"أي نادي فاز بدوري الأبطال 1967 كأول فريق بريطاني؟",a:["سيلتيك","مانشستر يونايتد","ليفربول","أرسنال"],correct:0},
{q:"من هو اللاعب الذي سجل هدف فوز إنجلترا بكأس العالم 1966؟",a:["جيف هيرست","بوبي تشارلتون","روجر هانت","بيترز"],correct:0},
{q:"أي منتخب لعب نهائي كأس العالم 1938 وخسره؟",a:["المجر","البرازيل","ألمانيا","إسبانيا"],correct:0},
{q:"من هو هداف كأس العالم 1970؟",a:["غيرد مولر","بيليه","جاييرزينيو","ريفيلينو"],correct:0},
{q:"أي منتخب سجل أكبر نتيجة في تاريخ كأس العالم 10-1؟",a:["المجر","ألمانيا","البرازيل","الأرجنتين"],correct:0},
{q:"من هو اللاعب الذي سجل هدف الفوز في نهائي دوري الأبطال 1999؟",a:["أولي غونار سولشاير","تيدي شيرنغهام","غيغز","سكولز"],correct:0},
{q:"أي منتخب فاز بكأس العالم 1934؟",a:["إيطاليا","ألمانيا","البرازيل","إسبانيا"],correct:0},
{q:"من هو هداف كأس العالم 1962؟",a:["غارينشيا","بيليه","درايز","فونتين"],correct:0},
{q:"أي منتخب فاز بكأس العالم 1958؟",a:["البرازيل","السويد","ألمانيا","الأرجنتين"],correct:0},
{q:"من هو هداف كأس العالم 1994؟",a:["خريستو ستويتشكوف","روماريو","باتيستوتا","روبرتو باجيو"],correct:0},
{q:"أي منتخب فاز بكأس العالم 1974؟",a:["ألمانيا الغربية","هولندا","البرازيل","الأرجنتين"],correct:0},
{q:"من هو هداف كأس العالم 2002؟",a:["رونالدو","ريفالدو","رونالدينيو","كلوزه"],correct:0},
{q:"أي منتخب فاز بكأس العالم 1978؟",a:["الأرجنتين","هولندا","ألمانيا","البرازيل"],correct:0},
{q:"من هو هداف كأس العالم 1990؟",a:["سالفاتوري سكيلاتشي","مارادونا","كلينسمان","ماتيوس"],correct:0},
{q:"أي منتخب فاز بكأس العالم 1982؟",a:["إيطاليا","ألمانيا","البرازيل","الأرجنتين"],correct:0},
{q:"من هو هداف كأس العالم 1986؟",a:["غاري لينيكر","مارادونا","بلاتيني","زيكو"],correct:0},
{q:"أي منتخب فاز بكأس العالم 1998؟",a:["فرنسا","البرازيل","إيطاليا","هولندا"],correct:0},
{q:"من هو هداف كأس العالم 2010؟",a:["توماس مولر","فيلا","فورلان","شنايدر"],correct:0},
{q:"أي منتخب فاز بكأس العالم 2006؟",a:["إيطاليا","فرنسا","ألمانيا","البرازيل"],correct:0},
{q:"من هو هداف كأس العالم 2014؟",a:["خاميس رودريغيز","مولر","كلوزه","ميسي"],correct:0},
{q:"أي منتخب فاز بكأس العالم 2002؟",a:["البرازيل","ألمانيا","تركيا","كوريا"],correct:0},
{q:"من هو هداف كأس العالم 2018؟",a:["هاري كين","مبابي","غريزمان","لوكاكو"],correct:0},
{q:"أي منتخب فاز بكأس العالم 2018؟",a:["فرنسا","كرواتيا","الأرجنتين","البرازيل"],correct:0},
{q:"من هو هداف كأس العالم 2022؟",a:["كيليان مبابي","ميسي","ألفاريز","جيرو"],correct:0},
{q:"أي منتخب فاز بكأس العالم 2022؟",a:["الأرجنتين","فرنسا","كرواتيا","المغرب"],correct:0},
{q:"من هو اللاعب الذي سجل أكثر أهداف في تاريخ كأس العالم؟",a:["ميروسلاف كلوزه","رونالدو","مولر","ميسي"],correct:0},
{q:"أي منتخب لعب أكثر نهائيات كأس عالم؟",a:["ألمانيا","البرازيل","إيطاليا","الأرجنتين"],correct:0},
{q:"من هو اللاعب الذي سجل في 4 نسخ مختلفة من كأس العالم قبل ميسي ورونالدو؟",a:["بيليه","كلوزه","مولر","باتيستوتا"],correct:0},
{q:"أي منتخب فاز بكأس العالم دون استقبال أي هدف في 1934؟",a:["إيطاليا","ألمانيا","الأرجنتين","البرازيل"],correct:0},
{q:"من هو اللاعب الذي سجل هدف الفوز في نهائي كأس العالم 2014؟",a:["ماريو غوتزه","مولر","كروس","أوزيل"],correct:0}
];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function shuffleAnswers(question){
    let answers = question.a.map((answer,index)=>({text:answer, correct:index===question.correct}));
    shuffle(answers);
    question.a = answers.map(a=>a.text);
    question.correct = answers.findIndex(a=>a.correct);
}

shuffle(questions);

function startTimer(){
    clearInterval(timer);
    time = 20;
    document.getElementById("timer").innerText = "⏳ الوقت: " + time;
    timer = setInterval(() => {
        time--;
        document.getElementById("timer").innerText = "⏳ الوقت: " + time;
        if(time <= 0){
            clearInterval(timer);
            autoAnswer();
        }
    }, 1000);
}

function autoAnswer(){
    let q = questions[currentQuestion];
    let buttons = document.querySelectorAll("#answers button");
    buttons.forEach(b => b.disabled = true);
    if(buttons[q.correct]) buttons[q.correct].classList.add("correct");
    document.getElementById("result").innerText = "⏰ انتهى الوقت!";
    setTimeout(nextQuestion, 1500);
}

function showQuestion(){
    document.getElementById("result").innerText = "";
    if(currentQuestion >= questions.length){
        endGame();
        return;
    }
    document.getElementById("progress").innerText = "السؤال " + (currentQuestion + 1) + " / " + questions.length;
    let q = questions[currentQuestion];
    shuffleAnswers(q);
    startTimer();
    document.getElementById("question").innerText = q.q;
    let answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";
    q.a.forEach((answer, index) => {
        let btn = document.createElement("button");
        btn.innerText = answer;
        btn.onclick = function(){
            clearInterval(timer);
            let buttons = document.querySelectorAll("#answers button");
            buttons.forEach(b => b.disabled = true);
            if(index === q.correct){
                score++;
                document.getElementById("score").innerText = "⭐ السكور: " + score;
                btn.classList.add("correct");
                document.getElementById("result").innerText = "✅ إجابة صحيحة";
                
                // تحديث المجموع الكلي لحظياً
                let currentTotal = parseInt(localStorage.getItem('totalScore')) || 0;
                localStorage.setItem('totalScore', currentTotal + 1);

            } else {
                btn.classList.add("wrong");
                if(buttons[q.correct]) buttons[q.correct].classList.add("correct");
                document.getElementById("result").innerText = "❌ خطأ! الإجابة: " + q.a[q.correct];
            }
            setTimeout(nextQuestion, 1500);
        };
        answersDiv.appendChild(btn);
    });
}

function nextQuestion(){
    currentQuestion++;
    showQuestion();
}

document.getElementById("skipBtn").onclick = function() {
    clearInterval(timer);
    nextQuestion();
};

function endGame() {
    clearInterval(timer);
    document.getElementById("question").innerText = "🏁 انتهت اللعبة";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("timer").innerText = "";
    document.getElementById("skipBtn").style.display = "none";
    
    let level = score < 20 ? "بداية أسطورة 🐣" : score < 40 ? "أسطورة حقيقي 👍" : "ملك اللعبة 👑";
    
    document.getElementById("result").innerHTML = `
        ⭐ نتيجتك في هذا الدور الأسطوري: ${score} / ${questions.length}<br>
        🏆 تقييمك: ${level}<br>
        🔥 تم تحديث رصيدك الكلي بنجاح!<br><br>
        <button onclick='restartGame()'>🔄 إعادة اللعب</button>
    `;
}

function restartGame(){
    document.getElementById("skipBtn").style.display = "block";
    score = 0;
    currentQuestion = 0;
    document.getElementById("score").innerText = "⭐ السكور: 0";
    document.getElementById("result").innerText = "";
    shuffle(questions);
    showQuestion();
}

function openAdmin(){
    let pass = prompt("ادخل كلمة مرور المدير");
    if(pass === "1234"){
        let panel = document.getElementById("adminPanel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
    } else {
        alert("❌ كلمة المرور خاطئة");
    }
}

showQuestion();
</script>
</body>
</html>
