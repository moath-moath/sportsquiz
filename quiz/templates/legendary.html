<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الأبطال - المستوى الأسطوري</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #000000 0%, #1a0a2e 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(10, 10, 10, 0.95);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(138, 43, 226, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.3);
            position: relative;
        }

        .honor-board {
            background: linear-gradient(110deg, #4b0082 20%, #8a2be2 40%, #4b0082 50%, #d4af37 70%, #4b0082 80%);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            border: 2px solid rgba(255, 215, 0, 0.5);
        }

        @keyframes shine { to { background-position: 200% center; } }

        .player-info h3 { 
            margin: 5px 0; font-size: 28px; font-weight: 900; 
            color: #ffffff; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .level-badge { 
            background: #000; color: #ffd700; padding: 6px 25px; 
            border-radius: 50px; font-size: 14px; font-weight: 900;
            display: inline-block; margin-top: 10px; border: 1px solid #ffd700;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #121212; padding: 12px; border-radius: 20px; border: 1px solid #333; }
        .stat-card.timer { border-bottom: 4px solid #ff0000; }
        .stat-card.points { border-bottom: 4px solid #ffd700; }

        #game-area {
            background: rgba(255,255,255,0.02);
            border-radius: 30px; padding: 25px 15px;
            min-height: 380px; margin-bottom: 50px;
        }

        #question { font-size: 19px; font-weight: 700; margin-bottom: 25px; min-height: 70px; line-height: 1.5; }

        .answers-container { display: grid; gap: 12px; }
        
        button.answer-btn {
            background: #1a1a1a; color: white; border: 1px solid #333;
            padding: 16px 15px; font-size: 16px; font-weight: 700;
            border-radius: 20px; cursor: pointer; width: 100%;
        }

        .correct { background: #ffd700 !important; color: #000 !important; }
        .wrong { background: #ff4b2b !important; }

        .google-login-btn {
            background: #4285F4; color: white; border: none; padding: 10px 20px;
            border-radius: 15px; cursor: pointer; font-weight: 700; font-family: 'Cairo';
        }

        #skipBtn, #hintBtn { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid #ffd700;
            color: #ffffff; padding: 8px 15px; border-radius: 12px;
            font-weight: 700; cursor: pointer; position: absolute; bottom: 20px;
        }
        #skipBtn { left: 20px; }
        #hintBtn { right: 20px; color: #ffd700; }
    </style>
</head>
<body>

    <div class="container">
        <div class="honor-board">
            <div class="player-info">
                <h3 id="display-username">جاري التحميل...</h3>
            </div>
            <span class="level-badge">المستوى الأسطوري 👑</span>
        </div>

        <div class="stats-grid" id="stats-ui">
            <div class="stat-card"><span>اللغز</span><br><span id="progress-val" class="stat-value">1/50</span></div>
            <div class="stat-card timer"><span>الوقت</span><br><span id="timer-val" class="stat-value" style="color:red">20</span></div>
            <div class="stat-card points"><span>النقاط</span><br><span id="session-points" class="stat-value" style="color:#ffd700">0</span></div>
        </div>

        <div id="game-area">
            <div id="quiz-content">
                <div id="question">برجاء تسجيل الدخول للبدء...</div>
                <div id="answers" class="answers-container"></div>
            </div>

            <div id="result-box" style="display:none;">
                <h2>👑 عرش الأساطير 👑</h2>
                <div id="final-score-text" style="font-size:30px; font-weight:900; color:#ffd700; margin:20px;"></div>
                <p id="redirect-msg" style="color: #888;">العودة للرئيسية خلال ثوانٍ...</p>
            </div>
        </div>

        <button id="skipBtn" onclick="nextQuestion()">⏭ تخطي</button>
        <button id="hintBtn" onclick="useHint()">💡 تلميح</button>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAEKcYJkl2mpGaM04ppixUnGeygKn3Nu_8",
          authDomain: "champions-challenge-2a13a.firebaseapp.com",
          projectId: "champions-challenge-2a13a",
          storageBucket: "champions-challenge-2a13a.firebasestorage.app",
          messagingSenderId: "267945781501",
          appId: "1:267945781501:web:6be03f02151127aec0b694",
          measurementId: "G-6EYLJ9SYJ0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = () => signInWithPopup(auth, provider);

        onAuthStateChanged(auth, (user) => {
            const displayArea = document.getElementById('display-username');
            if (user) {
                displayArea.innerText = user.displayName;
                initGame();
            } else {
                displayArea.innerHTML = `<button onclick="loginWithGoogle()" class="google-login-btn">دخول الأساطير</button>`;
                document.getElementById('question').innerText = "هذا المستوى مخصص للنخبة، سجل دخولك لتثبت جدارتك.";
            }
        });

        window.saveFinalScore = async function(score) {
            const user = auth.currentUser;
            if(!user) return;
            try {
                await addDoc(collection(db, "leaderboard"), {
                    name: user.displayName,
                    email: user.email,
                    points: Number(score),
                    level: "أسطوري",
                    timestamp: serverTimestamp()
                });
            } catch (e) { console.error(e); }
        };
    </script>

    <script>
        // دمج بنك الأسئلة الخاص بك هنا (تم استخدام الأسئلة التي وفرتها أنت)
        const legendaryBank = [
            {q:"من هو اللاعب الوحيد الذي سجل في نهائي دوري الأبطال مع 3 أندية مختلفة؟", a:["كريستيانو رونالدو","ماريو ماندزوكيتش","كلارنس سيدورف","سامويل إيتو"], c:"كريستيانو رونالدو"},
            {q:"أي منتخب هو الوحيد الذي شارك في المونديال دون أن يستقبل أي هدف (خرج بركلات الترجيح)؟", a:["سويسرا 2006","إيطاليا 1990","فرنسا 1998","البرازيل 1986"], c:"سويسرا 2006"},
            {q:"من هو أول لاعب أفريقي يتوج بلقب هداف الدوري الإنجليزي؟", a:["توني بوييبوا","ديدييه دروغبا","إيمانويل أديبايور","محمد صلاح"], c:"توني بوييبوا"},
            // ... (بقية الأسئلة التي أضفتها أنت في الكود السابق)
            {q:"من هو اللاعب صاحب أكبر عدد من الأهداف في موسم واحد من دوري الأبطال (17 هدف)؟", a:["رونالدو","ميسي","ليفاندوفسكي","بنزيمة"], c:"رونالدو"}
        ];

        let questions = [];
        let currentIndex = 0;
        let scoreInSession = 0;
        let timer;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        window.initGame = function() {
            questions = [...legendaryBank]; // نستخدم البنك الأسطوري
            shuffle(questions);
            currentIndex = 0;
            scoreInSession = 0;
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= 50 || currentIndex >= questions.length) return finish();
            document.getElementById('hintBtn').disabled = false;
            clearInterval(timer);
            let timeLeft = 20;
            document.getElementById('timer-val').innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) nextQuestion();
            }, 1000);

            document.getElementById('progress-val').innerText = `${currentIndex + 1}/50`;
            const q = questions[currentIndex];
            document.getElementById('question').innerText = q.q;
            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            let opts = [...q.a];
            shuffle(opts);
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, q.c);
                ansBox.appendChild(btn);
            });
        }

        function useHint() {
            const q = questions[currentIndex];
            const btns = document.querySelectorAll('.answer-btn');
            let removed = 0;
            btns.forEach(b => {
                if(b.innerText !== q.c && removed < 2) {
                    b.style.visibility = 'hidden';
                    removed++;
                }
            });
            document.getElementById('hintBtn').disabled = true;
        }

        function checkAnswer(btn, sel, cor) {
            clearInterval(timer);
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');
            if (sel === cor) {
                btn.classList.add('correct');
                scoreInSession += 3; // 3 نقاط لكل إجابة في المستوى الأسطوري
                document.getElementById('session-points').innerText = scoreInSession;
            } else {
                btn.classList.add('wrong');
                btns.forEach(b => { if(b.innerText === cor) b.classList.add('correct'); });
            }
            setTimeout(nextQuestion, 1200);
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function finish() {
            clearInterval(timer);
            window.saveFinalScore(scoreInSession);
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('stats-ui').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('final-score-text').innerText = `جمعت ${scoreInSession} نقطة في عرش الأساطير!`;
            setTimeout(() => window.location.href = 'index.html', 5000);
        }
    </script>
</body>
</html>
