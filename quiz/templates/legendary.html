<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الأبطال - المستوى الأسطوري</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(26, 26, 46, 0.95);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
        }

        .honor-board {
            background: linear-gradient(110deg, #bf953f 20%, #fcf6ba 40%, #b38728 50%, #fcf6ba 70%, #aa771c 80%);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(191, 149, 63, 0.4);
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .player-info h3 { 
            margin: 5px 0; 
            font-size: 32px; 
            font-weight: 900; 
            color: #1a1a2e;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        .encouragement { 
            color: #5d4037; 
            font-weight: 900; 
            font-size: 16px; 
            display: block; 
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .level-badge { 
            background: #1a1a2e; color: #ffd700; 
            padding: 6px 25px; border-radius: 50px; font-size: 14px; font-weight: 900;
            display: inline-block; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #16213e; padding: 12px; border-radius: 20px; border: 1px solid #333; }
        .stat-card.timer { border-bottom: 4px solid #ffd700; }
        .stat-card.points { border-bottom: 4px solid #00ff88; }

        .stat-label { font-size: 10px; color: #888; display: block; }
        .stat-value { font-size: 18px; font-weight: 900; }

        #game-area {
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 25px 15px;
            min-height: 350px;
            margin-bottom: 50px;
        }

        #question { font-size: 20px; font-weight: 700; margin-bottom: 25px; min-height: 60px; line-height: 1.4; }

        .answers-container { display: grid; gap: 12px; }
        
        button.answer-btn {
            background: #0f3460; color: white; border: 1px solid #16213e;
            padding: 18px 15px; font-size: 17px; font-weight: 700;
            border-radius: 20px; cursor: pointer; transition: 0.2s;
            width: 100%;
            line-height: 1.2;
        }

        .correct { background: #00ff88 !important; color: #000 !important; font-weight: 900; }
        .wrong { background: #e94560 !important; }

        #skipBtn { 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #bf953f;
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: auto;
        }
        
        .restart-btn {
            background: #ffd700; color: #000; padding: 15px 30px;
            border-radius: 50px; border: none; font-weight: 900;
            font-size: 18px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="honor-board">
            <span class="encouragement">TOP CHAMPION</span>
            <div class="player-info">
                <h3 id="display-username">جاري التحميل...</h3>
            </div>
            <span class="level-badge">المستوى الأسطوري</span>
        </div>

        <div class="stats-grid" id="stats-ui">
            <div class="stat-card">
                <span class="stat-label">السؤال</span>
                <span id="progress-val" class="stat-value">1/50</span>
            </div>
            <div class="stat-card timer">
                <span class="stat-label">الوقت</span>
                <span id="timer-val" class="stat-value" style="color:#ffd700">20</span>
            </div>
            <div class="stat-card points">
                <span class="stat-label">نقاط الجولة</span>
                <span id="session-points" class="stat-value" style="color:#00ff88">0</span>
            </div>
        </div>

        <div id="game-area">
            <div id="quiz-content">
                <div id="question">جاري التحميل...</div>
                <div id="answers" class="answers-container"></div>
            </div>

            <div id="result-box" style="display:none;">
                <h2>👑 المجد للأسطورة! 👑</h2>
                <div id="final-score-text" style="font-size:35px; font-weight:900; color:#ffd700; margin:20px;"></div>
                <button class="restart-btn" onclick="location.reload()">🔄 إعادة المحاولة</button>
                <p id="redirect-msg" style="margin-top: 25px; color: #888; font-size: 14px;">
                    العودة للقائمة الرئيسية خلال <span id="countdown">5</span> ثوانٍ...
                </p>
            </div>
        </div>

        <button id="skipBtn" onclick="nextQuestion()">
            <span>⏭</span>
            <span>تخطي</span>
        </button>
    </div>

    <script>
        const bank = [
            {q:"من هو النادي الوحيد الذي فاز بلقب الدوري الإنجليزي 'الذهبي' دون خسارة؟", a:["أرسنال","مان سيتي","ليفربول","بريستون نورث إند"], c:"أرسنال"},
            {q:"من هو اللاعب الذي سجل أكبر عدد من الأهداف في مباراة واحدة بكأس العالم؟", a:["أوليج سالينكو","جوست فونتين","بيليه","أوزيبيو"], c:"أوليج سالينكو"},
            {q:"أي منتخب خسر 3 نهائيات كأس عالم (1974, 1978, 2010) دون تحقيق اللقب؟", a:["هولندا","المجر","الأرجنتين","تشيكوسلوفاكيا"], c:"هولندا"},
            {q:"من هو الحارس الوحيد في التاريخ الذي فاز بالكرة الذهبية (Ballon d'Or)؟", a:["ليف ياشين","بوفون","نوير","دينو زوف"], c:"ليف ياشين"},
            {q:"من هو الهداف التاريخي لنهائيات كأس العالم؟", a:["ميروسلاف كلوزه","رونالدو البرازيلي","ميسي","مولر"], c:"ميروسلاف كلوزه"},
            {q:"كم عدد أهداف جوست فونتين في نسخة واحدة من المونديال (1958)؟", a:["13","10","15","12"], c:"13"},
            {q:"من هو المدرب الذي فاز بدوري أبطال أوروبا مع 3 أندية مختلفة؟", a:["أنشيلوتي","مورينيو","بيب جوارديولا","هيتسفيلد"], c:"أنشيلوتي"},
            {q:"أي نادٍ فاز بأول نسخة من دوري أبطال أوروبا (الكأس الغالية) عام 1956؟", a:["ريال مدريد","ريمس","ميلان","بنفيكا"], c:"ريال مدريد"},
            {q:"من هو اللاعب الوحيد الذي فاز بكأس العالم 3 مرات كلاعب؟", a:["بيليه","كافو","رونالدو","مارادونا"], c:"بيليه"},
            {q:"من هو صاحب أسرع هاتريك في تاريخ الدوري الإنجليزي الممتاز؟", a:["ساديو ماني","روبي فاولر","صلاح","سون"], c:"ساديو ماني"},
            {q:"أي منتخب يحمل الرقم القياسي في عدد مرات الفوز بكأس القارات (4 مرات)؟", a:["البرازيل","فرنسا","الأرجنتين","ألمانيا"], c:"البرازيل"},
            {q:"من هو الهداف التاريخي للمنتخب الألماني؟", a:["ميروسلاف كلوزه","جيرد مولر","بودولسكي","رومينيغه"], c:"ميروسلاف كلوزه"},
            {q:"في أي عام تأسس الاتحاد الدولي لكرة القدم (FIFA)؟", a:["1904","1900","1912","1920"], c:"1904"},
            {q:"من هو اللاعب الملقب بـ 'الجوهرة السوداء'؟", a:["بيليه","إوزيبيو","ويا","إيتو"], c:"بيليه"},
            {q:"من هو صاحب أسرع هدف في تاريخ نهائيات كأس العالم؟", a:["هاكان شوكور","فالنتين إيفانوف","رونالدو","كلوزه"], c:"هاكان شوكور"},
            {q:"أي لاعب سجل 'سوبر هاتريك' في مرمى ريال مدريد بنصف نهائي الأبطال 2013؟", a:["ليفاندوفسكي","ميسي","مولر","رويس"], c:"ليفاندوفسكي"},
            {q:"من هو النادي الإسكتلندي الوحيد الذي فاز بدوري أبطال أوروبا (1967)؟", a:["سيلتيك","رينجرز","أبردين","هارتس"], c:"سيلتيك"},
            {q:"من هو الهداف التاريخي للدوري الإيطالي؟", a:["سيلفيو بيولا","فرانشيسكو توتي","جوزيبي مياتزا","نوردال"], c:"سيلفيو بيولا"},
            {q:"من هو اللاعب الذي سجل هدف الفوز لإسبانيا في نهائي مونديال 2010؟", a:["أندريس إنييستا","تشافي","فيا","بويول"], c:"أندريس إنييستا"},
            {q:"ما هو النادي الذي يلقب بـ 'الغواصات الصفراء' في إسبانيا؟", a:["فياريال","قادش","لاس بالماس","إلتشي"], c:"فياريال"},
            {q:"من هو المدرب الذي حقق 'السداسية' التاريخية مع بايرن ميونخ عام 2020؟", a:["هانز فليك","يوب هاينكس","جوارديولا","أنشيلوتي"], c:"هانز فليك"},
            {q:"أي لاعب فاز بدوري الأبطال مع 3 أندية مختلفة (أياكس، ريال مدريد، ميلان)؟", a:["سيدورف","إبراهيموفيتش","إيتو","رونالدو"], c:"سيدورف"},
            {q:"من هو أول لاعب إفريقي يتوج بالكرة الذهبية (1995)؟", a:["جورج ويا","إيتو","دروغبا","ميلا"], c:"جورج ويا"},
            {q:"كم عدد ألقاب نادي إي سي ميلان في دوري أبطال أوروبا؟", a:["7","6","5","8"], c:"7"},
            {q:"من هو اللاعب الذي سجل هدف 'مارادونا' الشهير باليد ضد إنجلترا؟", a:["دييغو مارادونا","روماريو","فالدانو","باتيستوتا"], c:"دييغو مارادونا"},
            {q:"أي نادٍ فاز بالدوري الإنجليزي عام 2016 في أكبر مفاجأة بالتاريخ؟", a:["ليستر سيتي","إيفرتون","توتنهام","ويستهام"], c:"ليستر سيتي"},
            {q:"من هو الهداف التاريخي لبطولة كأس الأمم الأوروبية (اليورو)؟", a:["رونالدو","بلاتيني","جريزمان","شيرر"], c:"رونالدو"},
            {q:"من هو الحارس الذي تصدى لـ 5 ركلات جزاء في موسم واحد بالليغا؟", a:["دييغو ألفيش","أوبلاك","كورتوا","تير شتيغن"], c:"دييغو ألفيش"},
            {q:"في أي ملعب أقيمت 'معجزة إسطنبول' بين ليفربول وميلان 2005؟", a:["أتاتورك","أليانز أرينا","كامب نو","ويمبلي"], c:"أتاتورك"},
            {q:"من هو المدرب صاحب أطول فترة تدريبية في تاريخ الدوري الإنجليزي؟", a:["أرسين فينغر","أليكس فيرغسون","مويز","بوسبي"], c:"أرسين فينغر"},
            {q:"أي نادٍ فاز بلقب الدوري الفرنسي 7 مرات متتالية (2002-2008)؟", a:["ليون","باريس","مارسيليا","موناكو"], c:"ليون"},
            {q:"من هو اللاعب الذي سجل 5 أهداف في 9 دقائق ضد فولفسبورغ؟", a:["ليفاندوفسكي","أغويرو","ميسي","رونالدو"], c:"ليفاندوفسكي"},
            {q:"كم عدد ألقاب منتخب الأرجنتين في كأس العالم (حتى 2022)؟", a:["3","2","4","5"], c:"3"},
            {q:"من هو اللاعب الملقب بـ 'بودا الصغير'؟", a:["روبرتو باجيو","ديل بييرو","بيرلو","توتي"], c:"روبرتو باجيو"},
            {q:"من فاز بالكرة الذهبية عام 2003؟", a:["باول نيدفيد","هنري","زيدان","شيفشينكو"], c:"باول نيدفيد"},
            {q:"أي نادٍ يلقب بـ 'الخفافيش'؟", a:["فالنسيا","ليفانتي","إشبيلية","فاليكانو"], c:"فالنسيا"},
            {q:"من هو اللاعب الذي لقب بـ 'الظاهرة'؟", a:["رونالدو البرازيلي","كريستيانو","رونالدينيو","روماريو"], c:"رونالدو البرازيلي"},
            {q:"أي منتخب فاز بكأس العالم 1930؟", a:["أوروغواي","الأرجنتين","البرازيل","إيطاليا"], c:"أوروغواي"},
            {q:"من هو المدرب الذي فاز بكأس العالم كلاعب ومدرب؟", a:["ماريو زاغالو","مارادونا","كلينسمان","دونجا"], c:"ماريو زاغالو"},
            {q:"أي نادٍ إنجليزي فاز بدوري الأبطال عام 1982؟", a:["أستون فيلا","نوتنغهام فورست","ليفربول","توتنهام"], c:"أستون فيلا"},
            {q:"كم عدد ألقاب منتخب أوروغواي في كأس العالم؟", a:["2","1","3","4"], c:"2"},
            {q:"من هو الهداف التاريخي للدوري الإسباني (الليغا)؟", a:["ميسي","رونالدو","زارا","راؤول"], c:"ميسي"},
            {q:"أي منتخب يلقب بـ 'المانشافت'؟", a:["ألمانيا","هولندا","النمسا","سويسرا"], c:"ألمانيا"},
            {q:"من هو اللاعب الملقب بـ 'المهندس'؟", a:["بيرلو","تشافي","إنييستا","مودريتش"], c:"بيرلو"},
            {q:"ما هو النادي الأكثر تتويجاً بالدوري الألماني؟", a:["بايرن ميونخ","دورتموند","نورنبرغ","شالكه"], c:"بايرن ميونخ"},
            {q:"من سجل هدف فوز فرنسا في نهائي يورو 2000؟", a:["تريزيغيه","زيدان","هنري","دوجاري"], c:"تريزيغيه"},
            {q:"كم مرة فاز يوفنتوس بدوري أبطال أوروبا؟", a:["2","3","4","1"], c:"2"},
            {q:"من هو اللاعب الملقب بـ 'الفرعون المصري'؟", a:["محمد صلاح","أبو تريكة","الخطيب","زيدان"], c:"محمد صلاح"},
            {q:"في أي مدينة يقع ملعب 'سان سيرو'؟", a:["ميلانو","روما","تورينو","نابولي"], c:"ميلانو"},
            {q:"من هو المنتخب الأكثر فوزاً بكأس أمم إفريقيا؟", a:["مصر","الكاميرون","غانا","نيجيريا"], c:"مصر"}
        ];

        let questions = [];
        let currentIndex = 0;
        let scoreInSession = 0;
        let timer;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function init() {
            const savedName = localStorage.getItem('player_username') || "بطل مجهول";
            document.getElementById('display-username').innerText = savedName;
            
            questions = [...bank];
            shuffle(questions);
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= 50) return finish();

            clearInterval(timer);
            let timeLeft = 20;
            document.getElementById('timer-val').innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) nextQuestion();
            }, 1000);

            document.getElementById('progress-val').innerText = `${currentIndex + 1}/50`;
            const q = questions[currentIndex];
            document.getElementById('question').innerText = q.q;

            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            
            let options = [...q.a];
            shuffle(options);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, q.c);
                ansBox.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            clearInterval(timer);
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('correct');
                scoreInSession++;
                document.getElementById('session-points').innerText = scoreInSession;
                
                let total = parseInt(localStorage.getItem('user_total_points')) || 0;
                localStorage.setItem('user_total_points', total + 1);
            } else {
                btn.classList.add('wrong');
                btns.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
            }

            setTimeout(nextQuestion, 1000);
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function finish() {
            clearInterval(timer);
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            document.getElementById('stats-ui').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('final-score-text').innerText = `أنهيت المستوى الأسطوري بـ ${scoreInSession} نقطة!`;

            let count = 5;
            const countDisplay = document.getElementById('countdown');
            const redirectTimer = setInterval(() => {
                count--;
                countDisplay.innerText = count;
                if (count <= 0) {
                    clearInterval(redirectTimer);
                    window.location.href = 'index.html'; 
                }
            }, 1000);
        }

        window.onload = init;
    </script>
</body>
</html>
