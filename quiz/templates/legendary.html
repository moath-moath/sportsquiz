<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 المستوى الأسطوري - لوحة الشرف الملكية</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(27, 38, 59, 0.7);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .honor-board {
            background: linear-gradient(135deg, #d4af37 0%, #f9f295 45%, #b8860b 50%, #f9f295 55%, #d4af37 100%);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #ffffff;
            color: #1a1a1a;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .player-info h3 { margin: 2px 0; font-size: 20px; font-weight: 900; }
        .level-badge { 
            background: #1a1a1a; color: #ffd700; 
            padding: 5px 15px; border-radius: 50px; font-size: 13px; font-weight: bold;
            display: inline-block; margin-top: 5px; border: 1px solid #ffd700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(13, 27, 42, 0.6);
            padding: 12px 5px;
            border-radius: 18px;
            border-bottom: 3px solid #415a77;
        }

        .stat-label { font-size: 11px; color: #a2adbb; display: block; }
        .stat-value { font-size: 18px; font-weight: 900; }

        #game-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 25px 15px;
            min-height: 260px;
        }

        #question { font-size: 1.1rem; line-height: 1.5; font-weight: 700; margin-bottom: 20px; }

        .answers-container { display: grid; gap: 10px; }

        button.answer-btn {
            background: #415a77;
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .correct { background: #00e676 !important; color: #000 !important; }
        .wrong { background: #ff5252 !important; }

        #skipBtn {
            background: transparent;
            width: 80%;
            margin-top: 15px;
            padding: 12px;
            border-radius: 50px;
            border: 1px solid #778da9;
            color: #778da9;
            font-weight: bold;
            cursor: pointer;
        }

        #final-screen { display: none; }
    </style>
</head>

<body>

    <div class="container">
        <div class="honor-board">
            <div class="player-info">
                <span style="font-size: 11px; font-weight: bold;">LEGENDARY PLAYER</span>
                <h3 id="display-username">جاري التحميل...</h3>
            </div>
            <span class="level-badge">👑 المستوى الأسطوري</span>
        </div>

        <div id="ui-main">
            <div class="stats-grid">
                <div class="stat-card"><span class="stat-label">السؤال</span><span id="progress-val" class="stat-value">1/50</span></div>
                <div class="stat-card"><span class="stat-label">الوقت</span><span id="timer-val" class="stat-value" style="color:#ffd60a">20</span></div>
                <div class="stat-card"><span class="stat-label">النقاط</span><span id="score-val" class="stat-value" style="color:#00e5ff">0</span></div>
            </div>

            <div id="game-area">
                <h2 id="question">تحميل الأسئلة المعقدة...</h2>
                <div id="answers" class="answers-container"></div>
            </div>

            <button id="skipBtn">⏭ تخطي السؤال</button>
        </div>

        <div id="final-screen">
            <h2 style="color:#ffd700">🏁 انتهت الملحمة!</h2>
            <div id="final-score" style="font-size:24px; margin:20px 0;"></div>
            <div id="rank" style="font-size:20px; color:#00e5ff; margin-bottom: 20px;"></div>
            <p id="redirect-msg" style="color:#ffd60a;"></p>
        </div>
    </div>

    <script>
        const savedName = localStorage.getItem('username') || "أسطورة";
        document.getElementById("display-username").textContent = savedName;

        // قائمة الـ 50 سؤالاً الأسطورية (تم تدقيقها يدوياً)
        const questions = [
            { q: "من هو اللاعب الذي سجل أول هدف في تاريخ كأس العالم 1930؟", a: ["لوسيان لوران", "غييرمو ستابيلي", "بيليه", "نارسيسو دوفال"], correct: 0 },
            { q: "أي منتخب هو الوحيد الذي شارك في كل نسخ المونديال؟", a: ["ألمانيا", "إيطاليا", "البرازيل", "الأرجنتين"], correct: 2 },
            { q: "من هو الهداف التاريخي لكأس العالم؟", a: ["رونالدو البرازيلي", "ميروسلاف كلوزه", "غيرد مولر", "جوست فونتين"], correct: 1 },
            { q: "كم عدد أهداف جوست فونتين في نسخة واحدة (1958)؟", a: ["10 أهداف", "11 هدفاً", "12 هدفاً", "13 هدفاً"], correct: 3 },
            { q: "أي لاعب فاز بكأس العالم 3 مرات؟", a: ["مارادونا", "بيليه", "بيكنباور", "رونالدو"], correct: 1 },
            { q: "من هو أول لاعب يسجل هاتريك في نهائي كأس العالم؟", a: ["جيف هيرست", "مبابي", "زيدان", "بيليه"], correct: 0 },
            { q: "في أي عام فازت إسبانيا بكأس العالم لأول مرة؟", a: ["2006", "2010", "2014", "1998"], correct: 1 },
            { q: "من هو المنتخب الفائز بأول نسخة أمم أوروبا 1960؟", a: ["ألمانيا الغربية", "الاتحاد السوفيتي", "إسبانيا", "فرنسا"], correct: 1 },
            { q: "أي نادٍ فاز بأول 5 نسخ من دوري أبطال أوروبا؟", a: ["ميلان", "بايرن ميونخ", "ليون", "ريال مدريد"], correct: 3 },
            { q: "من هو اللاعب الملقب بـ 'المايسترو' الذي قاد إيطاليا في 2006؟", a: ["توتي", "ديل بييرو", "بيرلو", "كانافارو"], correct: 2 },
            { q: "ما هي الدولة التي استضافت كأس العالم مرتين (1970 و1986)؟", a: ["المكسيك", "البرازيل", "ألمانيا", "فرنسا"], correct: 0 },
            { q: "من هو اللاعب صاحب أسرع هدف في تاريخ كأس العالم؟", a: ["هاكان شوكور", "رونالدو", "ميسي", "ديفيد بلات"], correct: 0 },
            { q: "أي منتخب فاز بكأس العالم 1954 (معجزة بيرن)؟", a: ["المجر", "ألمانيا الغربية", "إيطاليا", "البرازيل"], correct: 1 },
            { q: "من هو الحارس الوحيد الفائز بالكرة الذهبية؟", a: ["بوفون", "ليف ياشين", "كاسياس", "نوير"], correct: 1 },
            { q: "في أي عام تم تغيير اسم الكأس من 'جول ريمي' إلى 'كأس العالم'؟", a: ["1970", "1974", "1966", "1982"], correct: 1 },
            { q: "من هو الهداف التاريخي لدوري أبطال أوروبا؟", a: ["ميسي", "رونالدو", "ليفاندوفسكي", "بنزيمة"], correct: 1 },
            { q: "من سجل هدف الفوز لألمانيا في نهائي 2014؟", a: ["مولر", "كروس", "ماريو غوتزه", "أوزيل"], correct: 2 },
            { q: "أي نادٍ حقق السداسية التاريخية لأول مرة عام 2009؟", a: ["بايرن ميونخ", "مانشستر يونايتد", "برشلونة", "ريال مدريد"], correct: 2 },
            { q: "من هو المدرب الذي فاز بدوري الأبطال مع 3 أندية مختلفة؟", a: ["مورينيو", "أنشيلوتي", "غوارديولا", "زيدان"], correct: 1 },
            { q: "أي لاعب يمتلك أكبر عدد من الأهداف الدولية؟", a: ["ميسي", "رونالدو", "علي دائي", "بيليه"], correct: 1 },
            { q: "أين أقيم نهائي دوري أبطال أوروبا 2005 (المعجزة)؟", a: ["لندن", "باريس", "إسطنبول", "موسكو"], correct: 2 },
            { q: "من هو اللاعب الملقب بـ 'بودا' في الكرة الإيطالية؟", a: ["روبرتو باجيو", "مالديني", "بيرلو", "بوفون"], correct: 0 },
            { q: "كم مرة فازت هولندا بلقب كأس العالم؟", a: ["مرة واحدة", "مرتين", "3 مرات", "صفر"], correct: 3 },
            { q: "من هو أصغر لاعب يشارك في تاريخ المونديال؟", a: ["بيليه", "نورمان وايتسايد", "إيتو", "ميسي"], correct: 1 },
            { q: "في أي عام فاز المنتخب العراقي بكأس آسيا؟", a: ["2000", "2007", "2011", "1996"], correct: 1 },
            { q: "من هو المنتخب صاحب أكبر عدد من ألقاب كوبا أمريكا؟", a: ["البرازيل", "الأرجنتين", "الأوروغواي", "تشيلي"], correct: 1 },
            { q: "أي لاعب سجل 'هدف القرن' ضد إنجلترا عام 1986؟", a: ["مارادونا", "بيليه", "زيكو", "بلاتيني"], correct: 0 },
            { q: "من هو اللاعب الذي سجل في 5 نسخ مختلفة من كأس العالم؟", a: ["ميسي", "رونالدو", "كلوزه", "بيليه"], correct: 1 },
            { q: "ما هو النادي الذي يلقب بـ 'الشياطين الحمر' في إنجلترا؟", a: ["ليفربول", "آرسنال", "مانشستر يونايتد", "تشيلسي"], correct: 2 },
            { q: "من هو الحارس الذي تصدى لركلة جزاء زيدان في نهائي 2006؟", a: ["بوفون", "تولدو", "بارتيز", "كاسياس"], correct: 2 },
            { q: "كم عدد ألقاب مصر في كأس أمم أفريقيا؟", a: ["5", "6", "7", "8"], correct: 2 },
            { q: "من هو اللاعب الملقب بـ 'الفاروز' (Pharaoh) في ليفربول؟", a: ["ماني", "صلاح", "فيرمينو", "نونيز"], correct: 1 },
            { q: "من فاز بكأس العالم 1998؟", a: ["البرازيل", "فرنسا", "كرواتيا", "إيطاليا"], correct: 1 },
            { q: "ما هي جنسية اللاعب أوزيبيو؟", a: ["البرازيل", "البرتغال", "إسبانيا", "فرنسا"], correct: 1 },
            { q: "أي منتخب يلقب بـ 'الماتادور'؟", a: ["المكسيك", "إسبانيا", "الأرجنتين", "كولومبيا"], correct: 1 },
            { q: "من هو الهداف التاريخي لنادي برشلونة؟", a: ["رونالدينيو", "ميسي", "سواريز", "إيتو"], correct: 1 },
            { q: "أين أقيم كأس العالم 1994؟", a: ["إيطاليا", "فرنسا", "الولايات المتحدة", "اليابان"], correct: 2 },
            { q: "كم دقيقة استمرت أطول مباراة في التاريخ؟", a: ["90", "120", "173", "200"], correct: 2 },
            { q: "من هو اللاعب الذي طُرد في نهائي 2006؟", a: ["هنري", "زيدان", "ماتيرازي", "ريبيري"], correct: 1 },
            { q: "أي نادٍ يلقب بـ 'المدفعجية'؟", a: ["آرسنال", "توتنهام", "إيفرتون", "فولهام"], correct: 0 },
            { q: "من فاز بالكرة الذهبية عام 2018؟", a: ["ميسي", "رونالدو", "لوكا مودريتش", "مبابي"], correct: 2 },
            { q: "في أي عام اعتزل بيليه كرة القدم دولياً؟", a: ["1970", "1971", "1974", "1977"], correct: 1 },
            { q: "من هو صاحب أسرع هاتريك في الدوري الإنجليزي؟", a: ["صلاح", "ماني", "روني", "أغويرو"], correct: 1 },
            { q: "أي منتخب فاز بكأس العرب 2021؟", a: ["تونس", "مصر", "الجزائر", "المغرب"], correct: 2 },
            { q: "كم عدد قلوب الدفاع في خطة 4-3-3 الكلاسيكية؟", a: ["1", "2", "3", "4"], correct: 1 },
            { q: "من هو الملقب بـ 'زيكو الأبيض'؟", a: ["سقراط", "باجيو", "بلاتيني", "زيدان"], correct: 2 },
            { q: "أي منتخب فاز بكأس العالم 2022؟", a: ["فرنسا", "الأرجنتين", "المغرب", "كرواتيا"], correct: 1 },
            { q: "من هو اللاعب الملقب بـ 'الظاهرة'؟", a: ["رونالدو لويس نازاريو", "رونالدينيو", "كريستيانو", "نيمار"], correct: 0 },
            { q: "أين تقع أكاديمية 'لاماسيا'؟", a: ["مدريد", "برشلونة", "ميلانو", "لندن"], correct: 1 },
            { q: "من هو بطل الدوري الإنجليزي التاريخي (أكثر من فاز به)؟", a: ["ليفربول", "مانشستر سيتي", "مانشستر يونايتد", "آرسنال"], correct: 2 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timerId;
        let timeLeft = 20;

        function initGame() {
            if (currentQuestion >= questions.length) {
                endGame();
                return;
            }

            document.getElementById("progress-val").innerText = `${currentQuestion + 1}/${questions.length}`;
            let q = questions[currentQuestion];
            document.getElementById("question").innerText = q.q;
            
            let answersDiv = document.getElementById("answers");
            answersDiv.innerHTML = "";

            q.a.forEach((ans, index) => {
                let btn = document.createElement("button");
                btn.className = "answer-btn";
                btn.innerText = ans;
                btn.onclick = () => checkAnswer(index, q.correct, btn);
                answersDiv.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerId);
            timeLeft = 20;
            document.getElementById("timer-val").innerText = timeLeft;
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById("timer-val").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    nextQuestion();
                }
            }, 1000);
        }

        function checkAnswer(selected, correct, btn) {
            clearInterval(timerId);
            let buttons = document.querySelectorAll(".answer-btn");
            buttons.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add("correct");
                score++;
                document.getElementById("score-val").innerText = score;
            } else {
                btn.classList.add("wrong");
                buttons[correct].classList.add("correct");
            }
            setTimeout(nextQuestion, 1200);
        }

        function nextQuestion() {
            currentQuestion++;
            initGame();
        }

        document.getElementById("skipBtn").onclick = () => {
            clearInterval(timerId);
            nextQuestion();
        };

        function endGame() {
            document.getElementById("ui-main").style.display = "none";
            document.getElementById("final-screen").style.display = "block";
            
            document.getElementById("final-score").innerText = `نقاطك: ${score} من 50`;
            
            let rank = "";
            if (score >= 45) rank = "حاكم كرة القدم الأبدي 🏆";
            else if (score >= 30) rank = "ملك الملاعب 👑";
            else rank = "أسطورة ناشئ ⚔️";
            
            document.getElementById("rank").innerText = `اللقب: ${rank}`;
            
            let count = 10;
            const redirectMsg = document.getElementById("redirect-msg");
            const interval = setInterval(() => {
                redirectMsg.innerText = `🔄 العودة للرئيسية خلال ${count} ثوانٍ...`;
                if (count <= 0) {
                    clearInterval(interval);
                    window.location.href = "/";
                }
                count--;
            }, 1000);
        }

        initGame();
    </script>
</body>
</html>
