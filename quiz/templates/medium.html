<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سيرفر المطورين - المستوى المتوسط</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 100, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.1) 0%, transparent 50%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(15, 15, 15, 0.95);
            padding: 25px 20px;
            border-radius: 35px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 150, 255, 0.2);
            border: 1px solid #222;
            backdrop-filter: blur(10px);
        }

        .level-header {
            background: linear-gradient(135deg, #0044cc 0%, #001133 100%);
            padding: 15px;
            border-radius: 25px;
            margin-bottom: 20px;
            border: 1px solid #00d2ff;
            box-shadow: 0 10px 20px rgba(0, 68, 204, 0.3);
        }

        .player-info h3 { 
            margin: 5px 0; 
            font-size: 26px; 
            font-weight: 900; 
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .encouragement { color: #00d2ff; font-weight: 700; font-size: 14px; display: block; margin-bottom: 5px; }

        .level-badge { 
            background: #00d2ff; color: #000; 
            padding: 5px 20px; border-radius: 50px; font-size: 13px; font-weight: 900;
            display: inline-block; margin-top: 8px;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #111; padding: 12px 5px; border-radius: 15px; border: 1px solid #333; }
        .stat-card.progress { border-bottom: 3px solid #8a2be2; }
        .stat-card.points { border-bottom: 3px solid #00d2ff; }
        .stat-card.timer { border-bottom: 3px solid #ffcc00; }

        .stat-label { font-size: 10px; color: #666; display: block; margin-bottom: 2px; }
        .stat-value { font-size: 16px; font-weight: 900; }

        #game-area {
            background: rgba(25, 25, 25, 0.5);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid #333;
            min-height: 320px;
        }

        #question { font-size: 19px; font-weight: 700; color: #ffffff; margin-bottom: 25px; min-height: 70px; line-height: 1.5; }

        .answers-container { display: grid; gap: 10px; }
        button.answer-btn {
            background: #1e1e1e; color: #eee; border: 1px solid #333; padding: 15px;
            font-size: 15px; font-weight: 600; border-radius: 15px; cursor: pointer; transition: 0.2s;
        }

        .correct { background: #00c853 !important; color: white !important; }
        .wrong { background: #ff1744 !important; color: white !important; }

        #skipBtn { 
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #0044cc;
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            width: fit-content;
        }
        
        #skipBtn:active { transform: scale(0.95); background: rgba(0, 68, 204, 0.2); }

        .restart-btn {
            background: #00d2ff; color: #000; padding: 15px 30px;
            border-radius: 50px; border: none; font-weight: 900;
            font-size: 18px; cursor: pointer; margin-top: 20px;
        }

        /* تنسيق عداد العودة */
        #redirect-msg {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            font-weight: bold;
        }
        #back-timer { color: #ffcc00; }
    </style>
</head>
<body>

    <div class="container">
        <div class="level-header">
            <span class="encouragement">🚀 نحو الاحتراف 🚀</span>
            <div class="player-info">
                <h3 id="display-username">جاري التحميل...</h3>
            </div>
            <span class="level-badge">⚽ المستوى المتوسط (50 سؤال) ⚽</span>
        </div>

        <div class="stats-grid" id="stats-ui">
            <div class="stat-card progress">
                <span class="stat-label">السؤال</span>
                <span id="q-num" class="stat-value">0/50</span>
            </div>
            <div class="stat-card points">
                <span class="stat-label">نقاط الجولة</span>
                <span id="session-score" class="stat-value" style="color:#00d2ff">0</span>
            </div>
            <div class="stat-card timer">
                <span class="stat-label">الوقت</span>
                <span id="timer" class="stat-value" style="color:#ffcc00">20</span>
            </div>
        </div>

        <div id="game-area">
            <div id="quiz">
                <div id="question">جاري التحميل...</div>
                <div id="answers" class="answers-container"></div>
            </div>

            <div id="result-box" style="display:none;">
                <h2>🎊 انتهى المستوى! 🎊</h2>
                <span id="rank-text" style="font-size: 28px; font-weight: 900; display: block; margin: 15px 0; color:#00d2ff;"></span>
                <p id="final-stats"></p>
                
                <div id="redirect-msg">سيتم توجيهك لصفحة البداية خلال <span id="back-timer">5</span> ثوانٍ...</div>
                
                <button class="restart-btn" onclick="location.reload()">🔄 تحدي جديد فوراً</button>
            </div>
        </div>

        <button id="skipBtn" onclick="skipQuestion()">
            <span>تخطي السؤال</span>
            <span>⏭</span>
        </button>
    </div>

    <script>
        const bank = [
            {q:"من هو المنتخب الفائز بكأس العالم 2014؟", a:["ألمانيا","الأرجنتين","البرازيل","إسبانيا"], c:"ألمانيا"},
            {q:"في أي نادٍ يلعب كيفين دي بروين حالياً؟", a:["مانشستر سيتي","ليفربول","ريال مدريد","بايرن ميونخ"], c:"مانشستر سيتي"},
            {q:"كم عدد بطولات كأس العالم التي فازت بها فرنسا؟", a:["2","1","3","0"], c:"2"},
            {q:"من هو مدرب مانشستر سيتي الحالي؟", a:["غوارديولا","أنشيلوتي","كلوب","تشافي"], c:"غوارديولا"},
            {q:"أين أقيم نهائي دوري أبطال أوروبا 2023؟", a:["إسطنبول","باريس","لندن","مدريد"], c:"إسطنبول"},
            {q:"من هو الهداف التاريخي لنادي برشلونة؟", a:["ميسي","رونالدينيو","سواريز","إيتو"], c:"ميسي"},
            {q:"كم عدد لاعبي فريق كرة القدم داخل الملعب؟", a:["11","10","12","9"], c:"11"},
            {q:"من هو اللاعب الملقب بـ 'صاروخ ماديرا'؟", a:["كريستيانو رونالدو","ناني","بيبي","فيغو"], c:"كريستيانو رونالدو"},
            {q:"أي منتخب يلقب بـ 'السامبا'؟", a:["البرازيل","الأرجنتين","كولومبيا","المكسيك"], c:"البرازيل"},
            {q:"في أي دوري يلعب نادي يوفنتوس؟", a:["الدوري الإيطالي","الدوري الإسباني","الدوري الألماني","الدوري الفرنسي"], c:"الدوري الإيطالي"},
            {q:"من فاز بالكرة الذهبية لعام 2022؟", a:["بنزيمة","ميسي","ليفاندوفسكي","ماني"], c:"بنزيمة"},
            {q:"ما هو النادي الأكثر فوزاً بالدوري الإنجليزي؟", a:["مانشستر يونايتد","ليفربول","أرسنال","مان سيتي"], c:"مانشستر يونايتد"},
            {q:"من هو الهداف التاريخي لبطولة دوري أبطال أوروبا؟", a:["رونالدينيو","ميسي","بنزيما","ليفاندوفسكي"], c:"رونالدو"},
            {q:"كم دقيقة تستغرق مباراة كرة القدم (بدون وقت بدل ضائع)؟", a:["90","100","80","120"], c:"90"},
            {q:"من هو المنتخب العربي الذي وصل لنصف نهائي مونديال 2022؟", a:["المغرب","تونس","السعودية","الجزائر"], c:"المغرب"},
            {q:"أين يقع مقر الاتحاد الدولي لكرة القدم (FIFA)؟", a:["زيورخ","باريس","لندن","مدريد"], c:"زيورخ"},
            {q:"من سجل هدف الفوز لإسبانيا في نهائي مونديال 2010؟", a:["إنييستا","تشافي","فابريغاس","توريس"], c:"إنييستا"},
            {q:"ما هو النادي الملقب بـ 'الريدز'؟", a:["ليفربول","مانشستر يونايتد","بايرن","أرسنال"], c:"ليفربول"},
            {q:"من هو الحارس التاريخي لمنتخب إسبانيا وريال مدريد؟", a:["كاسياس","بوفون","كان","فان دير سار"], c:"كاسياس"},
            {q:"كم عدد بطولات كأس العالم التي فازت بها إيطاليا؟", a:["4","3","5","2"], c:"4"},
            {q:"من هو صاحب أسرع هدف في تاريخ كأس العالم؟", a:["هاكان شوكور","بيليه","رونالدو","كلوزه"], c:"هاكان شوكور"},
            {q:"في أي نادٍ بدأ ميسي مسيرته الاحترافية؟", a:["برشلونة","نيويلز أولد بويز","باريس","الأرجنتين"], c:"برشلونة"},
            {q:"من هو اللاعب الذي لقب بـ 'الملك' في كرة القدم؟", a:["بيليه","مارادونا","ميسي","رونالدينيو"], c:"بيليه"},
            {q:"أي بلد استضاف كأس العالم 1998؟", a:["فرنسا","إيطاليا","البرازيل","أمريكا"], c:"فرنسا"},
            {q:"من هو الهداف التاريخي للدوري الإسباني؟", a:["ميسي","رونالدو","راؤول","بنزيما"], c:"ميسي"},
            {q:"ما هو النادي الذي يلقب بـ 'المدفعجية'؟", a:["أرسنال","تشيلسي","توتنهام","إيفرتون"], c:"أرسنال"},
            {q:"من هو الفائز بلقب يورو 2020؟", a:["إيطاليا","إنجلترا","إسبانيا","الدنمارك"], c:"إيطاليا"},
            {q:"كم عدد ألقاب نادي ليفربول في دوري أبطال أوروبا؟", a:["6","5","7","4"], c:"6"},
            {q:"من سجل 'هدف القرن' في مرمى إنجلترا عام 1986؟", a:["مارادونا","بيليه","زيكو","بلاتيني"], c:"مارادونا"},
            {q:"أين يلعب النجم البرازيلي نيمار حالياً (2024)؟", a:["الهلال","باريس","برشلونة","النصر"], c:"الهلال"},
            {q:"من هو المدرب التاريخي لنادي مانشستر يونايتد؟", a:["أليكس فيرغسون","فينغر","مورينيو","بيب"], c:"أليكس فيرغسون"},
            {q:"ما هي الدولة الأكثر استضافة لكأس العالم؟", a:["المكسيك","البرازيل","ألمانيا","إيطاليا"], c:"المكسيك"},
            {q:"من فاز بدوري أبطال أوروبا 2012 لأول مرة في تاريخه؟", a:["تشيلسي","مان سيتي","باريس","توتنهام"], c:"تشيلسي"},
            {q:"كم عدد النقاط التي يحصل عليها الفريق عند الفوز؟", a:["3","1","2","0"], c:"3"},
            {q:"من هو الحارس الذي لم يستقبل أي هدف في نهائي مونديال 2010؟", a:["كاسياس","ستيكلنبرج","بوفون","نوير"], c:"كاسياس"},
            {q:"من هو هداف منتخب إنجلترا التاريخي؟", a:["هاري كين","روني","شيرر","لينيكر"], c:"هاري كين"},
            {q:"أي نادٍ يلقب بـ 'البلوز'؟", a:["تشيلسي","ليستر","مان سيتي","إيفرتون"], c:"تشيلسي"},
            {q:"من هو النادي الإيطالي الأكثر فوزاً بدوري أبطال أوروبا؟", a:["ميلان","يوفنتوس","إنتر","روما"], c:"ميلان"},
            {q:"ما هو لون بطاقة الطرد في كرة القدم؟", a:["أحمر","أصفر","أزرق","أسود"], c:"أحمر"},
            {q:"من فاز بكأس أمم أفريقيا 2021؟", a:["السنغال","مصر","الكاميرون","الجزائر"], c:"السنغال"},
            {q:"من هو الملقب بـ 'زيزو'؟", a:["زين الدين زيدان","رونالدينيو","كاكا","نيمار"], c:"زين الدين زيدان"},
            {q:"كم عدد ألقاب ألمانيا في كأس العالم؟", a:["4","3","5","2"], c:"4"},
            {q:"من هو اللاعب الذي سجل 5 أهداف في 9 دقائق؟", a:["ليفاندوفسكي","ميسي","رونالدو","هالاند"], c:"ليفاندوفسكي"},
            {q:"أين أقيم كأس العالم 2002؟", a:["كوريا واليابان","ألمانيا","فرنسا","أمريكا"], c:"كوريا واليابان"},
            {q:"من هو النادي الذي حقق الثلاثية التاريخية في 2023؟", a:["مانشستر سيتي","إنتر ميلان","بايرن","ريال مدريد"], c:"مانشستر سيتي"},
            {q:"ما هي المسافة بين نقطة الجزاء والمرمى؟", a:["11 متر","12 متر","10 متر","9 متر"], c:"11 متر"},
            {q:"من فاز بالدوري الإسباني 2021؟", a:["أتلتيكو مدريد","ريال مدريد","برشلونة","إشبيلية"], c:"أتلتيكو مدريد"},
            {q:"ما هو لقب منتخب هولندا؟", a:["الطواحين","الماكينات","الديوك","الأسود"], c:"الطواحين"},
            {q:"كم عدد ألقاب ميسي في دوري أبطال أوروبا؟", a:["4","3","5","2"], c:"4"},
            {q:"من هو الهداف التاريخي لكأس العالم للمنتخبات؟", a:["ميروسلاف كلوزه","بيليه","ميسي","رونالدو"], c:"ميروسلاف كلوزه"}
        ];

        let quizSet = [];
        let idx = 0;
        let sessionScore = 0;
        let timer;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function init() {
            const savedName = localStorage.getItem('player_username') || "سيرفر المطورين";
            document.getElementById('display-username').innerText = savedName;
            quizSet = shuffle([...bank]);
            loadQ();
        }

        function loadQ() {
            if(idx >= 50 || idx >= quizSet.length) return finish();
            
            clearInterval(timer);
            let timeL = 20;
            document.getElementById('timer').innerText = timeL;
            timer = setInterval(() => {
                timeL--;
                document.getElementById('timer').innerText = timeL;
                if(timeL <= 0) skipQuestion();
            }, 1000);

            document.getElementById('q-num').innerText = `${idx+1}/50`;
            const qData = quizSet[idx];
            document.getElementById('question').innerText = qData.q;
            
            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            
            let currentOptions = [...qData.a];
            shuffle(currentOptions).forEach(txt => {
                const b = document.createElement('button');
                b.className = 'answer-btn';
                b.innerText = txt;
                b.onclick = () => check(b, txt, qData.c);
                ansBox.appendChild(b);
            });
        }

        function check(btn, val, cor) {
            clearInterval(timer);
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(x => x.style.pointerEvents = 'none');

            if(val === cor) {
                btn.classList.add('correct');
                sessionScore++;
                document.getElementById('session-score').innerText = sessionScore;
                
                let total = parseInt(localStorage.getItem('user_total_points')) || 0;
                localStorage.setItem('user_total_points', total + 1);
            } else {
                btn.classList.add('wrong');
                btns.forEach(x => { if(x.innerText === cor) x.classList.add('correct'); });
            }

            setTimeout(() => { idx++; loadQ(); }, 1200);
        }

        function skipQuestion() {
            idx++;
            loadQ();
        }

        function finish() {
            clearInterval(timer);
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            document.getElementById('stats-ui').style.display = 'none';
            const res = document.getElementById('result-box');
            res.style.display = 'block';
            
            let rText = sessionScore > 40 ? "أداء مذهل! ✨" : sessionScore > 20 ? "جيد جداً 👍" : "حاول مرة أخرى ⚽";
            document.getElementById('rank-text').innerText = rText;
            document.getElementById('final-stats').innerText = `جمعت ${sessionScore} نقطة في هذه الجولة!`;

            // عداد تنازلي مرئي للعودة
            let backCount = 5;
            const backTimerLabel = document.getElementById('back-timer');
            const countdown = setInterval(() => {
                backCount--;
                backTimerLabel.innerText = backCount;
                if(backCount <= 0) {
                    clearInterval(countdown);
                    window.location.href = 'index.html';
                }
            }, 1000);
        }

        window.onload = init;
    </script>
</body>
</html>
