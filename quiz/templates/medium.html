<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سيرفر المطورين - المستوى المتوسط</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #0a0a0a;
            /* خلفية زرقاء هادئة للمستوى المتوسط */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 100, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.1) 0%, transparent 50%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(15, 15, 15, 0.95);
            padding: 25px 20px;
            border-radius: 35px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 150, 255, 0.2);
            border: 1px solid #222;
            backdrop-filter: blur(10px);
        }

        .level-header {
            background: linear-gradient(135deg, #0044cc 0%, #001133 100%);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #00d2ff;
        }

        .level-badge { 
            background: #00d2ff; color: #000; 
            padding: 5px 20px; border-radius: 50px; font-size: 13px; font-weight: 900;
            display: inline-block; margin-top: 8px;
        }

        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        .stat-card { background: #111; padding: 12px 5px; border-radius: 15px; border: 1px solid #333; }
        .stat-card.progress { border-bottom: 3px solid #8a2be2; }
        .stat-card.points { border-bottom: 3px solid #00d2ff; }
        .stat-card.timer { border-bottom: 3px solid #ffcc00; }

        .stat-label { font-size: 10px; color: #666; display: block; margin-bottom: 2px; }
        .stat-value { font-size: 16px; font-weight: 900; }

        #game-area {
            background: rgba(25, 25, 25, 0.5);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid #333;
            min-height: 320px;
        }

        #question { 
            font-size: 19px; 
            font-weight: 700; 
            color: #ffffff; 
            margin-bottom: 25px; 
            min-height: 70px;
            line-height: 1.5;
        }

        .answers-container { display: grid; gap: 10px; }
        button.answer-btn {
            background: #1e1e1e; 
            color: #eee; 
            border: 1px solid #333; 
            padding: 15px;
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        button.answer-btn:active { transform: scale(0.97); }
        .correct { background: #00c853 !important; color: white !important; border-color: #00c853 !important; }
        .wrong { background: #ff1744 !important; color: white !important; border-color: #ff1744 !important; }

        #skipBtn { 
            background: none;
            color: #555; border: none; padding: 10px;
            cursor: pointer; font-weight: 700; font-size: 13px; margin-top: 15px;
        }

        #result-box h2 { color: #00d2ff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="level-header">
            <h3 style="margin:0; font-size: 20px;">سيرفر المطورين</h3>
            <span class="level-badge">⚽ المستوى المتوسط ⚽</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card progress">
                <span class="stat-label">السؤال</span>
                <span id="q-num" class="stat-value">0/50</span>
            </div>
            <div class="stat-card points">
                <span class="stat-label">نقاطك</span>
                <span id="current-points" class="stat-value">0</span>
            </div>
            <div class="stat-card timer">
                <span class="stat-label">الوقت</span>
                <span id="timer" class="stat-value">20</span>
            </div>
        </div>

        <div id="game-area">
            <div id="quiz">
                <div id="question">جاري التحميل...</div>
                <div id="answers" class="answers-container"></div>
            </div>

            <div id="result-box" style="display:none;">
                <h2>انتهى المستوى!</h2>
                <span id="rank-text" style="font-size: 28px; font-weight: 900; display: block; margin: 15px 0;"></span>
                <p id="final-stats"></p>
                <button onclick="location.reload()" style="background:#0044cc; color:white; border:none; padding:10px 25px; border-radius:12px; cursor:pointer; font-family:'Cairo';">إعادة المحاولة</button>
            </div>
        </div>

        <button id="skipBtn" onclick="skipQuestion()">تخطي السؤال</button>
    </div>

    <script>
        // مصفوفة الأسئلة (متوسطة الصعوبة)
        const bank = [
            {q:"من هو المنتخب الفائز بكأس العالم 2014؟", a:["ألمانيا","الأرجنتين","البرازيل","إسبانيا"], c:"ألمانيا"},
            {q:"في أي نادٍ يلعب كيفين دي بروين حالياً؟", a:["مانشستر سيتي","ليفربول","ريال مدريد","بايرن ميونخ"], c:"مانشستر سيتي"},
            {q:"كم عدد بطولات كأس العالم التي فازت بها فرنسا؟", a:["2","1","3","0"], c:"2"},
            {q:"من هو مدرب مانشستر سيتي الحالي؟", a:["غوارديولا","أنشيلوتي","كلوب","تشافي"], c:"غوارديولا"},
            {q:"أين أقيم نهائي دوري أبطال أوروبا 2023؟", a:["إسطنبول","باريس","لندن","مدريد"], c:"إسطنبول"},
            {q:"من هو الهداف التاريخي لنادي برشلونة؟", a:["ميسي","رونالدينيو","سواريز","إيتو"], c:"ميسي"},
            {q:"كم عدد لاعبي فريق كرة القدم داخل الملعب؟", a:["11","10","12","9"], c:"11"},
            {q:"من هو اللاعب الملقب بـ 'صاروخ ماديرا'؟", a:["كريستيانو رونالدو","ناني","بيبي","فيغو"], c:"كريستيانو رونالدو"},
            {q:"أي منتخب يلقب بـ 'السامبا'؟", a:["البرازيل","الأرجنتين","كولومبيا","المكسيك"], c:"البرازيل"},
            {q:"في أي دوري يلعب نادي يوفنتوس؟", a:["الدوري الإيطالي","الدوري الإسباني","الدوري الألماني","الدوري الفرنسي"], c:"الدوري الإيطالي"}
            // ... أكمل باقي الـ 50 سؤال هنا بنفس التنسيق
        ];

        let quizSet = [];
        let idx = 0;
        let score = 0;
        let timer;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function init() {
            // جلب النقاط الحالية من الخارج لعرضها فوراً
            const savedPoints = parseInt(localStorage.getItem('user_total_points')) || 0;
            document.getElementById('current-points').innerText = savedPoints;
            
            quizSet = shuffle([...bank]);
            loadQ();
        }

        function loadQ() {
            if(idx >= 50 || idx >= quizSet.length) return finish();
            
            clearInterval(timer);
            let timeL = 20;
            document.getElementById('timer').innerText = timeL;
            timer = setInterval(() => {
                timeL--;
                document.getElementById('timer').innerText = timeL;
                if(timeL <= 0) skipQuestion();
            }, 1000);

            document.getElementById('q-num').innerText = `${idx+1}/50`;
            const qData = quizSet[idx];
            document.getElementById('question').innerText = qData.q;
            
            const ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            
            shuffle([...qData.a]).forEach(txt => {
                const b = document.createElement('button');
                b.className = 'answer-btn';
                b.innerText = txt;
                b.onclick = () => check(b, txt, qData.c);
                ansBox.appendChild(b);
            });
        }

        function check(btn, val, cor) {
            clearInterval(timer);
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(x => x.style.pointerEvents = 'none');

            if(val === cor) {
                btn.classList.add('correct');
                
                // تحديث النقاط الخارجية (localStorage)
                let total = parseInt(localStorage.getItem('user_total_points')) || 0;
                total += 1;
                localStorage.setItem('user_total_points', total);
                
                // تحديث الرقم المعروض في المربع الأزرق
                document.getElementById('current-points').innerText = total;
                score++; 
            } else {
                btn.classList.add('wrong');
                btns.forEach(x => { if(x.innerText === cor) x.classList.add('correct'); });
            }

            setTimeout(() => { idx++; loadQ(); }, 1200);
        }

        function skipQuestion() {
            idx++;
            loadQ();
        }

        function finish() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            const res = document.getElementById('result-box');
            res.style.display = 'block';
            
            let rText = score > 40 ? "أداء مذهل! ✨" : score > 20 ? "جيد جداً 👍" : "حاول مرة أخرى ⚽";
            document.getElementById('rank-text').innerText = rText;
            document.getElementById('final-stats').innerText = `أنهيت 50 سؤالاً بنجاح`;
        }

        window.onload = init;
    </script>
</body>
</html>
