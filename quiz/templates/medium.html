<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 المستوى المتوسط - لوحة الشرف الملكية الذهبية</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(27, 38, 59, 0.7);
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(212, 175, 55, 0.3); /* إطار ذهبي خفيف */
        }

        /* لوحة الشرف الملكية بالثيم الذهبي */
        .honor-board {
            background: linear-gradient(135deg, #d4af37 0%, #f9f295 45%, #b8860b 50%, #f9f295 55%, #d4af37 100%);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #ffffff;
            color: #1a1a1a;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .player-info h3 { margin: 2px 0; font-size: 20px; font-weight: 900; }
        .level-badge { 
            background: #1a1a1a; color: #ffd700; 
            padding: 5px 15px; border-radius: 50px; font-size: 13px; font-weight: bold;
            display: inline-block; margin-top: 5px; border: 1px solid #ffd700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(13, 27, 42, 0.6);
            padding: 12px 5px;
            border-radius: 18px;
            border-bottom: 3px solid #d4af37; /* خط ذهبي */
        }

        .stat-label { font-size: 11px; color: #a2adbb; display: block; }
        .stat-value { font-size: 18px; font-weight: 900; }

        #game-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 25px 15px;
            min-height: 260px;
        }

        #question { font-size: 1.1rem; line-height: 1.5; font-weight: 700; margin-bottom: 20px; }

        .answers-container { display: grid; gap: 10px; }

        button.answer-btn {
            background: #415a77;
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .correct { background: #00e676 !important; color: #000 !important; }
        .wrong { background: #ff5252 !important; }

        #skipBtn {
            background: transparent;
            width: 80%;
            margin-top: 15px;
            padding: 12px;
            border-radius: 50px;
            border: 1px solid #d4af37;
            color: #d4af37;
            font-weight: bold;
            cursor: pointer;
        }

        #final-screen { display: none; }
    </style>
</head>

<body>

    <div class="container">
        <div class="honor-board">
            <div class="player-info">
                <span style="font-size: 11px; font-weight: bold;">ROYAL GOLDEN BOARD</span>
                <h3 id="display-username">جاري التحميل...</h3>
            </div>
            <span class="level-badge">🏆 المستوى المتوسط الذهبي</span>
        </div>

        <div id="ui-main">
            <div class="stats-grid">
                <div class="stat-card"><span class="stat-label">السؤال</span><span id="progress-val" class="stat-value">1/30</span></div>
                <div class="stat-card"><span class="stat-label">الوقت</span><span id="timer-val" class="stat-value" style="color:#ffd60a">25</span></div>
                <div class="stat-card"><span class="stat-label">النقاط</span><span id="score-val" class="stat-value" style="color:#00e5ff">0</span></div>
            </div>

            <div id="game-area">
                <h2 id="question">تجهيز التحدي المتوسط...</h2>
                <div id="answers" class="answers-container"></div>
            </div>

            <button id="skipBtn">⏭ تخطي السؤال</button>
        </div>

        <div id="final-screen">
            <h2 style="color:#ffd700">🌟 تألق ملكي!</h2>
            <div id="final-score" style="font-size:24px; margin:20px 0;"></div>
            <div id="rank" style="font-size:20px; color:#00e5ff; margin-bottom: 20px;"></div>
            <p id="redirect-msg" style="color:#ffd60a;"></p>
        </div>
    </div>

    <script>
        const savedName = localStorage.getItem('username') || "لاعب ذهبي";
        document.getElementById("display-username").textContent = savedName;

        // أسئلة المستوى المتوسط (30 سؤال)
        const questions = [
            { q: "من هو اللاعب الملقب بـ 'الظاهرة'؟", a: ["كريستيانو", "رونالدو نازاريو", "نيمار", "رونالدينيو"], correct: 1 },
            { q: "كم عدد لاعبي الفريق الواحد في الملعب؟", a: ["10", "11", "12", "9"], correct: 1 },
            { q: "أي منتخب فاز بكأس العالم 2014؟", a: ["الأرجنتين", "ألمانيا", "البرازيل", "إسبانيا"], correct: 1 },
            { q: "من هو هداف الدوري الإنجليزي التاريخي؟", a: ["واين روني", "آلان شيرر", "هاري كين", "صلاح"], correct: 1 },
            { q: "أين يقع ملعب الكامب نو؟", a: ["مدريد", "برشلونة", "ميلانو", "لندن"], correct: 1 },
            { q: "ما هي مدة مباراة كرة القدم الأساسية؟", a: ["80 دقيقة", "90 دقيقة", "100 دقيقة", "70 دقيقة"], correct: 1 },
            { q: "من فاز بالكرة الذهبية عام 2022؟", a: ["ميسي", "كريم بنزيما", "هالاند", "مبابي"], correct: 1 },
            { q: "كم مرة فازت البرازيل بكأس العالم؟", a: ["4", "5", "6", "3"], correct: 1 },
            { q: "أي نادٍ يلقب بـ 'البلوز'؟", a: ["مانشستر سيتي", "تشيلسي", "ليفربول", "إيفرتون"], correct: 1 },
            { q: "من هو مدرب مانشستر سيتي الحالي؟", a: ["أنشيلوتي", "غوارديولا", "كلوب", "تشافي"], correct: 1 },
            { q: "في أي دولة أقيم كأس العالم 2010؟", a: ["البرازيل", "جنوب أفريقيا", "ألمانيا", "قطر"], correct: 1 },
            { q: "من سجل هدف الفوز في نهائي مونديال 2010؟", a: ["تشافي", "إنييستا", "فيا", "توريس"], correct: 1 },
            { q: "ما هو لقب منتخب إيطاليا؟", a: ["الماتادور", "الآزوري", "الديوك", "الماكينات"], correct: 1 },
            { q: "أي نادٍ فاز بدوري أبطال أوروبا 2019؟", a: ["توتنهام", "ليفربول", "بايرن ميونخ", "ريال مدريد"], correct: 1 },
            { q: "من هو الهداف التاريخي لنادي ريال مدريد؟", a: ["راؤول", "كريستيانو رونالدو", "بنزيما", "دي ستيفانو"], correct: 1 },
            { q: "أي منتخب يلقب بـ 'الماكينات'؟", a: ["هولندا", "ألمانيا", "فرنسا", "إيطاليا"], correct: 1 },
            { q: "ما هو المنتخب الذي يرتدي اللون البرتقالي؟", a: ["هولندا", "بلجيكا", "البرتغال", "إسبانيا"], correct: 0 },
            { q: "كم عدد تبديلات كرة القدم الحالية؟", a: ["3", "5", "4", "2"], correct: 1 },
            { q: "أين أقيم نهائي دوري الأبطال 2023؟", a: ["باريس", "إسطنبول", "لندن", "مدريد"], correct: 1 },
            { q: "من هو اللاعب الملقب بـ 'البرغوث'؟", a: ["نيمار", "ميسي", "مودريتش", "سواريز"], correct: 1 },
            { q: "أي نادٍ حقق السداسية عام 2009؟", a: ["ريال مدريد", "برشلونة", "بايرن ميونخ", "مانشستر يونايتد"], correct: 1 },
            { q: "من فاز بكأس العالم 2018؟", a: ["كرواتيا", "فرنسا", "بلجيكا", "إنجلترا"], correct: 1 },
            { q: "ما هو لقب منتخب إسبانيا؟", a: ["السامبا", "الماتادور", "الأسود", "النسور"], correct: 1 },
            { q: "كم مرة فازت مصر بكأس أمم أفريقيا؟", a: ["5", "7", "6", "8"], correct: 1 },
            { q: "من هو هداف كأس العالم التاريخي؟", a: ["رونالدو", "كلوزه", "مولر", "بيليه"], correct: 1 },
            { q: "أين يقع ملعب 'أولد ترافورد'؟", a: ["لندن", "مانشستر", "ليفربول", "نيوكاسل"], correct: 1 },
            { q: "أي لاعب يرتدي الرقم 7 في النصر السعودي؟", a: ["ماني", "رونالدو", "تاليسكا", "غريب"], correct: 1 },
            { q: "من فاز بلقب الدوري الإنجليزي 2016 (المفاجأة)؟", a: ["توتنهام", "ليستر سيتي", "أرسنال", "تشيلسي"], correct: 1 },
            { q: "من هو الحارس الذي يلقب بـ 'الاخطبوط'؟", a: ["كاسياس", "بوفون", "نوير", "ياشين"], correct: 1 },
            { q: "من هو صاحب 'يد الله'؟", a: ["ميسي", "مارادونا", "بيليه", "رونالدو"], correct: 1 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timerId;
        let timeLeft = 25;

        function initGame() {
            if (currentQuestion >= questions.length) {
                endGame();
                return;
            }

            document.getElementById("progress-val").innerText = `${currentQuestion + 1}/${questions.length}`;
            let q = questions[currentQuestion];
            document.getElementById("question").innerText = q.q;
            
            let answersDiv = document.getElementById("answers");
            answersDiv.innerHTML = "";

            q.a.forEach((ans, index) => {
                let btn = document.createElement("button");
                btn.className = "answer-btn";
                btn.innerText = ans;
                btn.onclick = () => checkAnswer(index, q.correct, btn);
                answersDiv.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerId);
            timeLeft = 25;
            document.getElementById("timer-val").innerText = timeLeft;
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById("timer-val").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    nextQuestion();
                }
            }, 1000);
        }

        function checkAnswer(selected, correct, btn) {
            clearInterval(timerId);
            let buttons = document.querySelectorAll(".answer-btn");
            buttons.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add("correct");
                score++;
                document.getElementById("score-val").innerText = score;
            } else {
                btn.classList.add("wrong");
                buttons[correct].classList.add("correct");
            }
            setTimeout(nextQuestion, 1200);
        }

        function nextQuestion() {
            currentQuestion++;
            initGame();
        }

        document.getElementById("skipBtn").onclick = () => {
            clearInterval(timerId);
            nextQuestion();
        };

        function endGame() {
            document.getElementById("ui-main").style.display = "none";
            document.getElementById("final-screen").style.display = "block";
            
            document.getElementById("final-score").innerText = `نقاطك: ${score} من 30`;
            
            let rank = "";
            if (score >= 25) rank = "بطل ذهبي محترف 🏆🥇";
            else if (score >= 15) rank = "لاعب ملكي واعد 🌟";
            else rank = "استمر في التدريب للوصول للذهب! ⚽";
            
            document.getElementById("rank").innerText = `اللقب: ${rank}`;
            
            let count = 10;
            const redirectMsg = document.getElementById("redirect-msg");
            const interval = setInterval(() => {
                redirectMsg.innerText = `🔄 العودة خلال ${count} ثوانٍ...`;
                if (count <= 0) {
                    clearInterval(interval);
                    window.location.href = "/";
                }
                count--;
            }, 1000);
        }

        initGame();
    </script>
</body>
</html>
