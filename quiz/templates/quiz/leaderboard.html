
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Quiz - لوحة المتصدرين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(0,0,0,0.7);
            padding: 25px;
            border-radius: 18px;
            width: 90%;
            max-width: 650px;
            margin: 30px auto;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        h1 { color: #ffd700; }
        h2 { color: #ffd700; margin-top: 30px; }
        .player {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.08);
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 10px;
        }
        .rank { color: #ffd700; font-weight: bold; }
        .score { color: #7CFC00; font-weight: bold; }
        .message { color: #ddd; }
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #ffd700;
            color: #111;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 لوحة المتصدرين</h1>

    <h2>⭐ متصدرون النقاط - ابدأ التحدي</h2>
    <div id="pointsBoard" class="message">جاري تحميل النقاط...</div>

    <h2>🏆 متصدرون الكؤوس - خمن اللاعب</h2>
    <div id="cupsBoard" class="message">جاري تحميل الكؤوس...</div>

    <a href="{% url 'welcome' %}" class="back-btn">العودة للرئيسية</a>
</div>

<script>
async function loadLeaderboards() {
    const pointsBoard = document.getElementById("pointsBoard");
    const cupsBoard = document.getElementById("cupsBoard");

    try {
        const response = await fetch("/api/leaderboard/");
        const data = await response.json();

        if (!response.ok || data.status !== "success") {
            throw new Error(data.message || "تعذر تحميل اللوحة");
        }

        function renderBoard(players, field, label) {
            if (!players || players.length === 0) {
                return '<p class="message">لا يوجد لاعبون حتى الآن</p>';
            }

            return players.map((player, index) => `
                <div class="player">
                    <span>
                        <span class="rank">#${index + 1}</span>
                        ${escapeHTML(player.displayName || "لاعب")}
                    </span>
                    <span class="score">${Number(player[field] || 0)} ${label}</span>
                </div>
            `).join("");
        }

        pointsBoard.innerHTML = renderBoard(
            data.pointsLeaderboard, "totalPoints", "نقطة"
        );

        cupsBoard.innerHTML = renderBoard(
            data.cupsLeaderboard, "totalCups", "كأس"
        );

    } catch (error) {
        pointsBoard.textContent = "تعذر تحميل النقاط: " + error.message;
        cupsBoard.textContent = "تعذر تحميل الكؤوس: " + error.message;
    }
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

loadLeaderboards();
setInterval(loadLeaderboards, 15000);
</script>

</body>
</html>
