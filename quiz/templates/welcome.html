<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Quiz - الترحيب</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            font-family: 'Cairo', Tahoma, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .welcome-card {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 15px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        /* تصميم أيقونة الكرة وعلامة السؤال */
        .icon-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .ball-img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .question-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #f1c40f;
            color: #000;
            font-weight: bold;
            font-size: 20px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 24px;
            color: #f1c40f;
            margin-bottom: 8px;
            margin-top: 0;
        }

        p.subtitle {
            color: #b0c4de;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
        }

        .main-btn, .secondary-btn {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            box-sizing: border-box;
            text-align: center;
        }

        .main-btn {
            background: #f1c40f;
            color: #000;
            border: none;
            box-shadow: 0 4px 10px rgba(241, 196, 15, 0.3);
        }

        .main-btn:hover {
            background: #d4ac0d;
        }

        .secondary-btn {
            background: transparent;
            color: #f1c40f;
            border: 2px solid #f1c40f;
        }

        .secondary-btn:hover {
            background: rgba(241, 196, 15, 0.1);
        }

        /* تصميم نافذة طريقة اللعب (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #1b2838;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            border: 1px solid #f1c40f;
            text-align: right;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .modal-content h3 {
            color: #f1c40f;
            margin-top: 0;
            text-align: center;
            font-size: 18px;
        }

        .modal-content ul {
            padding-right: 20px;
            line-height: 1.6;
            font-size: 13px;
            color: #ddd;
        }

        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: block;
            margin: 15px auto 0 auto;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <!-- صورة الكرة وعلامة السؤال -->
        <div class="icon-container">
            <img src="https://cdn-icons-png.flaticon.com/512/53/53283.png" alt="كرة قدم" class="ball-img">
            <div class="question-badge">؟</div>
        </div>

        <h1>Sports Quiz</h1>
        <p class="subtitle">اختبر معلوماتك الرياضية ونافس أصدقاءك في تحدي الملاعب!</p>

        <!-- الأزرار مرتبة تحت بعضها بشكل مريح جداً للموبايل -->
        <div class="buttons-group">
            <a href="{% url 'home' %}" class="main-btn">ابدأ التحدي 🚀</a>
            <button onclick="openModal()" class="secondary-btn">طريقة اللعب 📖</button>
        </div>
    </div>

    <!-- نافذة طريقة اللعب المنبثقة -->
    <div id="rulesModal" class="modal">
        <div class="modal-content">
            <h3>قواعد وطريقة اللعب ⚽</h3>
            <ul>
                <li>كل إجابة صحيحة تزيد نقاطك نقطة واحدة! 🏆</li>
                <li><strong>المساعدات المتاحة:</strong> حذف خيارين خاطئين أو تخطي السؤال.</li>
                <li>تصدّر قائمة الصدارة واثبت أنك أسطورة الرياضة! 🥇</li>
            </ul>
            <button onclick="closeModal()" class="close-btn">حسناً، فهمت</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('rulesModal');
        function openModal() {
            modal.style.display = 'flex';
        }
        function closeModal() {
            modal.style.display = 'none';
        }
        // إغلاق النافذة عند النقر خارجها
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>

</body>
</html>
